300W, 6000 לומן ; נתרן לחץ גבוה 150W, 19500 לומן. איזה מגופי תאורה נצילות גבוהה יותר?", "e": "נתרן: 130 lm/W ; הלוגן: 20 lm/W ; ליבון: 14 lm/W.", "w": ["", "", "", ""], "o": ["נורת נתרן לחץ גבוה.", "נורת הלוגן.", "נורת ליבון.", "לכל הנורות הנתונות אותה נצילות אורית."], "s": ["מחשבים לומן לוואט לכל נורה: ליבון 1400/100 = 14. הלוגן 6000/300 = 20. נתרן 19500/150 = 130.", "הגבוהה ביותר: נתרן."], "tp": "מחלקים לומן בוואט לכל אחת ומשווים."}, {"n": 121, "t": "light", "a": 3, "c": 2, "f": 1, "q": "חשב את רמת ההארה (בלוקס) בנקודה P (גובה 12m, מרחק 7m). יש להיעזר בטבלה: α: 0,15,30,45,60,75,90 ; Iα (cd): 820,890,960,960,890,820,770.", "e": "α = atan(7/12) ≈ 30°, ולכן I ≈ 960cd. r² = 193, cosα = 0.864. E = 960×0.864/193 ≈ 4.3 לוקס.", "w": ["", "", "", ""], "o": ["7.2lx", "6.3lx", "5.7lx", "4.3lx"], "s": ["זווית: tanα = 7/12, ולכן α ≈ 30°. מהטבלה: I ≈ 960cd.", "r² = 12² + 7² = 193, cosα = 12/13.9 = 0.864.", "E = 960 × 0.864/193 ≈ 4.3 לוקס."], "tp": "בטבלה מחפשים את הזווית שחישבת. אם היא בין שתי עמודות – בוחרים את הקרובה."}, {"n": 122, "t": "light", "a": 2, "c": 2, "f": 0, "q": "מהי נצילות אורית?", "e": "נצילות אורית = שטף אור (לומן) חלקי ההספק החשמלי המושקע (ואט).", "w": ["הספק \"מופק\" – שגוי.", "זו נצילות כללית.", "", "הפוך."], "o": ["היחס בין כמות האור הנפלטת מהנורה בשנייה אחת להספק החשמלי המופק ממנה.", "היחס בין ההספק המופק בנורה לעוצמת ההספק המושקע בה.", "היחס בין כמות האור הנפלטת מהנורה בשנייה אחת להספק החשמלי המושקע בה.", "היחס בין ההספק החשמלי המושקע בנורה לכמות האור הנפלטת ממנה."], "s": ["נצילות אורית = שטף אור (לומן, כלומר אור בשנייה) חלקי ההספק החשמלי המושקע.", "המילה החשובה כאן: \"מושקע\" ולא \"מופק\"."], "tp": "יחס אור/הספק, ולא הפוך."}, {"n": 123, "t": "light", "a": 1, "c": 2, "f": 0, "q": "מהו אפקט הסטרובוסקופ?", "e": "הבהוב של 100Hz בנורות פריקה עלול להסתנכרן עם סיבוב של מכונה, והחלק המסתובב נראה עומד – סכנה בעבודה.", "w": ["", "", "", ""], "o": ["השפעת החימום על אורך החיים של נורה בתאורת ליבון.", "תופעה בהארת פלואורסנט הגורמת לגופים מסתובבים להיראות כאילו אינם זזים.", "אפקט הגורם לנורות לד להבהב לאחר כיבוי המתג.", "תהליך יוניזציה היוצר אפקט תאורה בנורות פריקה בגז."], "s": ["נורות פריקה מהבהבות 100 פעם בשנייה.", "כשזה מסתנכרן עם סיבוב של מכונה, החלק המסתובב נראה עומד או זז לאט.", "זו סכנה בעבודה עם מכונות."], "tp": "פתרון בפועל: לחלק את הנורות בין 3 פאזות."}, {"n": 124, "t": "light", "a": 0, "c": 2, "f": 0, "q": "מהו התשלום החודשי שנשלם עבור הארת ספרייה שמידותיה (9X8) מ\"ר בעוצמה של 500 לוקס? נתונים: נצילות המתקן היא 68% ומקדם הפחתה 0.704. התאורה תיעשה באמצעות נורות פלורסנט שכל אחת מהן היא בעלת הספק של 105 וואט ושטף אורי של 9400 לומן. הספרייה פעילה 150 שעות חודשיות ותעריף החשמל 0.65 ₪/kWh.", "e": "N = 500×72/(0.68×0.704×9400) = 8 נורות. אנרגיה: 8×105×150 = 126kWh. עלות: 126×0.65 = 81.90 ₪.", "w": ["", "", "", ""], "o": ["81.90 ₪", "250 ₪", "132 ₪", "524 ₪"], "s": ["N = 500 × 72/(0.68 × 0.704 × 9400) = 8 נורות.", "הספק כולל: 8 × 105 = 840W.", "אנרגיה בחודש: 0.84 × 150 = 126 kWh.", "עלות: 126 × 0.65 = 81.90 ₪."], "tp": "שרשרת: נורות ← הספק ← קוט\"ש ← כסף."}, {"n": 125, "t": "light", "a": 2, "c": 1, "f": 1, "q": "כמה נורות יש להתקין לשם הארת בית מלאכה ששטחו 120 מ\"ר? רמת ההארה הנדרשת היא 500lx, נצילות המתקן היא 71% ומקדם ההפחתה הוא 0.8. הנורות המוצעות הן פלורסנט 13W או נורות לד 11W (לפי הטבלה: פלורסנט 13W = 710 לומן, לד 11W = 1340 לומן).", "e": "Φ נדרש = 500×120/(0.71×0.8) ≈ 105,600 לומן. פלורסנט: 105600/710 ≈ 149. לד: 105600/1340 ≈ 79.", "w": ["", "", "", ""], "o": ["כ-50 נורות פלורסנט או 20 נורות לד.", "כ-100 נורות פלורסנט או 60 נורות לד.", "כ-150 נורות פלורסנט או 80 נורות לד.", "200 נורות פלורסנט או 120 נורות לד."], "s": ["שטף נדרש: Φ = (E × A)/(η × K) = 500 × 120/(0.71 × 0.8) ≈ 105,600 לומן.", "מהטבלה: פלורסנט 13W = 710 לומן → 105600/710 ≈ 149.", "לד 11W = 1340 לומן → 105600/1340 ≈ 79.", "לכן: כ-150 פלורסנט או כ-80 לד."], "tp": "מוצאים בטבלה את השורה לפי ההספק של הנורה שנתון בשאלה."}, {"n": 126, "t": "light", "a": 1, "c": 2, "f": 1, "q": "מהי עוצמת ההארה שתתקבל בנקודה P המצוינת באיור (H = 18m, α = 50°)? הנורה המותקנת היא כספית בעלת שטף אורי של 30klm. יש להיעזר בעקום הפולרי המצורף (cd/klm).", "e": "מהעקום ב-50°: ≈ 350 cd/klm, ולכן I = 350×30 = 10,500cd. r = 18/cos50° = 28m. E = I·cosα/r² ≈ 8.6 לוקס.", "w": ["", "", "", ""], "o": ["5.7lx", "8.6lx", "12.3lx", "17.7lx"], "s": ["מהעקום הפולרי ב-50°: ≈ 350 cd/klm.", "I = 350 × 30 = 10,500cd.", "r = H/cosα = 18/0.643 ≈ 28m.", "E = I × cosα/r² = 10500 × 0.643/784 ≈ 8.6 לוקס."], "tp": "עקום פולרי נתון לכל 1000 לומן – מכפילים בשטף של הנורה (כאן 30)."}, {"n": 127, "t": "light", "a": 1, "c": 2, "f": 1, "q": "מהו עקרון הפעולה של נורת הלד?", "e": "LED = Light Emitting Diode: צומת מוליך-למחצה שפולט אור כשעובר בו זרם בכיוון הקדמי.", "w": ["זו נורת פריקה.", "", "זו נורת ליבון.", "זו נורת פריקה."], "o": ["תהליך יוניזציה הגורם להארה.", "דיודה הפולטת אור בשל מעבר זרם.", "חימום חוט להט עד כדי כך שהחוט פולט אור.", "פריקה בגז הגורמת לפליטת אור."], "s": ["LED = Light Emitting Diode.", "כשעובר זרם בכיוון הקדמי דרך צומת מוליך-למחצה, הוא פולט אור."], "tp": "אין חוט ואין גז – רק דיודה."}, {"n": 128, "t": "light", "a": 1, "c": 1, "f": 0, "q": "תכנן קו הזנה (מאמ\"ת + חתך מוליך) להארת מעבדה 40X30. רמת ההארה הנדרשת היא 1,000 לוקס, מקדם ההפחתה הוא 0.802 ונצילות המתקן 68%. התאורה תותקן באמצעות נורות פלורסנט 105 ואט ושטף אורי של 9,400 לומן. ההזנה היא תלת-מופעית, המתח 400 וולט ומקדם ההספק של כל המערכת הוא 0.92. שיטת התקנה ו' (טבלה 70.4) היא באמצעות מוליכי נחושת ללא תנאים מיוחדים.", "e": "N = 1000×1200/(0.802×0.68×9400) ≈ 235 נורות. P ≈ 24.7kW. I = 24700/(√3×400×0.92) ≈ 38.7A. לכן מאמ\"ת 3X40A ומוליך 10 ממ\"ר.", "w": ["קטן מדי.", "", "32A קטן מ-38.7A.", "קטן מדי."], "o": ["In = 3X25A, A = 6mm²", "In = 3X40A, A = 10mm²", "In = 3X32A, A = 10mm²", "In = 3X32A, A = 6mm²"], "s": ["N = 1000 × 1200/(0.802 × 0.68 × 9400) ≈ 235 נורות.", "הספק: 235 × 105 ≈ 24.7kW.", "I = 24700/(√3 × 400 × 0.92) ≈ 38.7A.", "מבטח 3×40A ומוליך 10 ממ\"ר (בטבלה, 40A מחייב 10 ממ\"ר)."], "tp": "שאלה משולבת: תאורה ← הספק ← זרם ← מבטח וחתך."}, {"n": 129, "t": "shock", "a": 2, "c": 1, "f": 1, "q": "חשמלאי הרכיב מפסק מגן (ממסר פחת) 4×25A כפי שבאיור (בהזנה חד-מופעית). למה החשמלאי ביצע חיבור זה?", "e": "נגד הבדיקה (R) של כפתור TEST מחובר בין מגעים מסוימים. בגישור הזה הזרם עובר דרך הנגד גם בחד-מופעי, ולכן כפתור הבדיקה עובד.", "w": ["", "זה אמנם מאפשר שימוש בחד-מופעי, אבל המטרה המיוחדת של הגישור היא ה-TEST.", "", "אין קצר."], "o": ["כדי להכפיל את הרגישות של מפסק מגן.", "כדי להתקין מפסק מגן תלת-מופעי בזינה החד-מופעית.", "כדי לבצע בדיקת קיום זליגה במצב TEST.", "טעה וקיצר מוליך האפס במגע של מופע."], "s": ["בפחת יש כפתור TEST עם נגד, שמחובר בין מגעים מסוימים.", "בחד-מופעי, אם מחברים רק לחלק מהמגעים, ה-TEST עלול לא לעבוד.", "הגישור בשרטוט מעביר זרם דרך המגעים שמחוברים לנגד, וכך כפתור הבדיקה פועל."], "tp": "כשמחברים פחת 4 קטבים לחד-מופעי, בודקים בשרטוט שלו לאיזה מגע הנגד מחובר."}, {"n": 130, "t": "shock", "a": 0, "c": 1, "f": 0, "q": "האם יש הגבלת זמן תגובה של מבטח במקרה של קצר בין מופע לגוף מאורק?", "e": "לפי התקנות, בקצר לגוף מאורק המבטח חייב לנתק תוך 5 שניות לכל היותר.", "w": ["", "זה זמן תגובה של פחת.", "יש הגבלה מספרית.", "מבטח כן מגן במקרה כזה."], "o": ["מבטח חייב לנתק את מעגל התקלה תוך 5 שניות.", "מבטח חייב לנתק את מעגל התקלה תוך 40 מילי-שניות (2 מחזורי זרם).", "מבטח חייב לנתק את מעגל התקלה מיידי (אין הגבלה מספרית).", "מבטח אינו מיועד להגיב לתקלה מסוג זה."], "s": ["בקצר בין מופע לגוף מאורק יש מתח מגע מסוכן.", "התקנות מחייבות שהמבטח ינתק תוך 5 שניות לכל היותר."], "tp": "40ms זה זמן תגובה של פחת, לא של מבטח."}, {"n": 131, "t": "shock", "a": 2, "c": 1, "f": 1, "q": "חשמלאי מצא במחסן מפסק מגן (ממסר פחת) שבאיור (Eaton PF6-25/4/003, In = 40A, IΔn = 0.03A, Inc = 6000A). האם ניתן להרכיב אותו בלוח חשמל עם מאמ\"ת ראשי 3X25A?", "e": "זרם נקוב של 40A גדול מ-25A של המאמ\"ת הראשי – תקין, כי המאמ\"ת מגן על המפסק. 30mA ו-6kA גם מתאימים. כדאי לבדוק עם המורה אם יש דרישה לסוג A במקום AC.", "w": ["גדול מהמאמ\"ת – זה דווקא תקין.", "נכון חלקית – לא מתייחס לשאר הנתונים.", "", "כדאי לבדוק מול התקנות העדכניות."], "o": ["זרם הנקוב של המפסק גדול מזרם הנקוב של מאמ\"ת ראשי, לכן לא ניתן להתקין.", "זרם הנקוב של המפסק גדול מזרם הנקוב של מאמ\"ת ראשי, לכן מותר להתקין.", "כל הנתונים הנקובים של המפסק תקינים, לכן מותר להתקין.", "לפי חוק החשמל, אסור להחליף מפסק ישן בחדש מסוג AC. לכן, לא ניתן להתקין."], "s": ["בודקים את נתוני הפחת: In = 40A, IΔn = 30mA, Inc = 6kA.", "40A גדול מ-25A של המאמ\"ת הראשי – זה תקין, כי המאמ\"ת מגן על הפחת מעומס יתר.", "30mA מתאים להגנה על בני אדם, ו-6kA מתאים לזרם קצר בדירה.", "לכן כל הנתונים תקינים. לבדוק עם המורה אם יש דרישה לסוג A במקום AC."], "tp": "פחת מותר שיהיה גדול מהמאמ\"ת שלפניו, לא קטן ממנו."}, {"n": 132, "t": "earth", "a": 0, "c": 1, "f": 0, "q": "כידוע, שיטת איפוס מודרני (TN-C-S) היא הטובה והנפוצה. בזמן שיפוצים כלליים בוילה הישנה (משנות ה-50) חשמלאי הציע להחליף את כל התשתית של חשמל ולעבור לשיטת האיפוס המודרני. בוילה קיימת אלקטרודת הארקה מקומית. האם יצליח לעשות זאת?", "e": "במבנה ישן בלי הארקת יסוד אפשר לעבור לאיפוס, אם מחליפים את התשתית ומבצעים השוואת פוטנציאלים מלאה (עם אלקטרודה מתאימה). כדאי לבדוק עם המורה מול התקנות.", "w": ["", "גודל החיבור לא קובע.", "גודל השנאי לא קובע.", "ייתכן לפי פרשנות מחמירה – כדאי לבדוק."], "o": ["במקרה שמחליפים את תשתית החשמל ומוסיפים השוואת פוטנציאלים, אפשר לעבור לשיטת האיפוס במקרה זה.", "החשמלאי יהיה מוגבל ע\"י גודלו של מאמ\"ת הראשי: עד 3X80A אין שום בעיה לעבור לשיטת האיפוס. מעבר לכך יש לקבל אישור של חשמלאי מהנדס בלבד.", "זה תלוי בגודלו של שנאי של חברת החשמל. במקרה שהוא בעל הספק 630 KVA ויותר אין שום בעיה.", "לא ניתן לעבור לשיטת האיפוס כי במבנה אין הארקת יסוד, ובלעדיה אסור להקים שיטת האיפוס."], "s": ["איפוס מחייב חיבור אמין של האפס להארקה, והשוואת פוטנציאלים.", "במבנה ישן בלי הארקת יסוד אפשר לבצע זאת כשמחליפים את התשתית ומבצעים השוואת פוטנציאלים מלאה.", "התשובה מוצעת – לבדוק מול התקנות."], "tp": "גודל החיבור או השנאי לא קובעים את שיטת ההגנה."}, {"n": 133, "t": "earth", "a": 2, "c": 1, "f": 0, "q": "כאשר לא ידועה התנגדות בין מוליך ההגנה למסה כללית של אדמה (בשיטת זינה צפה), אל איזה גודל הבידוד יש לכוונן את הפעלת התרעה של משגוח?", "e": "המשגוח מתריע כשהבידוד יורד. הערך נמדד ב\"אום לכל וולט\" של מתח הרשת – 85Ω/V.", "w": ["היחידה שגויה (ואט).", "התרעה כשהבידוד יורד, לא עולה.", "", "התרעה כשהבידוד יורד."], "o": ["כאשר התנגדות הבידוד יורדת מתחת ל-85 אום לואט.", "כאשר התנגדות הבידוד עולה מעל 85 אום לואט.", "כאשר התנגדות הבידוד יורדת מתחת ל-85 אום לוולט.", "כאשר התנגדות הבידוד עולה מעל 85 אום לוולט."], "s": ["בזינה צפה המשגוח מודד את התנגדות הבידוד של הרשת לאדמה.", "התרעה כשהבידוד יורד מתחת לסף.", "הסף נמדד באום לכל וולט של מתח הרשת: 85Ω/V."], "tp": "\"יורדת\" + \"לוולט\". שתי מילים קטנות שמבדילות בין התשובות."}, {"n": 134, "t": "earth", "a": 2, "c": 1, "f": 0, "q": "ידוע שבשיטת הפרד מגן (שנאי מבדל) יש הגבלה בהפעלת צרכן אחד בלבד. האם יש גם הגבלה במתח היציאה של השנאי?", "e": "בהפרד מגן מתח המשני מוגבל ל-500V לכל היותר.", "w": ["יש הגבלה.", "הגבלה רחבה מדי.", "", "זה מתח נמוך מאוד – שיטה אחרת."], "o": ["אין הגבלה במתח היציאה בתנאי ששנאי בעל בידוד כפול.", "בשיטה זאת ניתן להזין את הצרכנים רק במתח נמוך (עד 1,000 וולט).", "מתח היציאה של שנאי מבדל מוגבל עד 500 וולט.", "מתח היציאה של שנאי מבדל מוגבל עד 50 וולט."], "s": ["הפרד מגן = שנאי מבדל שמזין צרכן אחד.", "מתח המשני מוגבל: עד 500V."], "tp": "50V זה מתח נמוך מאוד – שיטה אחרת לגמרי."}, {"n": 135, "t": "earth", "a": 1, "c": 0, "f": 0, "q": "במתקן המוזן משנאי ומוגן בעזרת \"הפרד מגן\", האם קיימת הגבלה למתח שבין מוליכי המתקן?", "e": "שאלה בניסוח לא ברור. התשובה המקובלת היא שהשנאי מוזן ממתח נמוך (עד 1,000V). כדאי לבדוק עם המורה.", "w": ["", "", "", ""], "o": ["אין הגבלה במתח הראשוני, חשוב שמתח המשני יהיה בטווח הנדרש.", "מתח הראשוני חייב להיות עד 1,000 וולט.", "מתח הראשוני חייב להיות עד 500 וולט.", "מתח הראשוני חייב להיות עד 250 וולט."], "s": ["שאלה בניסוח לא ברור.", "התשובה המקובלת: השנאי מוזן ממתח נמוך – עד 1,000V.", "לבדוק עם המורה."], "tp": "מתח נמוך = עד 1,000V. זה הגבול הכללי של כל הקורס."}, {"n": 136, "t": "wet", "a": 0, "c": 1, "f": 0, "q": "כדי לאפשר ניידות גבוהה באתר בנייה צבאי המוזן במתח נמוך מאוד, התקין חשמלאי תקעים ובתי-תקע רגילים (230V, 16A). לחשמלאי בודק הסביר זה כך שאביזרים אלה עומדים עד מתח 230 וולט, לכן בוודאי יעמדו במתח נמוך מאוד (24V בצבא). כמו כן, הם עומדים בהספק של 16X230 = 3680 ואט, לכן אין שום בעיה להפעיל מכשירים של 24 וולט בהספק קטן יותר. הבודק לא אישר. למה?", "e": "התקנות מחייבות שתקעים ובתי תקע של מתח נמוך מאוד לא יתאימו לבתי תקע של מתח רגיל, כדי למנוע חיבור בטעות של ציוד 24V ל-230V או להפך.", "w": ["", "לא הסיבה.", "נכון חשבונית, אבל הסיבה העקרונית היא אי-התאמת התקעים.", "שגוי."], "o": ["כי במתח נמוך מאוד חייבים להתקין תקעים ובתי-תקעים מיוחדים (כדי לא לחבר בטעות למתח גבוהה).", "כי מתח בדיקה של ציוד העובד במתח נמוך מאוד חייב להיות 250V לפחות.", "כי במתח 24V מכשיר נייד של 600 ואט צורך זרם של 25 אמפר, ובית-תקע רגיל מיועד לזרם עד 16 אמפר.", "חשמלאי בודק לא רצה לחשוב בהיגיון ומנע את ניידות באתר."], "s": ["הסיבה העקרונית בתקנות: תקעים ובתי תקע של מתח נמוך מאוד חייבים להיות שונים מאלה של 230V.", "ככה אי אפשר לחבר בטעות ציוד של 24V לשקע של 230V או להפך.", "גם החשבון של הזרם נכון (600W/24V = 25A), אבל זו לא הסיבה המרכזית."], "tp": "מתח נמוך מאוד = שקעים מיוחדים שלא מתאימים לשקע רגיל."}, {"n": 137, "t": "earth", "a": 3, "c": 0, "f": 0, "q": "מהן המידות המזעריות של אלקטרודת הארקה עשויה פלדה מגולוונת בצורת לוח?", "e": "לפי התקנות לאלקטרודות הארקה, ללוח פלדה מגולוונת יש שטח ועובי מזעריים. התשובה המקובלת: 1 מ\"ר ו-3 מ\"מ. כדאי לוודא מול התקנות.", "w": ["", "", "", ""], "o": ["שטח 0.5 מ\"ר לפחות בעובי 1.5 מ\"מ לפחות.", "שטח 0.5 מ\"ר לפחות בעובי 3 מ\"מ לפחות.", "שטח 1 מ\"ר לפחות בעובי 1.5 מ\"מ לפחות.", "שטח 1 מ\"ר לפחות בעובי 3 מ\"מ לפחות."], "s": ["לאלקטרודת לוח יש מידות מזעריות בתקנות.", "התשובה המקובלת: שטח 1 מ\"ר ועובי 3 מ\"מ. לוודא מול התקנות."], "tp": "לזכור את הזוג 1 מ\"ר / 3 מ\"מ."}, {"n": 138, "t": "earth", "a": 0, "c": 2, "f": 0, "q": "מהי מטרתה של הארקת שיטה?", "e": "הארקת השיטה (נקודת הכוכב של השנאי) מייצבת את מתח הפאזות ביחס לאדמה ומאפשרת להגנות לפעול בתקלה.", "w": ["", "זה תפקיד הארקת ההגנה.", "לא המטרה.", "שגוי."], "o": ["לייצב מתח השיטה לאדמה ולהפעיל את הגנת השיטה בזמן התקלה.", "להגן אל האדם מפני חישמול.", "להאריק את השנאי של חברת החשמל (כי כל גוף המתכתי חייב להיות מאורק).", "גורם מיותר שמביא לחישמול האדם ע\"י סגירת המעגל דרך האדמה."], "s": ["הארקת שיטה = חיבור נקודת הכוכב של השנאי לאדמה.", "היא מייצבת את מתח הפאזות ביחס לאדמה.", "היא מאפשרת זרם תקלה, וכך ההגנות פועלות."], "tp": "הארקת שיטה = שנאי. הארקת הגנה = גופי הצרכנים."}, {"n": 139, "t": "earth", "a": 1, "c": 0, "f": 0, "q": "התנגדות החשמלית בין האלקטרודה המקומית המיועדת להארקה הגנה לבין המסה הכללית של האדמה לא תעלה על (נמדדת באמצעות T.L):", "e": "יש בתקנות ערך מרבי להתנגדות אלקטרודה מקומית. התשובה המקובלת היא 5Ω, אבל יש ספרות שמציינת ערך אחר (ראו גם שאלה 11). כדאי לבדוק עם המורה.", "w": ["", "", "", ""], "o": ["3Ω", "5Ω", "10Ω", "20Ω"], "s": ["יש בתקנות ערך מרבי להתנגדות אלקטרודה מקומית להארקת הגנה.", "התשובה המקובלת: 5Ω. יש ספרות שמציינת ערך אחר (ראו שאלה 11) – לבדוק עם המורה."], "tp": "אותה שאלה מופיעה שוב ב-142 – כדאי לענות אותו דבר בשתיהן."}, {"n": 140, "t": "earth", "a": 1, "c": 2, "f": 0, "q": "הארקת שיטה תפקידה:", "e": "הארקת השיטה מצמידה את נקודת הכוכב של השנאי לפוטנציאל האדמה (אפס).", "w": ["זה תפקיד הארקת ההגנה.", "", "לא התפקיד.", "לא התפקיד."], "o": ["להגן עלינו בפני התחשמלות.", "לאלץ פוטנציאל אפס בנקודת הכוכב.", "לאזן בין הזרמים ברשת.", "להגן מפני שריפה."], "s": ["הארקת שיטה מחברת את נקודת הכוכב של השנאי לאדמה.", "כך הפוטנציאל של נקודת הכוכב נשאר אפס."], "tp": "להגן מפני התחשמלות = הארקת הגנה. לאלץ אפס בכוכב = הארקת שיטה."}, {"n": 141, "t": "earth", "a": 1, "c": 2, "f": 0, "q": "איזה מהשיטות נגד התחשמלות פועלות על עקרון מניעת סגירת לולאת התקלה דרך גוף האדם?", "e": "בזינה צפה ובשנאי מבדל אין חיבור לאדמה, ולכן נגיעה במופע אחד לא סוגרת מעגל דרך הגוף.", "w": ["פחת מנתק אחרי שהלולאה נסגרה.", "", "לא העיקרון.", "שיטות שמנתקות אחרי תקלה."], "o": ["שנאי מבדל, ממסר פחת.", "זינה צפה, שנאי מבדל.", "הארקת יסוד, בידוד כפול.", "הארקת הגנה, הארקת איפוס."], "s": ["כדי שיעבור זרם בגוף צריך מעגל סגור דרך האדמה.", "בזינה צפה ובשנאי מבדל אין חיבור של המקור לאדמה.", "לכן נגיעה במופע אחד לא סוגרת מעגל דרך הגוף."], "tp": "פחת והארקות לא מונעים מעגל – הם מנתקים אחרי שנוצר."}, {"n": 142, "t": "earth", "a": 1, "c": 0, "f": 0, "q": "התנגדות החשמלית בין האלקטרודה המקומית המיועדת להארקה הגנה לבין המסה הכללית של האדמה לא תעלה על ערך של:", "e": "אותה שאלה כמו 139. התשובה המקובלת היא 5Ω. כדאי לבדוק עם המורה.", "w": ["", "", "", ""], "o": ["3Ω", "5Ω", "10Ω", "15Ω"], "s": ["אותה שאלה כמו 139.", "התשובה המקובלת: 5Ω. לבדוק עם המורה."], "tp": "כשאותה שאלה חוזרת עם אפשרויות קצת שונות – הערך הנכון זהה."}, {"n": 143, "t": "shock", "a": 2, "c": 0, "f": 0, "q": "עוצמת הזרם שלא גורמת לשינוי פיזיקלי בגוף האדם (בכלל):", "e": "זרמים קטנים (מתחת לכמה mA) בדרך כלל לא גורמים נזק. סף התחושה ≈ 0.5mA, ומעל ≈ 10mA מתחילה התכווצות שרירים. התשובה המקובלת: מתחת ל-5mA. כדאי לבדוק עם המורה.", "w": ["30mA כבר מסוכן.", "מעל 10mA זה כבר מסוכן.", "", "ייתכן שזו כוונת המאגר – כדאי לבדוק."], "o": ["עד 30mA.", "מעל 10mA.", "מתחת ל-5mA.", "אין עוצמת זרם שלא גורמת לשינוי פיזיקלי בגוף האדם."], "s": ["סף התחושה בערך 0.5mA.", "מעל כ-10mA השרירים מתכווצים וקשה לשחרר.", "30mA זה הגבול של פחת להגנה על אדם.", "התשובה המקובלת: מתחת ל-5mA. לבדוק עם המורה."], "tp": "30mA זה כבר מסוכן – לכן פחת מנתק בו."}, {"n": 144, "t": "earth", "a": 2, "c": 2, "f": 0, "q": "תפקידה של הארקת איפוס:", "e": "באיפוס זרם התקלה חוזר במוליך מתכתי (PEN/PE) ולא דרך האדמה. העכבה נמוכה, ולכן זרם התקלה גדול והמבטח מנתק מהר.", "w": ["", "לא תפקיד האיפוס.", "", "ההפך."], "o": ["להגן על המכשירים בפני שריפה.", "לגרום לממסר פחת לקפוץ בזרם של 30mA.", "להקטין את עכבת לולאת התקלה.", "להגדיל את העכבה של לולאת התקלה."], "s": ["באיפוס זרם התקלה חוזר במוליך מתכתי (PE/PEN) ולא דרך האדמה.", "לכן עכבת הלולאה נמוכה.", "עכבה נמוכה = זרם תקלה גדול = המבטח מנתק מהר."], "tp": "איפוס = עכבה נמוכה = זרם גדול = ניתוק מהיר."}, {"n": 145, "t": "earth", "a": 1, "c": 2, "f": 0, "q": "הארקת איפוס:", "e": "עכבת לולאה נמוכה = זרם קצר חד-פאזי (פאזה-גוף) גדול, ולכן ניתוק מהיר.", "w": ["", "", "", "הזרם חוזר במוליך, לא דרך האדמה."], "o": ["מקטינה את זרם הקצר החד-פאזי במעגל.", "מגדילה את זרם הקצר החד-פאזי במעגל.", "לא גורמת לשינוי בזרם הקצר החד-פאזי במ function start(mode,qs,limit,code){if(!qs.length)return toast('אין שאלות');S.sess={mode,qs,i:0,ans:{},t0:Date.now(),limit:limit||0,code:code||''};save();location.hash='#quiz';if(location.hash==='#quiz')quiz()}

 <div id="ops">${q.o.map((o,i)=>{const lk=inst&&a!=null;const cl=lk?(i===q.a?'ok':i===a?'no':''):(a===i?'pick':'');

 ${inst&&a!=null?`<p class="fb" style="color:${a===q.a?'var(--ok)':'var(--bad)'}">${a===q.a?'✓ נכון!':'✗ לא נכון'}</p>${solve(q,a,a!==q.a)}`:''}

 app.querySelectorAll('.opt[data-i]').forEach(b=>b.onclick=()=>{if(inst&&s.ans[q.n]!=null)return;s.ans[q.n]=+b.dataset.i;save();

  ['L1','L2','L3'].forEach((t,i)=>{const p=P[i];g+=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="currentColor"/><text x="${p[0]}" y="${p[1]+(i?28:-14)}" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${t}</text>`});
  s.innerHTML=g;$('#sdo').innerHTML=Y?'<b>כוכב:</b> כל סליל מקבל 230V (400/√3).<br>זרם הקו ומומנט ההתנעה קטנים פי 3 לעומת משולש.<br>לכן מתניעים בכוכב ועוברים למשולש.':'<b>משולש:</b> כל סליל מקבל 400V מלאים.<br>זה מצב העבודה של מנוע Δ400/Y690.<br>זרם הקו גדול פי √3 מזרם הסליל.';

(async()=>{try{const c=window.claude;if(!c||!c.use)return;user=await c.use('user');db=await c.use('db');if(!db)return;
 uid=user?await user.id():null;if(user){const w=await user.can('data.write');if(w===false)canW=false;
  try{const me=await user.me();if(me&&me.name&&!S.name){S.name=me.name.split(' ')[0];save()}}catch(e){}}

 if(uid){try{const d=await db.doc('data/users/'+uid+'/progress').get();if(d.exists){const r=d.data();if((r.at||0)>(S.at||0)&&r.s){const loc=S;S=Object.assign(load(),JSON.parse(r.s));S.sess=loc.sess||S.sess;try{localStorage.setItem('elx',JSON.stringify(S))}catch(e){}route()}}}catch(e){}}

function wk(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10)}
async function pushScore(R){if(!db){if(!S.cls)return;try{const tp={};R.qs.forEach(n=>{if(R.ans[n]==null)return;const t=BY[n].t;const a=tp[t]||[0,0];a[0]++;if(R.ans[n]===BY[n].a)a[1]++;tp[t]=a});
 await rpc('push_score',{...me(),p_wk:wk(),p_r:R.r,p_tot:R.tot,p_topics:tp});if(R.code)await rpc('add_challenge',{...me(),p_code:R.code,p_r:R.r,p_tot:R.tot})}catch(e){}return}
 if(!uid||!canW)return;try{
 const ref=db.doc('scores/'+uid);const g=await ref.get();const o=g.exists?JSON.parse(JSON.stringify(g.data())):{};const w=wk();
 if(o.wk!==w){o.wk=w;o.wt=0;o.wr=0}o.wt=(o.wt||0)+R.tot;o.wr=(o.wr||0)+R.r;o.tot=(o.tot||0)+R.tot;o.r=(o.r||0)+R.r;o.topics=o.topics||{};
 R.qs.forEach(n=>{const t=BY[n].t;const a=o.topics[t]||[0,0];a[0]++;if(R.ans[n]===BY[n].a)a[1]++;o.topics[t]=a});o.at=Date.now();await ref.set(o);
 if(R.code){const c=db.doc('challenges/'+uid);const cg=await c.get();const co=cg.exists?JSON.parse(JSON.stringify(cg.data())):{items:{}};co.items=co.items||{};
  co.items[R.code]={r:R.r,tot:R.tot,at:Date.now()};await c.set(co)}}catch(e){if(e&&e.code==='invalid_argument')canW=false}}
async function loadTips(ns){if(!db){if(!S.cls)return;try{const r=await rpc('get_tips',{p_class:S.cls.code});const tips={};(r||[]).forEach(x=>(tips[x.qn]=tips[x.qn]||[]).push(x));
 document.querySelectorAll('.tips').forEach(el=>{el.innerHTML='';(tips[el.dataset.q]||[]).forEach(x=>{const p=document.createElement('p');p.className='note';p.textContent='💡 '+(x.name||'חבר לכיתה')+': '+String(x.body).slice(0,400);el.appendChild(p)})})}catch(e){}return}
 try{const s=await db.collection('tips').get();const tips={};
 s.docs.forEach(d=>{const it=(d.data()||{}).items||{};Object.entries(it).forEach(([n,t])=>{(tips[n]=tips[n]||[]).push({u:d.id,t})})});
 const ids=[...new Set(Object.values(tips).flat().map(x=>x.u))];const ps=user&&ids.length?await user.profiles(ids):{};
 document.querySelectorAll('.tips').forEach(el=>{const L2=tips[el.dataset.q]||[];el.innerHTML='';L2.forEach(x=>{const p=document.createElement('p');p.className='note';
  p.textContent='💡 '+((ps[x.u]&&ps[x.u].name)||'חבר לכיתה')+': '+String(x.t).slice(0,400);el.appendChild(p)})})}catch(e){}}
function tipForm(n,kind){const box=document.querySelector(`.tips[data-q="${n}"]`);if(!box)return;
 if(!db&&!S.cls){toast('כדי לשתף, הצטרף קודם לכיתה בלשונית כיתה');location.hash='#class';return}if(db&&!uid){toast('שיתוף עם הכיתה לא זמין כאן');return}
 const f=document.createElement('div');f.innerHTML=`<label>${kind==='tips'?'הטיפ שלך (יופיע לכל הכיתה)':'מה לדעתך שגוי בשאלה?'}</label><textarea rows="2" maxlength="400"></textarea><div class="row" style="margin-top:6px"><button class="pri">שלח</button><span class="mut"></span></div>`;
 box.appendChild(f);const ta=f.querySelector('textarea');ta.focus();
 f.querySelector('button').onclick=async()=>{const t=ta.value.trim();const m=f.querySelector('.mut');if(!t){m.textContent='כתוב משהו קודם';return}
  try{if(!db){await rpc('add_note',{...me(),p_kind:kind==='tips'?'tip':'report',p_qn:n,p_body:t});f.remove();toast(kind==='tips'?'הטיפ נשמר ויופיע לחברים':'הדיווח נשמר');if(kind==='tips')loadTips();return}
  const ref=db.doc(kind+'/'+uid);const g=await ref.get();const o=g.exists?JSON.parse(JSON.stringify(g.data())):{items:{}};o.items=o.items||{};o.items[n]=t;await ref.set(o);
  f.remove();toast(kind==='tips'?'הטיפ נשמר ויופיע לחברים':'הדיווח נשמר');if(kind==='tips')loadTips()}catch(e){m.textContent='לא נשמר – ייתכן שאין לך הרשאת כתיבה בדף'}}}
function seeded(code){let h=1779033703;for(const c of code)h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}

function joinForm(){const c=document.createElement('div');c.className='card';
 c.innerHTML=`<h2>הצטרפות לכיתה</h2><label for="jn_n">השם שלך (יופיע בטבלה)</label><input id="jn_n" maxlength="40" value="${esc(S.name||'')}">

   S.cls={code,pid:rid(),sec:rid()+rid(),name:n};if(!S.name)S.name=n.split(' ')[0];await rpc('join_class',me());save();toast('הצטרפת לכיתה '+code);clsView()}
  catch(err){e.textContent='אין חיבור כרגע – נסה שוב';$('#jn_b').disabled=false}}}
async function classData(){
 if(!db){const [sc,ch]=await Promise.all([rpc('get_scores',{p_class:S.cls.code}),rpc('get_challenges',{p_class:S.cls.code})]);
  return{rows:(sc||[]).map(r=>({...r,me:r.player_id===S.cls.pid})),ch:(ch||[]).map(x=>({...x,me:x.player_id===S.cls.pid}))}}
 const s=await db.collection('scores').get();const rows=s.docs.map(d=>({u:d.id,...d.data()}));
 const c=await db.collection('challenges').get();const ch=[];c.docs.forEach(d=>Object.entries((d.data()||{}).items||{}).forEach(([k,v])=>ch.push({code:k,u:d.id,...v})));
 const ids=[...new Set(rows.map(r=>r.u).concat(ch.map(x=>x.u)))];const ps=user&&ids.length?await user.profiles(ids):{};
 const nm=u=>(ps[u]&&ps[u].name)||'';rows.forEach(r=>{r.name=nm(r.u);r.me=r.u===uid});ch.forEach(x=>{x.name=nm(x.u);x.me=x.u===uid});ch.reverse();return{rows,ch}}
async function clsView(){
 app.innerHTML=`<h1>הכיתה</h1>
 <div class="card"><h2>אתגר חבר</h2><p class="mut">צור קוד ושלח אותו לחבר. שניכם תקבלו בדיוק אותן 15 שאלות, והתוצאות יופיעו כאן.</p>
 <div class="row"><button class="pri" id="mk">צור קוד חדש</button><input id="cd" placeholder="הזן קוד שקיבלת, למשל K7Q2PX" style="max-width:240px" dir="ltr"><button id="jn">התחל אתגר</button></div><div id="chb" style="margin-top:10px"></div></div>
 <div class="card"><h2>טבלת השבוע</h2><div id="lb" class="mut">טוען…</div></div>
 <div class="card"><h2>הנושאים החלשים של הכיתה</h2><div id="wk2" class="mut">טוען…</div></div>
 <div class="card"><h2>דוח למורה</h2><p class="mut">סיכום ההתקדמות שלך להעתקה ולשליחה.</p><textarea id="rep" rows="7" readonly></textarea><div class="row" style="margin-top:8px"><button id="cp">העתק</button></div></div>`;
 $('#rep').value=report();$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#rep').value);toast('הועתק')}catch(e){$('#rep').select();toast('סמן והעתק ידנית')}};
 const go=code=>{code=code.trim().toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)){toast('קוד לא תקין');return}start('ch',shuffle(Q.map(q=>q.n),seeded(code)).slice(0,15),0,code)};
 $('#mk').onclick=()=>{const c=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');$('#cd').value=c;toast('הקוד: '+c+' – שלח אותו לחבר')};
 $('#jn').onclick=()=>go($('#cd').value);
 if(!db&&!S.cls){joinForm();return}
 if(!db){const h=document.createElement('p');h.className='mut';h.innerHTML=`כיתה <b dir="ltr">${esc(S.cls.code)}</b> · מחובר כ: ${esc(S.cls.name)} · <a href="#" id="chg">החלף</a>`;app.querySelector('h1').after(h);
  $('#chg').onclick=e=>{e.preventDefault();delete S.cls;save();clsView()}}
 const tm=setTimeout(()=>{if($('#lb').textContent==='טוען…')$('#lb').textContent='הנתונים עוד לא זמינים – נסה שוב בעוד רגע.'},10000);
 try{const d=await classData();clearTimeout(tm);const w=wk();
  const rows=d.rows.filter(r=>r.wk===w&&r.wt>0).sort((a,b)=>b.wt-a.wt);
  $('#lb').innerHTML=rows.length?`<table><tbody>${rows.map((r,i)=>`<tr${r.me?' style="font-weight:700"':''}><td>${i+1}.</td><td>${esc(r.name||'חבר לכיתה')}${r.me?' (אתה)':''}</td><td style="text-align:left;white-space:nowrap">${r.wt} שאלות · ${Math.round(r.wr/r.wt*100)}%</td></tr>`).join('')}</tbody></table>`:'עוד אין תוצאות השבוע. סיים תרגול כדי להופיע כאן.';
  const agg={};d.rows.forEach(r=>Object.entries(r.topics||{}).forEach(([t,a])=>{const x=agg[t]||[0,0];x[0]+=+a[0];x[1]+=+a[1];agg[t]=x}));
  const tl=Object.entries(agg).filter(([t,a])=>a[0]>=5&&TN[t]).map(([t,a])=>[t,a[1]/a[0]]).sort((a,b)=>a[1]-b[1]).slice(0,5);
  $('#wk2').innerHTML=tl.length?tl.map(([t,m])=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${TN[t]}</span><span style="color:${col(m)}">${Math.round(m*100)}%</span></div><div class="meter"><i style="width:${m*100}%;background:${col(m)}"></i></div></div>`).join(''):'צריך עוד קצת תרגול של הכיתה כדי לחשב.';
  const byCode={};d.ch.forEach(x=>(byCode[x.code]=byCode[x.code]||[]).push(x));
  const mine=Object.keys(byCode).filter(k=>byCode[k].some(x=>x.me)).slice(0,5);
  if(mine.length){const box=$('#chb');box.innerHTML='<h3>האתגרים שלך</h3>';mine.forEach(k=>{const p=document.createElement('p');p.textContent=k+': '+byCode[k].sort((a,b)=>b.r-a.r).map(x=>(x.name||'חבר')+' '+x.r+'/'+x.tot).join(' · ');box.appendChild(p)})}
 }catch(e){clearTimeout(tm);$('#lb').textContent='לא הצלחתי לטעון את נתוני הכיתה. בדוק חיבור לאינטרנט.';$('#wk2').textContent=''}
}
