<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>תרגול חשמלאי מוסמך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: מעשי, ברור, כמו מדריך בשטח – בלי קישוטים
   IDEA: לוח חשמל – כל נושא הוא "מאמ"ת" בשורת DIN, הידית מראה כמה אתה שולט בו
   PICTURE: לוח הנושאים עם ידיות צבעוניות; מסך שאלה נקי בעמודה אחת
   COLOUR and TYPE: לוח בהיר, מכסה כהה, צבעי מוליכים (חום/כחול/ירוק-צהוב) כמבטא; Rubik לכותרות, Assistant לטקסט
   LAYOUT: עמודה אחת עד 900px, ניווט תחתון במובייל, כרטיסים מלאי רוחב */
:root{color-scheme:light dark;
--bg:light-dark(#eef0ee,#121516);--panel:light-dark(#ffffff,#1b2022);--ink:light-dark(#151a1c,#e9edee);--mute:light-dark(#5c676b,#9aa6aa);
--line:light-dark(#d5dad8,#2c3437);--cover:light-dark(#1f2a2e,#0b0f10);--brown:#8a5a2b;--blue:light-dark(#1f5fbf,#6ea2ff);
--ok:light-dark(#2e7d32,#6fcf75);--warn:light-dark(#b26a00,#f0b45a);--bad:light-dark(#c62828,#ff7b72);--accent:light-dark(#1f5fbf,#6ea2ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Assistant,"Segoe UI",Arial,sans-serif;overflow-x:clip;padding-bottom:84px}
a{color:inherit}
h1,h2,h3{font-family:Rubik,Assistant,"Segoe UI",Arial,sans-serif;font-weight:700;line-height:1.15;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(26px,5vw,36px)}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:8px 16px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pri{background:var(--cover);color:#fff;border-color:var(--cover)}
:root[data-theme=dark] .pri{background:#e9edee;color:#121516}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pri{background:#e9edee;color:#121516}}
input,select,textarea{font-size:16px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
.top{background:var(--cover);color:#fff;padding:14px max(4vw,16px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-family:Rubik;font-size:19px}.top .sp{flex:1}
.wire{height:6px;background:linear-gradient(90deg,var(--brown) 0 33%,#222 33% 66%,#888 66%)}
main{max-width:900px;margin:0 auto;padding:18px max(4vw,14px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:600px){.grid3{grid-template-columns:minmax(0,1fr)}}
.mut{color:var(--mute);font-size:15px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.big{font-family:Rubik,Assistant,Arial,sans-serif;font-size:34px;font-weight:700;line-height:1}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav a{flex:1;text-align:center;color:var(--mute);text-decoration:none;font-size:13px;padding:4px;border-radius:8px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.nav a.on{color:var(--ink);font-weight:700}.nav a span{font-size:20px;line-height:1}
/* לוח מאמ"תים */
.board{background:light-dark(#dfe3e1,#0f1314);border-radius:14px;padding:10px;border:1px solid var(--line)}
.subj{margin:10px 4px 6px;font-family:Rubik;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:8px;background:repeating-linear-gradient(90deg,#9aa3a6 0 2px,transparent 2px 10px) 0 50%/100% 6px no-repeat}
.mcb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.mcb .lev{width:22px;height:34px;border-radius:5px;border:2px solid var(--line);position:relative;background:var(--bg)}
.mcb .lev i{position:absolute;inset-inline:2px;height:14px;border-radius:3px}
.mcb .nm{font-weight:700;font-size:15px;line-height:1.25}.mcb.off{opacity:.55}
.mcb.sel{outline:3px solid var(--accent)}
/* שאלה */
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:400;line-height:1.45}
.opt b{font-family:Rubik;margin-inline-end:8px}
.opt.pick{border-color:var(--accent);background:light-dark(#e8f0fd,#1a2840)}
.opt.ok{border-color:var(--ok);background:light-dark(#e9f6ea,#16301a)}.opt.no{border-color:var(--bad);background:light-dark(#fdecea,#3a1a19)}
.qimg{width:100%;max-width:820px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.conf0{color:var(--warn)}.conf1{color:var(--mute)}
.res{border-inline-start:4px solid var(--line);padding-inline-start:12px;margin:14px 0}
.res.ok{border-color:var(--ok)}.res.no{border-color:var(--bad)}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:600px){.calc{grid-template-columns:minmax(0,1fr)}}
.out{background:var(--bg);border-radius:10px;padding:14px;text-align:center}
label{display:block;font-size:14px;color:var(--mute);margin:6px 0 2px}
.timer{font-family:Rubik;font-variant-numeric:tabular-nums;white-space:nowrap}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:start;font-size:15px}
.hide{display:none!important}
.toast{position:fixed;bottom:90px;inset-inline:16px;max-width:420px;margin:auto;background:var(--cover);color:#fff;padding:10px 14px;border-radius:10px;z-index:9}
@media (prefers-reduced-motion:no-preference){.mcb .lev i{transition:top .4s}}
</style>
</head>

<script type="application/json" id="qdata">[{"n": 1, "t": "wet", "a": 0, "c": 2, "f": 0, "q": "מהי דרגת הגנה לציוד חשמלי בפני מפגעים IP65?", "e": "הספרה הראשונה (6) היא הגנה מפני חדירת גופים מוצקים/אבק – 6 = אטום לאבק. הספרה השנייה (5) היא הגנה מפני מים – 5 = סילון מים.", "w": ["", "ים סוער זו ספרה 6, ופגיעה מכנית נמדדת בסולם IK ולא IP.", "IP לא עוסק בטמפרטורה.", "מסיח – אין קשר לאינטרנט."], "o": ["אטימות לאבק (הגנה מוחלטת גם בנגיעה) והגנה בפני סילון מים.", "הגנה בפני סילון מים חזק או ים סוער והגנה בפני פגיעה מכנית הולם 500 גרם מגובה 40 ס\"מ.", "הגנה בפני פגיעת החום עד 65 מעלות.", "הגנת ציוד מפני השתלטות דרך האינטרנט במשך 65 דקות (IoT)."]}, {"n": 2, "t": "shock", "a": 0, "c": 1, "f": 0, "q": "עכבתה של לולאת התקלה שנמדדה במעגל הראשי החד-מופעי של דירת מגורים (C40A, 230V) היא Zl = 0.90Ω. איך התוצאה עונה על דרישות החוק?", "e": "מאמ\"ת C נופל מגנטית בערך ב-10×In = 400A. Zמרבי ≈ 230/400 ≈ 0.57Ω. הנמדד (0.90Ω) גבוה מהמרבי – זרם התקלה יהיה קטן מדי והמאמ\"ת לא ינתק מהר מספיק.", "w": ["", "לעכבת לולאה יש ערך מרבי, לא מזערי.", "0.90 גבוה מ-0.57, לא נמוך.", "לעכבת לולאה יש ערך מרבי, לא מזערי."], "o": ["התוצאה גבוהה מהערך המרבי, לכן לא ניתן לאשר להפעיל את המתקן.", "התוצאה גבוהה מהערך המזערי, לכן כן ניתן לאשר להפעיל את המתקן.", "התוצאה נמוכה מהערך המרבי, לכן כן ניתן לאשר להפעיל את המתקן.", "התוצאה נמוכה מהערך המזערי, לכן לא ניתן לאשר להפעיל את המתקן."]}, {"n": 3, "t": "ocp", "a": 3, "c": 1, "f": 0, "q": "עומס כולל של 10 קילוואט הופעל בדירת מגורים סטנדרטית (מתח הזנה חד-מופעי 230V, מפסק ראשי C40A). איך יגיב המאמ\"ת הראשי?", "e": "I = 10000/230 ≈ 43.5A, כלומר 1.09×In. זרם אי-הפעלה מוסכם של מאמ\"ת הוא 1.13×In (לא ינתק שעה), וזרם הפעלה מוסכם 1.45×In. 1.09 קטן מ-1.13 ולכן לא ינתק.", "w": ["ניתוק מיידי הוא בתחום המגנטי (5–10×In).", "5 שניות זו דרישה לזרם תקלה, לא לעומס יתר קל.", "ניתוק תוך פחות משעה מובטח רק מ-1.45×In.", ""], "o": ["המאמ\"ת הראשי ינתק את הדירה באופן מיידי.", "המאמ\"ת הראשי ינתק את הדירה תוך 5 שניות ולא יותר (לפי דרישת החוק במקרה תקלה).", "המאמ\"ת הראשי ינתק את הדירה תוך פחות משעה (זמן התגובה של החלק התרמי).", "המאמ\"ת הראשי לא ינתק את הדירה כלל (הזרם שיזרום דרכו קטן מזרם ההפעלה)."]}, {"n": 4, "t": "law", "a": 0, "c": 2, "f": 0, "q": "לביצוע עבודות חשמל, כולל עריכת תוכניות, במתקן בעל עוצמת זרם עד 3×80A הנמצא במבנה המשמש לדירת מגורים, משרדים או בתי מלאכה, דרוש חשמלאי בעל רישיון מינימלי של:", "e": "חשמלאי מוסמך רשאי לבצע ולתכנן עד 3×80A במבנה מגורים, משרדים או בתי מלאכה (ועד 3×40A במתקן אחר).", "w": ["", "ראשי מתאים, אבל השאלה שואלת על הרישיון המינימלי.", "מעשי מוגבל ל-3×40A.", "עוזר לא רשאי לעבוד באופן עצמאי."], "o": ["חשמלאי מוסמך.", "חשמלאי ראשי.", "חשמלאי מעשי.", "חשמלאי עוזר."]}, {"n": 5, "t": "law", "a": 3, "c": 1, "f": 0, "q": "חשמלאי בעל רישיון בודק מסוג 1 רשאי לבצע בדיקות במתקנים בעלי עוצמת זרם עד:", "e": "בודק סוג 1 רשאי לבדוק מתקנים עד 3×100A במתח נמוך, למעט מתקן שהוא עצמו גם תכנן וגם ביצע.", "w": ["3×350A מעל תחום בודק סוג 1.", "3×80A הוא תחום אחר.", "3×250A מעל תחום בודק סוג 1.", ""], "o": ["3×350A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו.", "3×80A במתח נמוך, למעט עבודות חשמל אשר תוכננו ובוצעו על ידו.", "3×250A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו.", "3×100A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו."]}, {"n": 6, "t": "test", "a": 0, "c": 0, "f": 0, "q": "מהו שיעור ההתנגדות התקין בין מוליך מופע למוליך האפס בלוח במתקן חשמלי בבדיקה תקופתית?", "e": "בבדיקה תקופתית של מתקן קיים הדרישה מקלה יותר מאשר במתקן חדש. הערך הנפוץ בתקנות לבדיקה תקופתית הוא 0.25MΩ לפחות. כדאי לוודא מול התקנות העדכניות.", "w": ["", "ערך גבוה מהנדרש.", "ערך גבוה מהנדרש.", "ערך גבוה מהנדרש."], "o": ["0.25 מגה-אום.", "1.5 מגה-אום.", "1.25 מגה-אום.", "1.75 מגה-אום."]}, {"n": 7, "t": "earth", "a": 2, "c": 1, "f": 0, "q": "מה המספר המינימלי של בורגי חיבור שיותקנו בפס השוואת פוטנציאלים אם יחוברו אליו שני מוליכי חיבור, מוליך מפס הארקות ומוליך הארקת יסוד?", "e": "4 מוליכים צריכים 4 ברגים, ובנוסף התקנות דורשות 2 ברגים שמורים לחיבורים עתידיים: 4 + 2 = 6.", "w": ["אלה רק המוליכים הקיימים, בלי ברגים שמורים.", "חסר בורג שמור אחד.", "", "יותר מהמינימום."], "o": ["4", "5", "6", "7"]}, {"n": 8, "t": "cable", "a": 1, "c": 2, "f": 0, "q": "כיצד יש לנהוג בהוספת מעגל חדש ללוח שבו כל צבעי המוליכים הם לפי התקן הישן?", "e": "עבודה חדשה מבוצעת לפי התקן החדש (חום/שחור/אפור לפאזות, כחול לאפס, צהוב-ירוק להארקה), ומסמנים שלט אזהרה שיש בלוח שני סוגי צבעים.", "w": ["אין חובה להחליף מוליכים קיימים.", "", "אסור להתקין היום לפי צבעים ישנים.", "המתקין החדש אחראי על עבודתו."], "o": ["יש להחליף את כל מוליכי הלוח למניעת טעויות בעתיד.", "יש לחבר לפי התקן החדש ולשים שלט המתריע על כך.", "יש לחבר לפי התקן הישן למניעת טעויות בעתיד.", "לא לנקוט שום פעולה, הלוח באחריות המבצע המקורי."]}, {"n": 9, "t": "cable", "a": 0, "c": 2, "f": 0, "q": "האם מותר להסתעף ממעגל שחתך מוליכיו 2.5 ממ\"ר להזנת מעגל שחתך מוליכיו 1.5 ממ\"ר?", "e": "כל ירידה בחתך מחייבת מבטח מתאים לחתך הקטן, אחרת המבטח של 2.5 ממ\"ר לא יגן על 1.5 ממ\"ר.", "w": ["", "אי אפשר לסמוך על העומס, צריך הגנה.", "הכלל זהה בבית ובתעשייה.", "אין היתר כזה."], "o": ["אסור לחלוטין. ירידה בחתך המוליך חייבת להיעשות דרך מבטח.", "מותר בתנאי שהעומס הכולל לא יגרום להעמסת יתר.", "אסור בחשמל ביתי, מותר בתעשייה כי בה העוסקים בכך הם חשמלאים.", "מותר בחשמל ביתי למעגלי תאורה בלבד, בתנאי שהזרם בהסתעפות לא יהיה מעל 10 אמפר."]}, {"n": 10, "t": "law", "a": 3, "c": 0, "f": 0, "q": "האם מותר לבצע עבודות חשמל במתקן חי לצורך החלפת מערכת תאורת חירום?", "e": "עבודה במתקן חי מותרת רק במקרים חריגים שבהם ניתוק אינו אפשרי או מסוכן. החלפת תאורת חירום אפשרית במעגל מנותק, ולכן אין הצדקה לעבודה במתח.", "w": ["מספר החשמלאים לא מתיר עבודה במתח.", "התנאים האלה לא חלים על המקרה הזה.", "אישור לא הופך עבודה מיותרת במתח למותרת.", ""], "o": ["מותר בתנאי שבצוות ישנם לפחות 2 חשמלאים בעלי רישיון מתאים.", "מותר בתנאי שלצוות יש ציוד מתאים ועבודה מאושרת ע\"י בעל רישיון חשמלאי-הנדסאי לפחות.", "מותר בתנאי שיש אישור מחשמלאי אחראי על המתקן ובנוכחותו.", "אסור לעבוד במתקן חי לצורך החלפת מערכת תאורת חירום."]}, {"n": 11, "t": "earth", "a": 0, "c": 0, "f": 1, "q": "מהי עכבת מסת האדמה המרבית המותרת בשיטת ההגנה המתוארת בא נון תרמי 20...25 אמפר."]}, {"n": 50, "t": "motor", "a": 0, "c": 2, "f": 0, "q": "על לוחית זיהוי של מנוע כתוב Δ400V/Y690V. מה המשמעות?", "e": "הסליל בנוי ל-400V. ברשת 400V עובדים במשולש, ובהתנעה אפשר לחבר בכוכב (כל סליל מקבל 230V). לכן המנוע מתאים להתנעת כוכב-משולש.", "w": ["", "זה לא \"לפחות\" – אלה מתחי עבודה.", "לא קשור לרוטור.", "שגוי."], "o": ["מנוע אשר במתח שלוב 400 וולט אפשר להתניע כוכב-משולש.", "מנוע אשר חייב לקבל מתח לפחות 690 וולט כדי לעבוד בכוכב, או לפחות 400 וולט למשולש.", "מנוע רוטור מלופף (סטטור משולש, רוטור כוכב), בעל יחס השנאה √3 במנוחה.", "צריך להיות הפוך: Δ690V/Y400V, כי בחיבור משולש מנוע יותר חזק."]}, {"n": 51, "t": "ocp", "a": 2, "c": 2, "f": 0, "q": "מהי עוצמתו של זרם בדיקה גבוהה I2 של מאמ\"ת הניתן לכוונון?", "e": "זרם ההפעלה המוסכם I2 של מאמ\"ת הוא 1.45×In: ניתוק מובטח תוך פחות משעה. וזרם אי-ההפעלה I1 הוא 1.13×In.", "w": ["", "", "", ""], "o": ["I2 = 1.75 × In", "I2 = 1.60 × In", "I2 = 1.45 × In", "I2 = 1.30 × In"]}, {"n": 52, "t": "cable", "a": 1, "c": 1, "f": 0, "q": "מהו עומק הטמנה המזערי של כבל כוח בקרקע חול?", "e": "עומק הטמנה מזערי מקובל לכבל מתח נמוך הוא 80 ס\"מ, ומעליו מניחים סרט סימון.", "w": ["רדוד מדי.", "", "נדרש במקרים מיוחדים (למשל מתחת לכביש).", "סרט אזהרה לא מחליף עומק."], "o": ["60 ס\"מ.", "80 ס\"מ.", "100 ס\"מ.", "אין חשיבות בעומק בתנאי שמעל כבל בעומק 25 ס\"מ מונח סרט אזהרה תקני עם רקע צהוב."]}, {"n": 53, "t": "cable", "a": 2, "c": 2, "f": 0, "q": "מהי טמפרטורת העבודה המרבית של מוליכי הזנה (כבלים) עד 1,000 וולט בעלי בידוד עשוי פוליאתילן מוצלב (XLPE)?", "e": "בידוד XLPE עמיד בטמפרטורת עבודה רציפה של 90°C (PVC עמיד ב-70°C).", "w": ["שגוי.", "אלה טמפרטורות סביבה ייחוס.", "", "יש הגבלה."], "o": ["כמו טמפרטורת האוויר או האדמה (תלוי בסוג ההתקנה).", "35 מעלות (התקנה באוויר) ו-30 מעלות (התקנה באדמה), כמו שמוגדר בטבלאות מקדמי תיקון.", "90 מעלות צלזיוס.", "אין הגבלה, בתנאי שמותקנים אמצעי הגנה בפני שריפה לפי תקן אירופאי IEC 332-3."]}, {"n": 54, "t": "dwell", "a": 1, "c": 0, "f": 0, "q": "מהו מספר המכשירים התלת-מופעיים שמותר לחבר למעגל סופי?", "e": "אפשר לחבר כמה מכשירים תלת-מופעיים למעגל אחד, בתנאי שלכל אחד יש הגנת זרם יתר משלו. כדאי לבדוק עם המורה מול נוסח התקנות.", "w": ["", "", "אין קשר בין מספר המכשירים למספר המופעים.", "מותר."], "o": ["מכשיר אחד בלבד, ללא שום תנאי.", "יותר ממכשיר אחד, בתנאי שכל מכשיר יהיה מוגן ע\"י מבטח בפני זרם יתר המיועד רק עבורו.", "שלושה מכשירים בלבד, לפי מספר המופעים בכבל ההזנה.", "למעגל סופי מותר לחבר רק מכשירים חד-מופעיים. התקנת מכשיר תלת-מופעי במעגל סופי אסורה לחלוטין, לפי פרק \"מעגלים סופיים\" של חוק החשמל."]}, {"n": 55, "t": "pf", "a": 2, "c": 2, "f": 0, "q": "נתון צרכן: נורת נתרן לחץ גבוה בעלת הספק של 500W ומקדם הספק 0.43, מתח הרשת 230V/50Hz. קבע את ערך הקבל הנדרש לשיפור מקדם ההספק של הנורה ל-0.92 לפי דרישת חוק החשמל:", "e": "Qc = P(tanφ1 − tanφ2) = 500×(2.098 − 0.426) ≈ 837 VAr. C = Qc/(U²·ω) = 837/(230²×314) ≈ 50.36 µF.", "w": ["", "", "", ""], "o": ["37.5 µF", "40.47 µF", "50.36 µF", "52.26 µF"]}, {"n": 56, "t": "pf", "a": 0, "c": 2, "f": 0, "q": "במתקן חשמלי מחוברים במקביל 2 מנועים: P1 = 8kW, cosφ = 0.75 ; P2 = 8kW, cosφ = 0.75. חשב את ההספק בקבל שיש לחבר במקביל ל-2 המנועים על מנת לשפר את מקדם ההספק לערך הדרוש לפי דרישת חברת החשמל:", "e": "P = 16kW. Qc = 16×(tan(acos0.75) − tan(acos0.92)) = 16×(0.882 − 0.426) ≈ 7.29 KVAr (דרישת חברת החשמל: 0.92).", "w": ["", "", "", ""], "o": ["7.29 KVAr", "10.16 KVAr", "13.37 KVAr", "14.20 KVAr"]}, {"n": 57, "t": "pf", "a": 2, "c": 2, "f": 0, "q": "נתון הספק פעיל והספק היגבי של הצרכן: P = 20 kW ; Q = 8.6 kVAr. חשב את מקדם ההספק:", "e": "S = √(20² + 8.6²) ≈ 21.77 kVA. cosφ = P/S = 20/21.77 ≈ 0.92.", "w": ["", "", "", ""], "o": ["cosφ = 0.63", "cosφ = 0.75", "cosφ = 0.92", "cosφ = 1"]}, {"n": 58, "t": "pf", "a": 3, "c": 2, "f": 0, "q": "נתון צרכן חד-מופעי בהספק 2kW, מקדם הספק 0.7. המתח הנקוב הוא 220V/50Hz. מה גודל הקבל שיש להתקין כדי לשפר את מקדם ההספק ל-0.92?", "e": "Qc = 2000×(1.020 − 0.426) ≈ 1188 VAr. C = 1188/(220²×314) ≈ 78.15 µF.", "w": ["", "", "", ""], "o": ["47.4 µF", "68.6 µF", "73.8 µF", "78.15 µF"]}, {"n": 59, "t": "pf", "a": 3, "c": 1, "f": 0, "q": "נתון מדחס המחובר לרשת תלת-מופעית של 400V/50Hz, בהספק 20kW ו-cosφ = 0.85. מה הערך של סוללת קבלים המשפרת את מקדם ההספק ל-0.92, בהנחה שהסוללה מחוברת בכוכב?", "e": "Qc = 20000×(0.620 − 0.426) ≈ 3875 VAr, כלומר 1292 VAr לכל קבל. בכוכב כל קבל מקבל 230V: C = 1292/(230²×314) ≈ 77.1 µF.", "w": ["", "", "", ""], "o": ["3 × 44.76 µF", "3 × 55.56 µF", "3 × 66.19 µF", "3 × 77.19 µF"]}, {"n": 60, "t": "pf", "a": 2, "c": 1, "f": 0, "q": "בבית מלאכה המוזן מרשת תלת-מופעית בעלת מתח קווי של 400V/50Hz קיים מנוע בהספק 8kW ומקדם הספק 0.75. חשב את ההספק ההיגבי של סוללת הקבלים לשיפור גורם ההספק ל-0.92:", "e": "Qc = 8×(0.882 − 0.426) ≈ 3.65 kVAr. בוחרים את הגודל הסטנדרטי שמעליו: 4 kVAr.", "w": ["", "קטן מהנדרש (3.65).", "", "גדול מהנדרש."], "o": ["2 kVAr", "3 kVAr", "4 kVAr", "5 kVAr"]}, {"n": 61, "t": "pf", "a": 0, "c": 2, "f": 0, "q": "חשב את ערך הקבל המשפר את מקדם ההספק של נורת פלואורסצנט בעלת הספק של 50W מ-0.45 ל-0.92. מתח הרשת הוא 230V/50Hz:", "e": "Qc = 50×(1.985 − 0.426) ≈ 77.9 VAr. C = 77.9/(230²×314) ≈ 4.69 µF.", "w": ["", "", "", ""], "o": ["4.67 µF", "4.78 µF", "5.67 µF", "7.76 µF"]}, {"n": 62, "t": "pf", "a": 0, "c": 2, "f": 1, "q": "נתונה רשת המוזנת 230V/50Hz עם שני צרכנים: SM1 = 5+3j kVA, SM2 = 5+3j kVA. מצא את גודל הקבל שצריך להתקין על מנת לשפר את מקדם ההספק כדרישת חברת החשמל:", "e": "P = 10kW, Q = 6kVAr. Qc = 6000 − 10000×0.426 ≈ 1740 VAr. C = 1740/(230²×314) ≈ 104.7 µF.", "w": ["", "", "", ""], "o": ["104.81 µF", "66.1 µF", "56.1 µF", "46.1 µF"]}, {"n": 63, "t": "motor", "a": 0, "c": 1, "f": 0, "q": "מעל איזה הספק יש להתקין למנוע מבטח הגנה בפני עומס יתר, המיועד לו בלבד?", "e": "לפי התקנות, מנוע שהספקו עולה על 0.5 כ\"ס צריך הגנה בפני עומס יתר משלו.", "w": ["", "היחידה והערך לא תואמים לתקנה.", "", ""], "o": ["0.5HP", "0.5kW", "1kW", "1.5kW"]}, {"n": 64, "t": "pf", "a": 1, "c": 2, "f": 1, "q": "להדקי הצרכן (20kW, cosφ = 0.6, 400V) חוברה סוללת קבלים לשיפור מקדם ההספק לערך הנדרש ע\"י חברת החשמל. מצא את ההספק של סוללת הקבלים:", "e": "Qc = 20×(tan גלים הסופיים עבור תאורה בסדנה המתוארת באיור (30×18 מ')?", "e": "באיור יש 12 גופי תאורה באולם. התשובה המקובלת היא 12 מעגלים. כדאי לוודא עם המורה מהו הכלל בתקנות (מספר נקודות או שטח למעגל).", "w": ["", "", "", ""], "o": ["10", "12", "14", "16"]}, {"n": 80, "t": "motor", "a": 1, "c": 0, "f": 0, "q": "באילו תנאים מותר להזין באמצעות מעגל סופי אחד מספר מנועים ללא מבטח מיוחד לכל מנוע בנפרד?", "e": "התקנות מתירות להזין כמה מנועים קטנים ממעגל אחד בלי מבטח לכל אחד, כשהספק כל מנוע והמבטח המשותף מוגבלים. התשובה המקובלת: עד 1kW לכל מנוע ומבטח עד 10A. כדאי לוודא מול התקנות.", "w": ["", "", "", ""], "o": ["הספק כל מנוע לא יעלה על 0.5 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 10 אמפר.", "הספק כל מנוע לא יעלה על 1 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 10 אמפר.", "הספק כל מנוע לא יעלה על 0.5 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 16 אמפר.", "הספק כל מנוע לא יעלה על 1 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 16 אמפר."]}, {"n": 81, "t": "pf", "a": 2, "c": 2, "f": 1, "q": "חשב את ערך הקבל (במיקרו-פרד) לשיפור מקדם ההספק של מנוע חד-מופעי הצורך 1,400 וואט שמקדם ההספק שלו 0.87. מקדם ההספק הנדרש 0.95. תדירות הרשת 50 הרץ במתח 240 וולט.", "e": "Qc = 1400×(0.567 − 0.329) ≈ 333 VAr. C = 333/(240²×314) ≈ 18.4 µF.", "w": ["", "", "", ""], "o": ["≈ 10.8µF", "≈ 14.5µF", "≈ 18.6µF", "≈ 22.7µF"]}, {"n": 82, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "חשב את שטח החתך האחיד המסחרי של רשת לזרם ישר שבאיור (600V, l1 = 90m עם P1 = 25kW, l2 = 80m עם P2 = 35kW), אם מפל המתח הכללי הוא 4%. מוליכים עשויים נחושת, ρ = 0.0175.", "e": "I1 = 41.7A, I2 = 58.3A. ΔU = 24V. A = 2ρ[(I1+I2)×90 + I2×80]/ΔU ≈ 19.9 ממ\"ר. החתך המסחרי שמעליו הוא 25 ממ\"ר (20 אינו חתך סטנדרטי).", "w": ["קטן מדי.", "קטן מדי.", "", "20 ממ\"ר אינו חתך מסחרי סטנדרטי."], "o": ["10 ממ\"ר", "16 ממ\"ר", "25 ממ\"ר", "20 ממ\"ר"]}, {"n": 83, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "מהו המתח בנקודה C של רשת תלת-מופעית עשויה חמרן (אלומיניום), ρ = 0.028, בעלת שטח חתך אחיד של 10 ממ\"ר? (Un = 400 ספק המופק בנורה לעוצמת ההספק המושקע בה.", "היחס בין כמות האור הנפלטת מהנורה בשנייה אחת להספק החשמלי המושקע בה.", "היחס בין ההספק החשמלי המושקע בנורה לכמות האור הנפלטת ממנה."]}, {"n": 123, "t": "light", "a": 1, "c": 2, "f": 0, "q": "מהו אפקט הסטרובוסקופ?", "e": "הבהוב של 100Hz בנורות פריקה עלול להסתנכרן עם סיבוב של מכונה, והחלק המסתובב נראה עומד – סכנה בעבודה.", "w": ["", "", "", ""], "o": ["השפעת החימום על אורך החיים של נורה בתאורת ליבון.", "תופעה בהארת פלואורסנט הגורמת לגופים מסתובבים להיראות כאילו אינם זזים.", "אפקט הגורם לנורות לד להבהב לאחר כיבוי המתג.", "תהליך יוניזציה היוצר אפקט תאורה בנורות פריקה בגז."]}, {"n": 124, "t": "light", "a": 0, "c": 2, "f": 0, "q": "מהו התשלום החודשי שנשלם עבור הארת ספרייה שמידותיה (9X8) מ\"ר בעוצמה של 500 לוקס? נתונים: נצילות המתקן היא 68% ומקדם הפחתה 0.704. התאורה תיעשה באמצעות נורות פלורסנט שכל אחת מהן היא בעלת הספק של 105 וואט ושטף אורי של 9400 לומן. הספרייה פעילה 150 שעות חודשיות ותעריף החשמל 0.65 ₪/kWh.", "e": "N = 500×72/(0.68×0.704×9400) = 8 נורות. אנרגיה: 8×105×150 = 126kWh. עלות: 126×0.65 = 81.90 ₪.", "w": ["", "", "", ""], "o": ["81.90 ₪", "250 ₪", "132 ₪", "524 ₪"]}, {"n": 125, "t": "light", "a": 2, "c": 1, "f": 1, "q": "כמה נורות יש להתקין לשם הארת בית מלאכה ששטחו 120 מ\"ר? רמת ההארה הנדרשת היא 500lx, נצילות המתקן היא 71% ומקדם ההפחתה הוא 0.8. הנורות המוצעות הן פלורסנט 13W או נורות לד 11W (לפי הטבלה: פלורסנט 13W = 710 לומן, לד 11W = 1340 לומן).", "e": "Φ נדרש = 500×120/(0.71×0.8) ≈ 105,600 לומן. פלורסנט: 105600/710 ≈ 149. לד: 105600/1340 ≈ 79.", "w": ["", "", "", ""], "o": ["כ-50 נורות פלורסנט או 20 נורות לד.", "כ-100 נורות פלורסנט או 60 נורות לד.", "כ-150 נורות פלורסנט או 80 נורות לד.", "200 נורות פלורסנט או 120 נורות לד."]}, {"n": 126, "t": "light", "a": 1, "c": 2, "f": 1, "q": "מהי עוצמת ההארה שתתקבל בנקודה P המצוינת באיור (H = 18m, α = 50°)? הנורה המותקנת היא כספית בעלת שטף אורי של 30klm. יש להיעזר בעקום הפולרי המצורף (cd/klm).", "e": "מהעקום ב-50°: ≈ 350 cd/klm, ולכן I = 350×30 = 10,500cd. r = 18/cos50° = 28m. E =   const A=(p===1?2:Math.sqrt(3))*r*l*i/du;const s=STD.find(v=>v>=A);out('cs',`<div class="mut">חתך מחושב</div><div class="big">${A.toFixed(2)} ממ"ר</div><div>חתך מסחרי: <b>${s?s+' ממ"ר':'מעל 240 – לפצל'}</b></div><div class="mut">זה רק תנאי מפל המתח. בדקו גם עמידות בזרם ותיאום עם המבטח.</div>`)},
 zl(){const i=f('zl_i'),k=f('zl_c'),u=f('zl_u');if(!(i>0&&u>0))return bad('zl');const z=u/(k*i);out('zl',`<div class="mut">עכבת לולאה מרבית</div><div class="big">${z.toFixed(3)} Ω</div><div>זרם ניתוק מגנטי ≈ ${Math.round(k*i)}A</div>`)},
 pw(){const p=f('pw_p')*+$('#pw_u').value,n=+$('#pw_n').value,c=f('pw_c'),e=f('pw_e')/100;if(!(p>0&&c>0&&e>0))return bad('pw');const I=n===3?p/(e*Math.sqrt(3)*400*c):p/(e*230*c);
  out('pw',`<div class="mut">זרם</div><div class="big">${I.toFixed(1)} A</div><div>הספק כניסה: ${(p/e/1000).toFixed(2)} kW</div>`)},
 pf(){const p=f('pf_p')*1000,c1=f('pf_1'),c2=f('pf_2'),n=$('#pf_n').value;if(!(p>0&&c1>0&&c2>0&&c1<=1&&c2<=1))return bad('pf');
  const Q=p*(Math.tan(Math.acos(c1))-Math.tan(Math.acos(c2)));const w=2*Math.PI*50;let C,t;
  if(n==='1'){C=Q/(230*230*w)*1e6;t=`C = ${C.toFixed(2)} µF`}else{const U=n==='Y'?230:400;C=Q/3/(U*U*w)*1e6;t=`3 × ${C.toFixed(2)} µF`}
  out('pf',`<div class="mut">הספק היגבי לתיקון</div><div class="big">${(Q/1000).toFixed(2)} kVAr</div><div dir="ltr">${t}</div>`)}};
 Object.keys(calcs).forEach(k=>{app.querySelectorAll(`[id^="${k}_"]`).forEach(el=>el.addEventListener('input',calcs[k]));calcs[k]()});
 const draw=Y=>{const s=$('#sd');const P=[[150,30],[60,190],[240,190]];let g='';
  if(Y){const c=[150,130];P.forEach(p=>g+=`<line x1="${p[0]}" y1="${p[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#8a5a2b" stroke-width="6" stroke-dasharray="10 5"/>`);g+=`<circle cx="150" cy="130" r="7" fill="#1f5fbf"/><text x="160" y="150" font-size="13" fill="currentColor">נקודת כוכב</text>`}
  else{for(let i=0;i<3;i++){const a=P[i],b=P[(i+1)%3];g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#8a5a2b" stroke-width="6" stroke-dasharray="10 5"/>`}}
  ['L1','L2','L3'].forEach((t,i)=>{const p=P[i];g+=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="currentColor"/><text x="${p[0]}" y="${p[1]+(i?28:-14)}" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${t}</text>`});
  s.innerHTML=g;$('#sdo').innerHTML=Y?'<b>כוכב:</b> כל סליל מקבל 230V (400/√3).<br>זרם הקו ומומנט ההתנעה קטנים פי 3 לעומת משולש.<br>לכן מתניעים בכוכב ועוברים למשולש.':'<b>משולש:</b> כל סליל מקבל 400V מלאים.<br>זה מצב העבודה של מנוע Δ400/Y690.<br>זרם הקו גדול פי √3 מזרם הסליל.';
  $('#sdY').classList.toggle('pri',Y);$('#sdD').classList.toggle('pri',!Y)};
 $('#sdY').onclick=()=>draw(true);$('#sdD').onclick=()=>draw(false);draw(true);
}
function calcCard(id,t,inputs){return `<div class="card"><h2>${t}</h2><div class="calc"><div>${inputs}</div><div class="out" id="${id}_o" aria-live="polite"></div></div></div>`}

let db=null,user=null,uid=null,canW=true;
(async()=>{try{const c=window.claude;if(!c||!c.use)return;user=await c.use('user');db=await c.use('db');if(!db)return;
 uid=user?await user.id():null;if(user){const w=await user.can('data.write');if(w===false)canW=false;
  try{const me=await user.me();if(me&&me.name&&!S.name){S.name=me.name.split(' ')[0];save()}}catch(e){}}
 $('#who').textContent=S.name?S.name:'';
 if(uid){try{const d=await db.doc('data/users/'+uid+'/progress').get();if(d.exists){const r=d.data();if((r.at||0)>(S.at||0)&&r.s){const loc=S;S=Object.assign(load(),JSON.parse(r.s));S.sess=loc.sess||S.sess;try{localStorage.setItem('elx',JSON.stringify(S))}catch(e){}route()}}}catch(e){}}
 const h=(location.hash||'').slice(1);if(h==='class'||h==='results')route()}catch(e){}})();
let syncT,syncing=false;
function queueSync(){S.at=Date.now();clearTimeout(syncT);syncT=setTimeout(async()=>{if(!db||!uid||!canW||syncing)return;syncing=true;
 try{const c=Object.assign({},S);delete c.sess;await db.doc('data/users/'+uid+'/progress').set({at:S.at,s:JSON.stringify(c)})}catch(e){}syncing=false},2500)}
function wk(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10)}
async function pushScore(R){if(!db||!uid||!canW)return;try{
 const ref=db.doc('scores/'+uid);const g=await ref.get();const o=g.exists?JSON.parse(JSON.stringify(g.data())):{};const w=wk();
 if(o.wk!==w){o.wk=w;o.wt=0;o.wr=0}o.wt=(o.wt||0)+R.tot;o.wr=(o.wr||0)+R.r;o.tot=(o.tot||0)+R.tot;o.r=(o.r||0)+R.r;o.topics=o.topics||{};
 R.qs.forEach(n=>{const t=BY[n].t;const a=o.topics[t]||[0,0];a[0]++;if(R.ans[n]===BY[n].a)a[1]++;o.topics[t]=a});o.at=Date.now();await ref.set(o);
 if(R.code){const c=db.doc('challenges/'+uid);const cg=await c.get();const co=cg.exists?JSON.parse(JSON.stringify(cg.data())):{items:{}};co.items=co.items||{};
  co.items[R.code]={r:R.r,tot:R.tot,at:Date.now()};await c.set(co)}}catch(e){if(e&&e.code==='invalid_argument')canW=false}}
async function loadTips(ns){if(!db)return;try{const s=await db.collection('tips').get();const tips={};
 s.docs.forEach(d=>{const it=(d.data()||{}).items||{};Object.entries(it).forEach(([n,t])=>{(tips[n]=tips[n]||[]).push({u:d.id,t})})});
 const ids=[...new Set(Object.values(tips).flat().map(x=>x.u))];const ps=user&&ids.length?await user.profiles(ids):{};
 document.querySelectorAll('.tips').forEach(el=>{const L2=tips[el.dataset.q]||[];el.innerHTML='';L2.forEach(x=>{const p=document.createElement('p');p.className='note';
  p.textContent='💡 '+((ps[x.u]&&ps[x.u].name)||'חבר לכיתה')+': '+String(x.t).slice(0,400);el.appendChild(p)})})}catch(e){}}
function tipForm(n,kind){const box=document.querySelector(`.tips[data-q="${n}"]`);if(!box)return;
 if(!db||!uid){toast('שיתוף עם הכיתה זמין רק כשהדף פתוח דרך Claude עם הרשאת משתתף');return}
 const f=document.createElement('div');f.innerHTML=`<label>${kind==='tips'?'הטיפ שלך (יופיע לכל הכיתה)':'מה לדעתך שגוי בשאלה?'}</label><textarea rows="2" maxlength="400"></textarea><div class="row" style="margin-top:6px"><button class="pri">שלח</button><span class="mut"></span></div>`;
 box.appendChild(f);const ta=f.querySelector('textarea');ta.focus();
 f.querySelector('button').onclick=async()=>{const t=ta.value.trim();const m=f.querySelector('.mut');if(!t){m.textContent='כתוב משהו קודם';return}
  try{const ref=db.doc(kind+'/'+uid);const g=await ref.get();const o=g.exists?JSON.parse(JSON.stringify(g.data())):{items:{}};o.items=o.items||{};o.items[n]=t;await ref.set(o);
  f.remove();toast(kind==='tips'?'הטיפ נשמר ויופיע לחברים':'הדיווח נשמר');if(kind==='tips')loadTips()}catch(e){m.textContent='לא נשמר – ייתכן שאין לך הרשאת כתיבה בדף'}}}
function seeded(code){let h=1779033703;for(const c of code)h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
async function clsView(){
 app.innerHTML=`<h1>הכיתה</h1>
 <div class="card"><h2>אתגר חבר</h2><p class="mut">צור קוד ושלח אותו לחבר. שניכם תקבלו בדיוק אותן 15 שאלות, והתוצאות יופיעו כאן.</p>
 <div class="row"><button class="pri" id="mk">צור קוד חדש</button><input id="cd" placeholder="הזן קוד שקיבלת, למשל K7Q2PX" style="max-width:240px" dir="ltr"><button id="jn">התחל אתגר</button></div><div id="chb" style="margin-top:10px"></div></div>
 <div class="card"><h2>טבלת השבוע</h2><div id="lb" class="mut">טוען…</div></div>

 $('#rep').value=report();$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#rep').value);toast('הועתק')}catch(e){$('#rep').select();toast('סמן והעתק ידנית')}};
 const go=code=>{code=code.trim().toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)){toast('קוד לא תקין');return}start('ch',shuffle(Q.map(q=>q.n),seeded(code)).slice(0,15),0,code)};
 $('#mk').onclick=()=>{const c=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');$('#cd').value=c;toast('הקוד: '+c+' – שלח אותו לחבר')};
 $('#jn').onclick=()=>go($('#cd').value);
 if(!db){['#lb','#wk2'].forEach(s=>$(s).textContent='הטבלה המשותפת עובדת כשהדף פתוח דרך Claude וכל חבר נכנס עם החשבון שלו. בינתיים ההתקדמות נשמרת אצלך במכשיר.');return}
 const tm=setTimeout(()=>{if($('#lb').textContent==='טוען…')$('#lb').textContent='הנתונים עוד לא זמינים – נסה שוב בעוד רגע.'},10000);
 try{const s=await db.collection('scores').get();clearTimeout(tm);const w=wk();
  const rows=s.docs.map(d=>({u:d.id,...d.data()})).filter(r=>r.wk===w&&r.wt>0).sort((a,b)=>b.wt-a.wt);

  app.querySelectorAll('.nmx').forEach(td=>td.textContent=((ps[td.dataset.u]&&ps[td.dataset.u].name)||'חבר לכיתה')+(td.dataset.u===uid?' (אתה)':''));
