<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>תרגול חשמלאי מוסמך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: מעשי, ברור, כמו מדריך בשטח – בלי קישוטים
   IDEA: לוח חשמל – כל נושא הוא "מאמ"ת" בשורת DIN, הידית מראה כמה אתה שולט בו
   PICTURE: לוח הנושאים עם ידיות צבעוניות; מסך שאלה נקי בעמודה אחת
   COLOUR and TYPE: לוח בהיר, מכסה כהה, צבעי מוליכים (חום/כחול/ירוק-צהוב) כמבטא; Rubik לכותרות, Assistant לטקסט
   LAYOUT: עמודה אחת עד 900px, ניווט תחתון במובייל, כרטיסים מלאי רוחב */
:root{color-scheme:light dark;
--bg:light-dark(#eef0ee,#121516);--panel:light-dark(#ffffff,#1b2022);--ink:light-dark(#151a1c,#e9edee);--mute:light-dark(#5c676b,#9aa6aa);
--line:light-dark(#d5dad8,#2c3437);--cover:light-dark(#1f2a2e,#0b0f10);--brown:#8a5a2b;--blue:light-dark(#1f5fbf,#6ea2ff);
--ok:light-dark(#2e7d32,#6fcf75);--warn:light-dark(#b26a00,#f0b45a);--bad:light-dark(#c62828,#ff7b72);--accent:light-dark(#1f5fbf,#6ea2ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Assistant,"Segoe UI",Arial,sans-serif;overflow-x:clip;padding-bottom:84px}
a{color:inherit}
h1,h2,h3{font-family:Rubik,Assistant,"Segoe UI",Arial,sans-serif;font-weight:700;line-height:1.15;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(26px,5vw,36px)}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:8px 16px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pri{background:var(--cover);color:#fff;border-color:var(--cover)}
:root[data-theme=dark] .pri{background:#e9edee;color:#121516}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pri{background:#e9edee;color:#121516}}
input,select,textarea{font-size:16px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
.top{background:var(--cover);color:#fff;padding:14px max(4vw,16px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-family:Rubik;font-size:19px}.top .sp{flex:1}
.wire{height:6px;background:linear-gradient(90deg,var(--brown) 0 33%,#222 33% 66%,#888 66%)}
main{max-width:900px;margin:0 auto;padding:18px max(4vw,14px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:600px){.grid3{grid-template-columns:minmax(0,1fr)}}
.mut{color:var(--mute);font-size:15px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.big{font-family:Rubik,Assistant,Arial,sans-serif;font-size:34px;font-weight:700;line-height:1}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav a{flex:1;text-align:center;color:var(--mute);text-decoration:none;font-size:13px;padding:4px;border-radius:8px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.nav a.on{color:var(--ink);font-weight:700}.nav a span{font-size:20px;line-height:1}
/* לוח מאמ"תים */
.board{background:light-dark(#dfe3e1,#0f1314);border-radius:14px;padding:10px;border:1px solid var(--line)}
.subj{margin:10px 4px 6px;font-family:Rubik;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:8px;background:repeating-linear-gradient(90deg,#9aa3a6 0 2px,transparent 2px 10px) 0 50%/100% 6px no-repeat}
.mcb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.mcb .lev{width:22px;height:34px;border-radius:5px;border:2px solid var(--line);position:relative;background:var(--bg)}
.mcb .lev i{position:absolute;inset-inline:2px;height:14px;border-radius:3px}
.mcb .nm{font-weight:700;font-size:15px;line-height:1.25}.mcb.off{opacity:.55}
.mcb.sel{outline:3px solid var(--accent)}
/* שאלה */
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:400;line-height:1.45}
.opt b{font-family:Rubik;margin-inline-end:8px}
.opt.pick{border-color:var(--accent);background:light-dark(#e8f0fd,#1a2840)}
.opt.ok{border-color:var(--ok);background:light-dark(#e9f6ea,#16301a)}.opt.no{border-color:var(--bad);background:light-dark(#fdecea,#3a1a19)}
.imgw{overflow-x:auto}.qimg.z{width:760px;max-width:none}.qimg{cursor:zoom-in;width:100%;max-width:820px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.conf0{color:var(--warn)}.conf1{color:var(--mute)}
.res{border-inline-start:4px solid var(--line);padding-inline-start:12px;margin:14px 0}
.res.ok{border-color:var(--ok)}.res.no{border-color:var(--bad)}
.sol{margin-top:10px;border-radius:10px;padding:10px 12px;background:var(--bg)}
.why{background:light-dark(#fdecea,#3a1a19);color:var(--bad);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.steps{margin:8px 0;padding-inline-start:22px;line-height:1.7}.steps li{margin:4px 0}
.tip{background:light-dark(#fff4e0,#33270f);border-radius:8px;padding:8px 10px;margin-top:6px}
.fb{font-family:Rubik,Assistant,Arial,sans-serif;font-size:20px;font-weight:700;margin:8px 0 0}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:600px){.calc{grid-template-columns:minmax(0,1fr)}}
.out{background:var(--bg);border-radius:10px;padding:14px;text-align:center}
label{display:block;font-size:14px;color:var(--mute);margin:6px 0 2px}
.timer{font-family:Rubik;font-variant-numeric:tabular-nums;white-space:nowrap}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:start;font-size:15px}
.hide{display:none!important}
.toast{position:fixed;bottom:90px;inset-inline:16px;max-width:420px;margin:auto;background:var(--cover);color:#fff;padding:10px 14px;border-radius:10px;z-index:9}
@media (prefers-reduced-motion:no-preference){.mcb .lev i{transition:top .4s}}
</style>
</head>

 "t": "law", "a": 3, "c": 1, "f": 0, "q": "חשמלאי בעל רישיון בודק מסוג 1 רשאי לבצע בדיקות במתקנים בעלי עוצמת זרם עד:", "e": "בודק סוג 1 רשאי לבדוק מתקנים עד 3×100A במתח נמוך, למעט מתקן שהוא עצמו גם תכנן וגם ביצע.", "w": ["3×350A מעל תחום בודק סוג 1.", "3×80A הוא תחום אחר.", "3×250A מעל תחום בודק סוג 1.", ""], "o": ["3×350A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו.", "3×80A במתח נמוך, למעט עבודות חשמל אשר תוכננו ובוצעו על ידו.", "3×250A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו.", "3×100A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו."], "s": ["נזכרים בסוגי רישיון בודק: בודק סוג 1 – מתקנים עד 3×100A במתח נמוך.", "שמים לב לניסוח: הוא לא בודק מתקן שהוא עצמו גם תכנן וגם ביצע.", "בוחרים את האפשרות עם 3×100A והניסוח \"תוכננו וגם בוצעו\"."], "tp": "בשאלות רישוי שמים לב גם למספר וגם לניסוח המדויק – \"וגם\" לעומת \"ו\"."}, {"n": 6, "t": "test", "a": 0, "c": 0, "f": 0, "q": "מהו שיעור ההתנגדות התקין בין מוליך מופע למוליך האפס בלוח במתקן חשמלי בבדיקה תקופתית?", "e": "בבדיקה תקופתית של מתקן קיים הדרישה מקלה יותר מאשר במתקן חדש. הערך הנפוץ בתקנות לבדיקה תקופתית הוא 0.25MΩ לפחות. כדאי לוודא מול התקנות העדכניות.", "w": ["", "ערך גבוה מהנדרש.", "ערך גבוה מהנדרש.", "ערך גבוה מהנדרש."], "o": ["0.25 מגה-אום.", "1.5 מגה-אום.", "1.25 מגה-אום.", "1.75 מגה-אום."], "s": ["מזהים שזו בדיקה תקופתית של מתקן קיים, לא מתקן חדש.", "במתקן קיים הדרישה מקלה יותר.", "התשובה המקובלת: לפחות 0.25MΩ."], "tp": "מתקן חדש לפני חיבור – 0.5MΩ. בדיקה תקופתית – 0.25MΩ. לבדוק מול התקנות שלכם."}, {"n": 7, "t": "earth", "a": 2, "c": 1, "f": 0, "q": "מה המספר המינימלי של בורגי חיבור שיותקנו בפס השוואת פוטנציאלים אם יחוברו אליו שני מוליכי חיבור, מוליך מפס הארקות ומוליך הארקת יסוד?", "e": "4 מוליכים צריכים 4 ברגים, ובנוסף התקנות דורשות 2 ברגים שמורים לחיבורים עתידיים: 4 + 2 = 6.", "w": ["אלה רק המוליכים הקיימים, בלי ברגים שמורים.", "חסר בורג שמור אחד.", "", "יותר מהמינימום."], "o": ["4", "5", "6", "7"], "s": ["סופרים את המוליכים שמתחברים: 2 מוליכי חיבור + 1 מפס הארקות + 1 מהארקת יסוד = 4.", "כל מוליך מקבל בורג נפרד.", "מוסיפים 2 ברגים שמורים לחיבורים עתידיים: 4 + 2 = 6."], "tp": "בפס השוואת פוטנציאלים: בורג לכל מוליך + 2 שמורים."}, {"n": 8, "t": "cable", "a": 1, "c": 2, "f": 0, "q": "כיצד יש לנהוג בהוספת מעגל חדש ללוח שבו כל צבעי המוליכים הם לפי התקן הישן?", "e": "עבודה חדשה מבוצעת לפי התקן החדש (חום/שחור/אפור לפאזות, כחול לאפס, צהוב-ירוק להארקה), ומסמנים שלט אזהרה שיש בלוח שני סוגי צבעים.", "w": ["אין חובה להחליף מוליכים קיימים.", "", "אסור להתקין היום לפי צבעים ישנים.", "המתקין החדש אחראי על עבודתו."], "o": ["יש להחליף את כל מוליכי הלוח למניעת טעויות בעתיד.", "יש לחבר לפי התקן החדש ולשים שלט המתריע על כך.", "יש לחבר לפי התקן הישן למניעת טעויות בעתיד.", "לא לנקוט שום פעולה, הלוח באחריות המבצע המקורי."], "s": ["עבודה חדשה מבוצעת תמיד לפי התקן הנוכחי.", "לא חייבים להחליף את כל המוליכים הישנים.", "מתקינים שלט אזהרה שבלוח יש צבעים לפי שני תקנים, כדי שהחשמלאי הבא לא יטעה."], "tp": "צבעים חדשים: חום/שחור/אפור = פאזות, כחול = אפס, צהוב-ירוק = הארקה."}, {"n": 9, "t": "cable", "a": 0, "c": 2, "f": 0, "q": "האם מותר להסתעף ממעגל שחתך מוליכיו 2.5 ממ\"ר להזנת מעגל שחתך מוליכיו 1.5 ממ\"ר?", "e": "כל ירידה בחתך מחייבת מבטח מתאים לחתך הקטן, אחרת המבטח של 2.5 ממ\"ר לא יגן על 1.5 ממ\"ר.", "w": ["", "אי אפשר לסמוך על העומס, צריך הגנה.", "הכלל זהה בבית ובתעשייה.", "אין היתר כזה."], "o": ["אסור לחלוטין. ירידה בחתך המוליך חייבת להיעשות דרך מבטח.", "מותר בתנאי שהעומס הכולל לא יגרום להעמסת יתר.", "אסור בחשמל ביתי, מותר בתעשייה כי בה העוסקים בכך הם חשמלאים.", "מותר בחשמל ביתי למעגלי תאורה בלבד, בתנאי שהזרם בהסתעפות לא יהיה מעל 10 אמפר."], "s": ["מוליך 2.5 ממ\"ר מוגן בדרך כלל ב-16A.", "מוליך 1.5 ממ\"ר מותר לכל היותר 10A.", "אם מסתעפים בלי מבטח, ה-16A לא יגן על המוליך הדק והוא עלול להתחמם.", "לכן כל ירידה בחתך חייבת מבטח מתאים לחתך הקטן."], "tp": "הכלל: ירידה בחתך = מבטח חדש בנקודת הירידה."}, {"n": 10, "t": "law", "a": 3, "c": 0, "f": 0, "q": "האם מותר לבצע עבודות חשמל במתקן חי לצורך החלפת מערכת תאורת חירום?", "e": "עבודה במתקן חי מותרת רק במקרים חריגים שבהם ניתוק דע כללי – זוכרים שאין חשמל גרעיני בישראל."}, {"n": 16, "t": "grid", "a": 0, "c": 2, "f": 0, "q": "מהו תפקיד תחנת המשנה?", "e": "תחנת משנה מורידה מתח עליון (161kV) למתח גבוה (22/33kV) של רשת החלוקה.", "w": ["", "זה תפקיד תחנת המיתוג שליד תחנת הכוח.", "תחנת משנה לא מייצרת חשמל.", "מדידה היא לא התפקיד."], "o": ["להוריד מתח עליון ל\"מערכת החלוקה\".", "להעלות את המתח המיוצר בתחנה למתח עליון.", "לייצר חשמל לישובים קרובים.", "למדוד מתח המגיע למתקני החשמל."], "s": ["תחנת משנה נמצאת בין הרשת הארצית לרשת החלוקה.", "היא מורידה מתח עליון (161kV) למתח גבוה (22/33kV) של רשת החלוקה."], "tp": "תחנת משנה = הורדת מתח עליון לחלוקה."}, {"n": 17, "t": "grid", "a": 2, "c": 2, "f": 0, "q": "מהו היתרון של חמרן (אלומיניום) בהשוואה לנחושת בבניית קווי הלכה עיליים?", "e": "אלומיניום קל בערך פי 3 מנחושת, ולכן מתאים לקווים עיליים (עמודים קלים יותר).", "w": ["זה חיסרון.", "זה חיסרון.", "", "זה לא היתרון העיקרי."], "o": ["מוליכות נמוכה.", "חוזק מכני נמוך.", "משקל נמוך.", "גמישות גבוהה."], "s": ["משווים בין אלומיניום לנחושת: אלומיניום מוליך פחות וחלש יותר מכנית, אבל קל בהרבה.", "בקו עילי המשקל קריטי לעמודים ולמתיחה.", "לכן היתרון הוא משקל נמוך."], "tp": "אלומיניום: קל וזול. נחושת: מוליכה יותר."}, {"n": 18, "t": "grid", "a": 0, "c": 2, "f": 0, "q": "מהי המתכת בעלת המוליכות החשמלית הטובה ביותר?", "e": "הסדר: כסף > נחושת > זהב > אלומיניום.", "w": ["", "זהב פחות מוליך מנחושת.", "שנייה אחרי כסף.", "פחות מוליך מנחושת."], "o": ["כסף.", "זהב.", "נחושת.", "אלומיניום."], "s": ["סדר המוליכות מהטוב לפחות טוב: כסף, נחושת, זהב, אלומיניום.", "לכן התשובה: כסף."], "tp": "כסף הכי טוב, אבל יקר מדי לשימוש רגיל – לכן משתמשים בנחושת."}, {"n": 19, "t": "grid", "a": 3, "c": 2, "f": 0, "q": "מה אינו מיתרונות האלומיניום על הנחושת?", "e": "המוליכות של אלומיניום כ-60% מזו של נחושת. זה חיסרון ולא יתרון.", "w": ["יתרון.", "יתרון.", "שכבת התחמוצת מגינה עליו – נחשב יתרון.", ""], "o": ["משקל נמוך.", "עלות נמוכה.", "אינו מחליד.", "מוליכות חשמלית."], "s": ["מחפשים את מה שאינו יתרון.", "משקל נמוך ועלות נמוכה הם יתרונות, ושכבת התחמוצת מגינה מפני קורוזיה.", "המוליכות של אלומיניום נמוכה מזו של נחושת (כ-60%) – זה חיסרון."], "tp": "בשאלות \"מה אינו\" מסמנים כל אפשרות נכון/לא נכון, ובוחרים את היוצאת דופן."}, {"n": 20, "t": "ctrl", "a": 1, "c": 1, "f": 1, "q": "לפניך סכמת הפעלה של אוטומט חדר מדרגות באמצעות לחצנים A, B, C. בנוסף מורכב מפסק מחליף SW1 בצורה מיוחדת. מה יהיה אם נחליף את מצבו של SW1?", "e": "SW1 מחליף את הזנת נורה 1 בין יציאת האוטומט (הדק 3) לבין הפאזה L ישירות. במצב השני נורה 1 מוזנת קבוע ושאר הנורות נשארות על האוטומט.", "w": ["רק נורה 1 מושפעת מ-SW1.", "", "ההפך.", "אין קצר – המחליף בוחר מקור הזנה."], "o": ["כל הנורות ידלקו באופן קבוע.", "נורה 1 תדלק קבוע ושאר הנורות ידלקו באמצעות אוטומט חדר המדרגות.", "נורה 1 תדלק באמצעות אוטומט חדר מדרגות ושאר הנורות ידלקו קבוע.", "אסור לחבר מפסק מחליף בצורה כזאת כי כך הוא יקצר את המעגל."], "s": ["עוקבים בשרטוט: הדק 3 של האוטומט מזין את נורות 2 ו-3, ואת אחד המגעים של SW1.", "המגע השני של SW1 מחובר ישר לפאזה L, והמגע המרכזי מזין את נורה 1.", "כשמחליפים את מצב SW1, נורה 1 עוברת לקבל פאזה ישירה ודולקת קבוע.", "נורות 2 ו-3 נשארות מחוברות לאוטומט."], "tp": "במפסק מחליף בודקים מה מחובר למגע המשותף ומה לכל אחד מהמגעים.", "img": "data:image/webp;base64,UklGRjJAAABXRUJQVlA4ICZAAABQMQGdASq8Av0BPt1orVKopaSiopLK4RAbiWlu/BmZM2inZ14/pH/dv69+znmX/T/8N/dP26/vPpX+K/N/47+6fuL/iPi8+Z/8Dwu+ZfwP+6/wnqd/Hvt5+W/u/7yf3j2i/1H+C/HP0h+EX9Z/fP73+0HyC/lP8z/0P9u8hvY8az/sP+L6gvrF9L/5X+B/LH3F/dv9t/gPUb82/sP+t/wX5LfYD/Kf6x/uvVv/Tfsf5MP3j/c/r38An89/vf/l/znutf1n/t/035ze4D8+/1n/w/1XwF/zv+5/sl24gVo9KdwjOs4vLO7fLRgwjwazPKEIQQEOEPfDN49RL4p7gwDr2tTrJA0LvXjJSM7kKL4tUAX/rthmQZlPdCquo2xP/9hw64GGES02jiO/1H9bfQMH824Sc5RKUwuAuGVdfuDX+0lClCs39Ha5Or5Yfp1zzrXm0yFfvSklb7q9MN2Y2hAtUG6xhhSIC4jqHukV2tqCehcny02nEnGjgbRsHJnQTR1cFkO9UAHc0dqC/vWY6eJwPgWZ+fX57HDdteNmWvZQAoJw6Hb2nDstuR/HvWsYV4+pEPO/c3ynVX8CYW53Ll1GHnDQwMjBae4F+KAJbMFBbDaXTvkCvYLbXDTxz06l1+SDhABMzwu5YOFZf7sHnGGEVWCD2LRT6NdM3Ez6L84rYBWmUI8oxAcszUAIQWiP2M4PPtKOQUD3kmyVWk0NgU8WlfcoU0IGY8rna+W294+PNiDn/I65Y2aLNRvfpY7VniHDf2F+MA3WJQSWK04zlP16Kb/4bffc  "tp": "קודם מכפילים במקדם הביקוש, אחר כך מחשבים זרם, ובוחרים את החיבור הסטנדרטי שמעליו."}, {"n": 27, "t": "test", "a": 1, "c": 1, "f": 0, "q": "מהי ההתנגדות המזערית של בידוד בדירת מגורים חדשה לפני החיבור של חברת החשמל?", "e": "במתקן חדש במתח נמוך התנגדות הבידוד המזערית הנדרשת היא 0.5MΩ (בבדיקה ב-500V DC).", "w": ["ערך גבוה מהדרישה.", "", "זה ערך לבדיקה תקופתית.", "נמוך מדי."], "o": ["1.5MΩ", "0.5MΩ", "0.25MΩ", "0.15MΩ"], "s": ["מזהים: דירה חדשה, לפני חיבור לחברת החשמל.", "במתקן חדש התנגדות הבידוד המזערית היא 0.5MΩ."], "tp": "חדש = 0.5MΩ, תקופתי = 0.25MΩ."}, {"n": 28, "t": "cable", "a": 2, "c": 2, "f": 0, "q": "המעגל במתקן הביתי מוגן באמצעות מבטח בעל זרם נקוב של 16 אמפר. האם מותר להסתעף ממוליך בחתך של 2.5 ממ\"ר על ידי מוליך בחתך של 1.5 ממ\"ר מבלי להתקין מבטח נוסף בעל זרם נקוב של 10 אמפר?", "e": "מבטח של 16A לא מגן על מוליך 1.5 ממ\"ר. כל ירידה בחתך מחייבת מבטח שמתאים לחתך הקטן.", "w": ["16A גבוה מדי עבור 1.5 ממ\"ר.", "העומס לא מחליף הגנה.", "", "עם מבטח מתאים זה מותר."], "o": ["אין שום בעיה להסתעפות, כי מבטח של 16A מגן על כל המוליכים בחתך עד 2.5 ממ\"ר.", "מותר, רק אם מוליך של 1.5 ממ\"ר מזין את מעגל התאורה בלבד בעומס הכולל פחות מ-10A.", "אסור לרדת בחתך המוליך ללא התקנה של מבטח מתאים בכל מקרה.", "הסתעפות של 2 מוליכים בעלי חתך שונה אסורה אפילו עם התקנת מבטחים מתאימים."], "s": ["מבטח 16A מגן על מוליך 2.5 ממ\"ר.", "מוליך 1.5 ממ\"ר מותר רק עד 10A.", "בלי מבטח 10A בנקודת ההסתעפות, המוליך הדק לא מוגן.", "לכן אסור לרדת בחתך בלי מבטח מתאים."], "tp": "אותו כלל כמו שאלה 9: כל ירידה בחתך = מבטח חדש."}, {"n": 29, "t": "earth", "a": 0, "c": 0, "f": 0, "q": "באיזה תנאי מותר להאריק את הדוד לחימום מים (בוילר) באמצעות חיבור לקונסטרוקציה של הארקת היסוד של הבניין?", "e": "מוליך הארקה מגיע מהלוח, ובנוסף מחברים את הדוד להשוואת פוטנציאלים. חיבור לברזל הבניין מותר כשיש מוט זיון בקוטר מספיק (10 מ\"מ). כדאי לוודא מול התקנות.", "w": ["", "גלוון אינו הדרישה.", "ריתוך אינו הדרישה היחידה כאן.", "ייתכן לפי פרשנות מסוימת – כדאי לבדוק עם המורה."], "o": ["בתנאי שקוטר המוט יהיה לפחות 10 מ\"מ.", "בתנאי ייה.", "הרצועה מתכופפת ומפעילה את המנגנון."], "tp": "הפרש פוטנציאלים בחימום זה צמד תרמי (תרמוקפל), לא דו-מתכת."}, {"n": 33, "t": "shock", "a": 0, "c": 2, "f": 0, "q": "עקרון פעולה של ממסר פחת הוא:", "e": "ממסר פחת משווה בין זרם הפאזה לזרם האפס. הפרש (זרם זליגה) מעל IΔn גורם לניתוק.", "w": ["", "זה חלק מהמנגנון, לא העיקרון.", "זו הגנה תרמית.", "זה נתיך."], "o": ["השוואה בין הזרם שמגיע לממסר לבין הזרם החוזר ממנו.", "שדה מגנטי המושרה סביב סליל.", "התחממות הדו-מתכת כתוצאה ממעבר זרם גבוה.", "התכת תיל מתכתי כתוצאה ממעבר זרם גבוה."], "s": ["בפחת עוברים דרך טבעת גם הפאזה וגם האפס.", "במצב תקין הזרמים שווים, והשדה המגנטי בטבעת מתאפס.", "בזליגה לאדמה הזרם החוזר קטן יותר, ונוצר הפרש.", "הפרש מעל IΔn (למשל 30mA) מנתק."], "tp": "פחת = השוואה בין זרם נכנס לזרם יוצא."}, {"n": 34, "t": "ocp", "a": 1, "c": 2, "f": 0, "q": "עקרון סלקטיביות או \"מדרג הגנות\" הוא:", "e": "בסלקטיביות מנתקת רק ההגנה הקרובה לתקלה, וכל שאר המתקן ממשיך לעבוד.", "w": ["ההפך.", "", "זה בדיוק מה שסלקטיביות מונעת.", "לא קשור."], "o": ["עקרון לפיו מופעלת ההגנה הרחוקה ביותר ממקום התקלה.", "עקרון לפיו מופעלת ההגנה הקרובה ביותר למקום התקלה ורק ההגנה הזו.", "עקרון לפיו מופעלות כל ההגנות – מהראשית עד ההגנה של מקום התקלה עצמו.", "עקרון לפיו מופעל ממסר פחת במקרה של זרם זליגה."], "s": ["המטרה: לנתק רק את המקום התקול.", "לכן מנתקת ההגנה הקרובה ביותר לתקלה, ורק היא.", "שאר המתקן ממשיך לעבוד."], "tp": "סלקטיביות = רק הקרובה לתקלה מנתקת."}, {"n": 35, "t": "ocp", "a": 0, "c": 2, "f": 1, "q": "נתון איור – אופיין של מאמ\"ת. הסבר את עקרון הפעולה של ההגנה התרמית באופיין:", "e": "ההגנה התרמית פועלת באופיין זמן הפוך: ככל שזרם היתר גדול יותר, הדו-מתכת מתחמם מהר יותר והניתוק מהיר יותר.", "w": ["", "ההפך.", "זרם קצר מטופל בהגנה המגנטית.", "שגוי."], "o": ["ככל שהערך של זרם יתר גדול יותר – זמן הניתוק קצר יותר.", "ככל שהערך של זרם יתר גדול יותר – זמן ניתוק ארוך יותר.", "ככל שהערך של זרם קצר גדול יותר – זמן הניתוק קצר יותר.", "ככל שהערך של זרם קצר גדול יותר – זמן ניתוק ארוך יותר."], "s": ["באופיין מאמ\"ת, החלק העליון המשופע הוא התחום התר מקדם ביקוש: 15700 × 0.6 = 9,420W.", "בודקים חד-מופעי: 9420/220 ≈ 42.8A – גדול מ-40A.", "עוברים לתלת-מופעי: 9420/(√3×380) ≈ 14.3A, ולכן 3x25."], "tp": "אם הזרם החד-מופעי גדול מ-40A – עוברים לתלת-מופעי."}, {"n": 41, "t": "shock", "a": 2, "c": 2, "f": 1, "q": "איך מוסיפים מפסק מגן נוסף לקיים במקרה של זרם דלף מצטבר?", "e": "כל פחת חייב \"לראות\" גם את הפאזה וגם את האפס של המעגלים שלו. לכן מחברים את הפחתים במקביל, ולכל אחד פס אפסים נפרד.", "w": ["פס משותף יגרום לנפילות שווא.", "פס אפסים משותף גורם להפרש זרמים ונפילות.", "", "בטור אין חלוקת זרם דלף."], "o": ["מחלקים את המעגלים לשני המפסקים. המפסקים מחוברים בטור ומזינים פס אפסים משותף.", "מחלקים את המעגלים לשני המפסקים. המפסקים מחוברים במקביל ומזינים פס אפסים משותף.", "מחלקים את המעגלים לשני המפסקים. המפסקים מחוברים במקביל ומזינים שני פסי אפסים, כאשר כל מעגל מקבל אפס מאותו מפסק שממנו קיבל פאזה.", "מחלקים את המעגלים לשני המפסקים. המפסקים מחוברים בטור ומזינים שני פסי אפסים, כאשר כל מעגל מקבל אפס מאותו מפסק שממנו קיבל פאזה."], "s": ["פחת מודד הפרש בין פאזה לאפס של המעגלים שלו.", "אם האפסים של שני הפחתים מחוברים לאותו פס, זרם יחזור דרך הפחת הלא נכון ויגרום לנפילות שווא.", "לכן: הפחתים במקביל (כל אחד מזין חצי מהמעגלים), ולכל פחת פס אפסים משלו."], "tp": "לכל פחת – פס אפס משלו. אף פעם לא לערבב אפסים בין פחתים.", "img": "data:image/webp;base64,UklGRvBIAABXRUJQVlA4IORIAABQTwGdASq8AiECPt1qrlMopaQionJKYRAbiWlu///tNb99ZzfxqpozG4WP8c/2b8kPex8X/Sv7j/cf2r/wvpf+K/O/4v+3/tr/ffY9/uPEB5z/Df7f+2+pn8f+1v5n+5/5b9gvav/O/3H9wfNH8o/bP9B/ifYF/M/51/mf7v+TXqK/zv23+LFpn+u/53+d9gX1o+f/8r/Af6X9nfcm9q/2X+M9Sfz/+w/5f+1/vR/n/sA/k/9Z/2/+M/Kb5d/y37L+TR97/1X7QfAF/NP7N/5P8f/pfhS/qv/R/o/zr9wf5z/pf/b/qPgM/nP9w/8P+S7Zw6inUsY9+daxi9Jhm9N/aguZe+8+kiVQ7VDBEEvPxGqqgCvPUYM5EkM1gfIihxumLBbGsPQmywSM19EVTAQsPbrdhfw3Pt0DWbupf+e3l0VlS5ux0M7mTEs5XzH4bYCK8q8mWEcdHoC0dZjYIV4tedP61BuXwJcvZwUValuEy48qOKlEOwJi6EuKuPOxTpcQOeEmdtsk79bYVsP+hqPoEhIx/lPHyA/kSPx2L9tSxj3VwempiNoFONeAk/OEWOYXHoocRE+ctj4t1wg0bHyN12dAy0FLyozgO9cE3QsWFpPwIlnQ19fAcHjIMVrCrjB45KXdytLFhWF9Ka4QPO9AdfYj2XsLcJfd נכי IPX1X."], "s": ["באמבטיה האזורים מסודרים לפי המרחק מהמים.", "ככל שמתרחקים, דרגת ההגנה הנדרשת יורדת.", "אזור 3 הוא הרחוק ביותר, ומספיק בו IPX1 – הגנה מפני טפטוף אנכי."], "tp": "קרוב למים – IPX4/5. רחוק (אזור 3) – IPX1."}, {"n": 47, "t": "pf", "a": 1, "c": 1, "f": 0, "q": "כדי לשפר את גורם ההספק של משאבה גדולה, עשו חישוב עבור גודלה של סוללת הקבלים בכוכב וקיבלו הספק של 60 KVAR. מהו ההספק של סוללת הקבלים בחיבור משולש?", "e": "ההספק ההיגבי הנדרש תלוי בצרכן, לא בצורת החיבור: 60 KVAR בשני המקרים. מה שמשתנה הוא הקיבול של כל קבל – במשולש הוא קטן פי 3.", "w": ["זה הקיבול שקטן פי 3, לא ההספק.", "", "שגוי.", "ההספק לא משתנה."], "o": ["בחיבור הקבלים במשולש נצטרך הספק פי 3 קטן, כלומר 20 KVAR.", "בחיבור הקבלים במשולש נצטרך אותו ההספק בדיוק כמו בכוכב, כלומר 60 KVAR.", "בחיבור הקבלים במשולש נצטרך הספק פי 3 גדול, כלומר 180 KVAR.", "עבור חיבור הקבלים במשולש יש לבצע חישוב מחדש."], "s": ["מבינים שההספק ההיגבי שהצרכן צריך לא תלוי בצורת החיבור.", "לכן גם במשולש צריך 60 KVAR.", "מה שמשתנה: במשולש כל קבל מקבל מתח גבוה פי √3, ולכן הקיבול שלו קטן פי 3."], "tp": "כוכב/משולש משנה את הקיבול (µF), לא את ההספק (KVAR)."}, {"n": 48, "t": "pf", "a": -1, "c": 0, "f": 0, "q": "לגודל 0.95. מה הספקה של סוללת הקבלים שיש להזמין לצורך זה?", "e": "בשאלה הזו במאגר חסרים נתונים (חסרה תחילת השאלה), ולכן אי אפשר לפתור אותה. היא לא נספרת בציון.", "w": ["", "", "", ""], "o": ["81 KVAR", "38 KVAR", "2.409 KVAR", "-2.409 KVAR"], "s": ["בשאלה הזו חסרים נתונים במאגר, ואי אפשר לפתור אותה."], "tp": "אם יש לכם את הנוסח המלא – תשלחו ואוסיף."}, {"n": 49, "t": "motor", "a": 3, "c": 2, "f": 1, "q": "יש להזמין מפסק מנוע (PKZM 0) לצורך מיתוג ידני של מנוע בעל הספק נקוב של 10 קילוואט, מקדם הספק 0.72 ונצילות 85%. מתח הזנה תלת-מופעי 400 וולט. איזה מפסק תבחר?", "e": "I = P/(η·√3·U·cosφ) = 10000/(0.85×1.732×400×0.72) ≈ 23.6A. זה בתוך תחום 20–25A.", "w": ["קטן מדי.", "קטן מדי.", "קטן מדי.", ""], "o": ["PKZM0-12 כיוונון תרמי 8...12 אמפר.", "PKZM0-16 כיוונון תרמי 10...16 אמפר.", "PKZM0-20 כיוונון תרמי 16...20 אמפר.", "PKZM0-25 כיוו /√3 = 230V, והזרם קטן פי 3.", "לכן המנוע מתאים להתנעת כוכב-משולש ברשת 400V."], "tp": "המתח שליד Δ הוא מתח הרשת לעבודה רגילה. אם הוא שווה למתח הרשת – אפשר כוכב-משולש."}, {"n": 51, "t": "ocp", "a": 2, "c": 2, "f": 0, "q": "מהי עוצמתו של זרם בדיקה גבוהה I2 של מאמ\"ת הניתן לכוונון?", "e": "זרם ההפעלה המוסכם I2 של מאמ\"ת הוא 1.45×In: ניתוק מובטח תוך פחות משעה. וזרם אי-ההפעלה I1 הוא 1.13×In.", "w": ["", "", "", ""], "o": ["I2 = 1.75 × In", "I2 = 1.60 × In", "I2 = 1.45 × In", "I2 = 1.30 × In"], "s": ["למאמ\"ת יש שני זרמי בדיקה מוסכמים.", "I1 = 1.13×In: לא מנתק במשך שעה.", "I2 = 1.45×In: מנתק תוך פחות משעה.", "לכן I2 = 1.45×In."], "tp": "לשנן את הזוג: 1.13 ו-1.45."}, {"n": 52, "t": "cable", "a": 1, "c": 1, "f": 0, "q": "מהו עומק הטמנה המזערי של כבל כוח בקרקע חול?", "e": "עומק הטמנה מזערי מקובל לכבל מתח נמוך הוא 80 ס\"מ, ומעליו מניחים סרט סימון.", "w": ["רדוד מדי.", "", "נדרש במקרים מיוחדים (למשל מתחת לכביש).", "סרט אזהרה לא מחליף עומק."], "o": ["60 ס\"מ.", "80 ס\"מ.", "100 ס\"מ.", "אין חשיבות בעומק בתנאי שמעל כבל בעומק 25 ס\"מ מונח סרט אזהרה תקני עם רקע צהוב."], "s": ["כבל מתח נמוך שמונח באדמה צריך עומק מזערי.", "המקובל: 80 ס\"מ, ומעליו סרט סימון.", "מתחת לכביש או במקרים מיוחדים – עמוק יותר."], "tp": "סרט אזהרה הוא תוספת, לא תחליף לעומק."}, {"n": 53, "t": "cable", "a": 2, "c": 2, "f": 0, "q": "מהי טמפרטורת העבודה המרבית של מוליכי הזנה (כבלים) עד 1,000 וולט בעלי בידוד עשוי פוליאתילן מוצלב (XLPE)?", "e": "בידוד XLPE עמיד בטמפרטורת עבודה רציפה של 90°C (PVC עמיד ב-70°C).", "w": ["שגוי.", "אלה טמפרטורות סביבה ייחוס.", "", "יש הגבלה."], "o": ["כמו טמפרטורת האוויר או האדמה (תלוי בסוג ההתקנה).", "35 מעלות (התקנה באוויר) ו-30 מעלות (התקנה באדמה), כמו שמוגדר בטבלאות מקדמי תיקון.", "90 מעלות צלזיוס.", "אין הגבלה, בתנאי שמותקנים אמצעי הגנה בפני שריפה לפי תקן אירופאי IEC 332-3."], "s": ["מזהים את סוג הבידוד: XLPE (פוליאתילן מוצלב).", "טמפרטורת עבודה רציפה מרבית ל-XLPE: 90°C."], "tp": "XLPE = 90°C, PVC = 70°C."}, {"n": 54, "t": "dwell", "a": 1, "c": 0, "f": 0, "q": "מהו מספר המכשירים התלת-מופעיים שמותר לחבר למעגל סופי?", "e": "אפשר לחבר כמה מכשירים תלת-מופעיים למעגל אחד, בתנאי שלכל אחד יש הגנת זרם יתר משלו. כדאי לבדוק עם המורה מול נוסח התקנות.", "w": ["", "", "אין קשר בין מספר המכשירים למספר המופעים.", "מותר."], "o": ["מכשיר אחד בלבד, ללא שום תנאי.", "יותר ממכשיר אחד, בתנאי שכל מכשיר יהיה מוגן ע\"י מבטח בפני זרם יתר המיועד רק עבורו.", "שלושה מכשירים בלבד, לפי מספר המופעים בכבל ההזנה.", "למעגל סופי מותר לחבר רק מכשירים חד-מופעיים. התקנת מכשיר תלת-מופעי במעגל סופי אסורה לחלוטין, לפי פרק \"מעגלים סופיים\" של חוק החשמל."], "s": ["מעגל סופי יכול להזין יותר ממכשיר תלת-מופעי אחד.", "התנאי: לכל מכשיר הגנת זרם יתר משלו.", "התשובה מוצעת – לבדוק מול נוסח התקנות."], "tp": "בתשובות \"אסור לחלוטין\" שווה לבדוק – הרבה פעמים יש תנאי שמתיר."}, {"n": 55, "t": "pf", "a": 2, "c": 2, "f": 0, "q": "נתון צרכן: נורת נתרן לחץ גבוה בעלת הספק של 500W ומקדם הספק 0.43, מתח הרשת 230V/50Hz. קבע את ערך הקבל הנדרש לשיפור מקדם ההספק של הנורה ל-0.92 לפי דרישת חוק החשמל:", "e": "Qc = P(tanφ1 − tanφ2) = 500×(2.098 − 0.426) ≈ 837 VAr. C = Qc/(U²·ω) = 837/(230²×314) ≈ 50.36 µF.", "w": ["", "", "", ""], "o": ["37.5 µF", "40.47 µF", "50.36 µF", "52.26 µF"], "s": ["נתונים: P = 500W, cosφ1 = 0.43, cosφ2 = 0.92, U = 230V.", "tanφ1 = tan(acos 0.43) = 2.098, tanφ2 = 0.426.", "Qc = 500 × (2.098 − 0.426) ≈ 837 VAr.", "C = Qc/(U²·2πf) = 837/(230² × 314) ≈ 50.36 µF."], "tp": "4 שלבים קבועים: tanφ1, tanφ2, Qc, C."}, {"n": 56, "t": "pf", "a": 0, "c": 2, "f": 0, "q": "במתקן חשמלי מחוברים במקביל 2 מנועים: P1 = 8kW, cosφ = 0.75 ; P2 = 8kW, cosφ = 0.75. חשב את ההספק בקבל שיש לחבר במקביל ל-2 המנועים על מנת לשפר את מקדם ההספק לערך הדרוש לפי דרישת חברת החשמל:", "e": "P = 16kW. Qc = 16×(tan(acos0.75) − tan(acos0.92)) = 16×(0.882 − 0.426) ≈ 7.29 KVAr (דרישת חברת החשמל: 0.92).", "w": ["", "", "", ""], "o": ["7.29 KVAr", "10.16 KVAr", "13.37 KVAr", "14.20 KVAr"], "s": ["מחברים הספקים: P = 8 + 8 = 16kW (אותו cosφ).", "tanφ1 = tan(acos 0.75) = 0.882, ודרישת חברת החשמל cosφ = 0.92 → tanφ2 = 0.426.", "Qc = 16 × (0.882 − 0.426) ≈ 7.29 KVAr."], "tp": "\"דרישת חברת החשמל\" = 0.92. כדאי לזכור את tan של 0.92: 0.426."}, {"n": 57, "t": "pf", "a": 2, "c": 2, "f": 0, "q": "נתון הספק פעיל והספק היגבי של הצרכן: P = 20 kW ; Q = 8.6 kVAr. חשב את מקדם ההספק:", "e": "S = √(20² + 8.6²) ≈ 21.77 kVA. cosφ = P/S = 20/21.77 ≈ 0.92.", "w": ["", "", "", ""], "o": ["cosφ = 0.63", "cosφ = 0.75", "cosφ = 0.92", "cosφ = 1"], "s": ["S = √(P² + Q²) = √(20² + 8.6²) = √(400 + 73.96) ≈ 21.77 kVA.", "cosφ = P/S = 20/21.77 ≈ 0.92."], "tp": "משולש ההספקים: P ניצב, Q ניצב, S יתר. cosφ = P/S."}, {"n": 58, "t": "pf", "a": 3, "c": 2, "f": 0, "q": "נתון צרכן חד-מופעי בהספק 2kW, מקדם הספק 0.7. המתח הנקוב הוא 220V/50Hz. מה גודל הקבל שיש להתקין כדי לשפר את מקדם ההספק ל-0.92?", "e": "Qc = 2000×(1.020 − 0.426) ≈ 1188 VAr. C = 1188/(220²×314) ≈ 78.15 µF.", "w": ["", "", "", ""], "o": ["47.4 µF", "68.6 µF", "73.8 µF", "78.15 µF"], "s": ["tanφ1 = tan(acos 0.7) = 1.020, tanφ2 = 0.426.", "Qc = 2000 × (1.020 − 0.426) ≈ 1188 VAr.", "C = 1188/(220² × 314) ≈ 78.15 µF."], "tp": "לשים לב שהמתח כאן 220V ולא 230V – זה משנה את התוצאה."}, {"n": 59, "t": "pf", "a": 3, "c": 1, "f": 0, "q": "נתון מדחס המחובר לרשת תלת-מופעית של 400V/50Hz, בהספק 20kW ו-cosφ = 0.85. מה הערך של סוללת קבלים המשפרת את מקדם ההספק ל-0.92, בהנחה שהסוללה מחוברת בכוכב?", "e": "Qc = 20000×(0.620 − 0.426) ≈ 3875 VAr, כלומר 1292 VAr לכל קבל. בכוכב כל קבל מקבל 230V: C = 1292/(230²×314) ≈ 77.1 µF.", "w": ["", "", "", ""], "o": ["3 × 44.76 µF", "3 × 55.56 µF", "3 × 66.19 µF", "3 × 77.19 µF"], "s": ["tanφ1 = tan(acos 0.85) = 0.620, tanφ2 = 0.426.", "Qc = 20000 × (0.620 − 0.426) ≈ 3875 VAr, כלומר 1292 VAr לכל אחד מ-3 הקבלים.", "בכוכב כל קבל מקבל מתח מופע: 400/√3 = 230V.", "C = 1292/(230² × 314) ≈ 77.1 µF לכל קבל."], "tp": "כוכב → 230V לקבל. משולש → 400V לקבל. מחלקים את Qc ב-3."}, {"n": 60, "t": "pf", "a": 2, "c": 1, "f": 0, "q": "בבית מלאכה המוזן מרשת תלת-מופעית בעלת מתח קווי של 400V/50Hz קיים מנוע בהספק 8kW ומקדם הספק 0.75. חשב את ההספק ההיגבי של סוללת הקבלים לשיפור גורם ההספק ל-0.92:", "e": "Qc = 8×(0.882 − 0.426) ≈ 3.65 kVAr. בוחרים את הגודל הסטנדרטי שמעליו: 4 kVAr.", "w": ["", "קטן מהנדרש (3.65).", "", "גדול מהנדרש."], "o": ["2 kVAr", "3 kVAr", "4 kVAr", "5 kVAr"], "s": ["tanφ1 = tan(acos 0.75) = 0.882, tanφ2 = 0.426.", "Qc = 8 × (0.882 − 0.426) ≈ 3.65 kVAr.", "בוחרים את הגודל הסטנדרטי שמעל: 4 kVAr."], "tp": "כשהתוצאה בין שני ערכים – בוחרים את הגדול, כדי להגיע ל-0.92."}, {"n": 61, "t": "pf", "a": 0, "c": 2, "f": 0, "q": "חשב את ערך הקבל המשפר את מקדם ההספק של נורת פלואורסצנט בעלת הספק של 50W מ-0.45 ל-0.92. מתח הרשת הוא 230V/50Hz:", "e": "Qc = 50×(1.985 − 0.426) ≈ 77.9 VAr. C = 77.9/(230²×314) ≈ 4.69 µF.", "w": ["", "", "", ""], "o": ["4.67 µF", "4.78 µF", "5.67 µF", "7.76 µF"], "s": ["tanφ1 = tan(acos 0.45) = 1.985, tanφ2 = 0.426.", "Qc = 50 × (1.985 − 0.426) ≈ 78 VAr.", "C = 78/(230² × 314) ≈ 4.69 µF, הקרוב ל-4.67 µF."], "tp": "גם לנורה בודדת – אותם 4 שלבים."}, {"n": 62, "t": "pf", "a": 0, "c": 2, "f": 1, "q": "נתונה רשת המוזנת 230V/50Hz עם שני צרכנים: SM1 = 5+3j kVA, SM2 = 5+3j kVA. מצא את גודל הקבל שצריך להתקין על מנת לשפר את מקדם ההספק כדרישת חברת החשמל:", "e": "P = 10kW, Q = 6kVAr. Qc = 6000 − 10000×0.426 ≈ 1740 VAr. C = 1740/(230²×314) ≈ 104.7 µF.", "w": ["", "", "", ""], "o": ["104.81 µF", "66.1 µF", "56.1 µF", "46.1 µF"], "s": ["מחברים את שני הצרכנים: S = (5+3j) + (5+3j) = 10 + 6j kVA, כלומר P = 10kW ו-Q = 6kVAr.", "Q רצוי ב-0.92: P × 0.426 = 4.26 kVAr.", "Qc = 6 − 4.26 = 1.74 kVAr.", "C = 1740/(230² × 314) ≈ 104.7 µF."], "tp": "כשנתון S מרוכב: החלק הממשי = P, החלק המדומה = Q.", "img": "data:image/webp;base64,UklGRnIbAABXRUJQVlA4IGYbAADwiwCdASq8AtQAPt1srlMopaQiojHqWRAbiWlu/DZ5FivnZ13/pl/YPyM8BP7h/WP2687fxn5b/AfmN/bPh3+Gf7Dwk+W/tn+l/vHqX/Ifs3+P/s394/8XqZ/lfy8/wHoX+P/p/+h+4j5Avy3+Zf577ivVN/l+0K07/T/8z1BfXT6t/3f8b4kv+X6DfnX9p/5P9K+AD+Pf1j/gf4D2i/zXgmfa/9d+13wCf0T/F/tR7qn9f/6P9d6Ev0D/U/+v/SfAd/O/7x/4fv6Fda5edvWNLzynAYmCnJUPx0PLqVh+5YwNTbH96oE/qCmmIbqM18PRXwKjxT8BFoSwET/LnptNzYXCyrCiXaoucPkqpgcaWBPIYAvFd4xMkmHLRgDkph+P09OfsX ודים (סה\"כ שלושה כבלים צמודים). הטמפרטורה הסביבתית היא 45°C.", "e": "Iz מהטבלה (XLPE נחושת 25 ממ\"ר באדמה), כפול מקדם קיבוץ לשלושה כבלים וכפול מקדם טמפרטורה ל-45°C. צריך לבדוק בטבלאות שלכם – התשובה לא אומתה.", "w": ["", "", "", ""], "o": ["49A", "94A", "59A", "31A"], "s": ["לוקחים מהטבלה את Iz של XLPE 3×25 נחושת באדמה.", "מכפילים במקדם קיבוץ ל-3 כבלים ובמקדם טמפרטורה ל-45°C.", "התשובה לא אומתה – לבדוק בטבלאות שלכם."], "tp": "כל מקדם תיקון מקטין את הזרם – התשובה תמיד קטנה מערך הטבלה."}, {"n": 108, "t": "light", "a": 3, "c": 2, "f": 1, "q": "מהי עוצמת ההארה בנקודה P הנמצאת במרחק של 5.3 מטרים מעמוד שגובהו 15 מטרים? עוצמת האור לכיוון הנקודה היא 5,000 קנדלות.", "e": "E = I·cosα/r². r² = 15² + 5.3² = 253.1, cosα = 15/15.91 = 0.943. E = 5000×0.943/253.1 ≈ 18.62 לוקס.", "w": ["", "זה I/h² בלי זווית.", "", ""], "o": ["314 לוקס", "22.2 לוקס", "20.9 לוקס", "18.62 לוקס"], "s": ["מרחק מהנורה לנקודה: r² = h² + d² = 15² + 5.3² = 253.1, ולכן r ≈ 15.91.", "cosα = h/r = 15/15.91 = 0.943.", "E = I × cosα / r² = 5000 × 0.943 / 253.1 ≈ 18.62 לוקס."], "tp": "אפשר גם E = I × cos³α / h², ויוצא אותו דבר.", "img": "data:image/webp;base64,UklGRlgwAABXRUJQVlA4IEwwAADQ2wCdASq8AlgBPt1urlKopiQioxSqIRAbiWlu/+lcL67DH/X7q/1ejOGr2GIB3u8U/530cWQHHn5rH6PHaBtB7P0u/wf9f7n/8/+XHnn+L/Pf4/+9ftV/g/am/nPD36V/H/9n0N/lH3I/K/3n93PXL/Pf3vxh+L39h/gv2x+Aj8o/mf+m8WXZobJ5gvsN9i/8H+V8aP+3/v3qF+j/3//W+4B/NP7D/0fWz/JeDR+R/2/7Y/AF/SP8j+13uv/1v/r/1H+f/eL3Gfon+t/+P+1+A/9hOu8OkfGrm4tUAEaBAAzHRD1Vl6Ok3mSoUcXumByO49Gnj6zqIUCsrlz5KXBYi6k1Q+R+rCHieRD272UMGMK0UKESlhQTKQwC4BnEVUXh11Pij4fCL1iL6+4RNS0mZl6EDPNkuufTTD5rXEO6NwQxZi5dls3mw1w1lS4Czs2PxGqTwNnOnEX3Z1eSemav+GwW+Nz4pbh+bwbr9GP9gHBG1IXmoJqNUreXTQNm1L5gqt+lUAD3OnA7MijtVF6fXw1FJAW5NEKRaonMEPHIneNXFGsKJazWjrAcMREHZ9wGjAbSOHHTADbOgtATU1jFGT/4yTlOVlmDv0ZCYg4+dhyCnp/CP/DKkUvQHxpzQ0AIkVXe349NYjEYFWrSRliC+zZqRSn6YxohaSknwa/zqBohihjwVi7vhFIqMSlACS4Mw9gIySQUfguyrYTajvONqSR6+uDHfqAfUfz9oBk2r0Cz4ZJuZMInAdhb5lnj2xu2yddTix/k1iMRid71ZEOwv9peq6miMTscjI0Wz7rU6K53sU2WUZZT1CrVBDzJHXDoH5VVVVVVV  לתאורת כבישים.", "היא בעלת נצילות גבוהה מאוד, עם אור צהוב-כתום."], "tp": "אור כתום בכבישים = נתרן."}, {"n": 110, "t": "light", "a": 2, "c": 0, "f": 0, "q": "מהו מקדם הנצילות (CU%) של תאורה כספית ישירה (מחזיר אור מתכתי) באולם צבוע לבן (גם קירות וגם תיקרה), בעל מידות: אורך 14 מ', רוחב 8 מ', מרחק ממקור האור עד לשטח עבודה 2.5 מ'?", "e": "מחשבים מקדם חדר: k = L·W/(h·(L+W)) = 112/(2.5×22) ≈ 2.0, ואז קוראים CU מהטבלה לפי מקדמי ההחזרה. צריך לבדוק בטבלה שלכם – התשובה לא אומתה.", "w": ["", "", "", ""], "o": ["56%", "59%", "61%", "66%"], "s": ["מחשבים מקדם חדר: k = (L × W)/(h × (L + W)) = 112/(2.5 × 22) ≈ 2.0.", "מקדמי החזרה לפי הצבע (לבן = גבוה).", "קוראים את CU מהטבלה של גוף התאורה. התשובה לא אומתה – לבדוק בטבלה שלכם."], "tp": "הנוסחה של מקדם החדר שימושית בכל שאלות התכנון."}, {"n": 111, "t": "light", "a": 1, "c": 1, "f": 0, "q": "מה גודלו של מקדם ההפחתה K עבור תאורה כספית ישירה, כמות אבק בינונית?", "e": "מקדמי הפחתה מקובלים: סביבה נקייה 0.8, אבק בינוני 0.7, מלוכלכת 0.6.", "w": ["סביבה נקייה.", "", "סביבה מלוכלכת.", ""], "o": ["0.8", "0.7", "0.6", "0.55"], "s": ["מקדמי הפחתה מקובלים לפי ניקיון הסביבה: נקי 0.8, אבק בינוני 0.7, מלוכלך 0.6."], "tp": "לזכור את הסולם: 0.8 / 0.7 / 0.6."}, {"n": 112, "t": "light", "a": 0, "c": 2, "f": 0, "q": "נתוני התאורה: מידות האולם 8X10 מטרים, מקדם הפחתה (K) 0.8, נצילות מתקן התאורה 58%, רמת ההארה הנדרשת 500 לוקס, שטף האור של נורה אחת 4,350 לומן. כמה נורות יש להזמין?", "e": "N = E·A/(K·η·Φ) = 500×80/(0.8×0.58×4350) ≈ 19.8, ולכן 20 נורות.", "w": ["", "", "", ""], "o": ["20 נורות.", "24 נורות.", "36 נורות.", "40 נורות."], "s": ["נוסחה: N = (E × A)/(K × η × Φ).", "A = 8 × 10 = 80 מ\"ר.", "N = 500 × 80/(0.8 × 0.58 × 4350) ≈ 19.8.", "מעגלים למעלה: 20 נורות."], "tp": "מספר נורות תמיד מעגלים כלפי מעלה."}, {"n": 113, "t": "light", "a": 1, "c": 2, "f": 0, "q": "בחישוב רמת ההארה בנקודה שנמצאת בין 2 עמודי התאורה יש לעשות:", "e": "הארה ממקורות שונים מצטברת, ולכן מחברים את ההארה מכל פנס.", "w": ["ממוצע מקטין את התוצאה.", "", "שגוי.", "שגוי."], "o": ["לחשב את רמת ההארה מכל פנס בנפרד ולחשב ערך ממוצע.", "לחשב את רמת ההארה מכל פנס בנפרד ולחבר ביניהם.", "לחשב את רמת ההארה מכל פנס בנפרד לחלק הכפלה בסכום (כמו נגדים במקביל).", "לחשב את רמת ההארה מכל פנס בנפרד ולהכפיל זה בזה."], "s": ["הארה ממקורות שונים מצטברת.", "מחשבים את ההארה מכל פנס בנפרד (E = I × cosα/r²).", "מחברים את התוצאות."], "tp": "ממוצע זו טעות נפוצה – התאורה מתחברת."}, {"n": 114, "t": "light", "a": 1, "c": 2, "f": 0, "q": "אפקט סטרובוסקופי מתחרש בנורות מהסוג הבא:", "e": "נורת פריקה (פלואורסצנט) מהבהבת 100 פעם בשנייה, ולכן חלקים מסתובבים עלולים להיראות עומדים.", "w": ["", "", "בליבון החוט לא מספיק להתקרר, ולכן אין הבהוב משמעותי.", "כמו ליבון."], "o": ["לד.", "פלואורסצנט.", "ליבון.", "הלוגן."], "s": ["נורת פלואורסצנט (פריקה) נכבית ונדלקת 100 פעם בשנייה (פעמיים בכל מחזור של 50Hz).", "מכונה שמסתובבת באותו קצב נראית עומדת – אפקט סטרובוסקופי."], "tp": "ליבון והלוגן: החוט נשאר חם, ולכן אין הבהוב."}, {"n": 115, "t": "dwell", "a": 0, "c": 0, "f": 0, "q": "מספר בתי תקע מינימלי שיש להתקין בכל חדר במתקן ביתי הוא:", "e": "התקנות מחייבות מספר מזערי של בתי תקע בחדר. התשובה המקובלת היא שניים לפחות. כדאי לוודא מול התקנות.", "w": ["", "", "", ""], "o": ["שני בתי תקע לפחות.", "בית תקע אחד לפחות.", "שלושה בתי תקע לפחות.", "אין תקנה המחייבת במספר מינימלי של בתי תקע במתקן ביתי."], "s": ["התקנות קובעות מספר מזערי של בתי תקע בחדר.", "התשובה המקובלת: שניים לפחות. לוודא מול התקנות."], "tp": "\"אין תקנה\" כמעט תמיד מלכודת."}, {"n": 116, "t": "light", "a": 1, "c": 2, "f": 0, "q": "נצילות אורית היא:", "e": "נצילות אורית = לומן לוואט (lm/W).", "w": ["זו עוצמת אור (קנדלה).", "", "זו עוצמת הארה (לוקס).", "שגוי."], "o": ["שטף האור שמקרין מקור אור ביחס לזווית מרחבית.", "יחס בין שטף האור להספק חשמלי.", "שטף האור ליחידת שטח.", "יחס בין שטף האור לעוצמת הארה."], "s": ["נצילות אורית = שטף אור (לומן) חלקי הספק חשמלי (ואט).", "היחידה: lm/W."], "tp": "lm/W = כמה אור מקבלים על כל ואט."}, {"n": 117, "t": "light", "a": 0, "c": 0, "f": 0, "q": "מה תפקידו של משנק?", "e": "משנק (סליל) מגביל את הזרם בנורת פריקה ובכך מגן עליה. בנוסף, יחד עם המצת, הוא יוצר פולס מתח להדלקה. בחומרי ההכנה מסמנים בדרך כלל \"מגן על הנורה\". כדאי לשאול את המורה.", "w": ["", "אין המרה.", "אין המרה.", "גם זה תפקיד שלו – לכן כדאי לשאול את המורה."], "o": ["מגן על הנורה.", "ממיר זרם ישר לזרם חילופין.", "ממיר זרם חילופין לזרם ישר.", "לעלות מתח לנורה לצורך הדלקתה."], "s": ["משנק הוא סליל בטור לנורת פריקה.", "הוא מגביל את הזרם בנורה ובכך מגן עליה.", "בנוסף, יחד עם המצת, הוא יוצר פולס מתח להדלקה.", "בחומרי ההכנה מסמנים בדרך כלל \"מגן על הנורה\" – לשאול את המורה."], "tp": "משנק לא ממיר AC ל-DC."}, {"n": 118, "t": "light", "a": 1, "c": 2, "f": 0, "q": "איזה נורה בעלת אורך חיים הכי ארוכים מבין המפורטים:", "e": "לנורת LED אורך חיים של עשרות אלפי שעות – הרבה יותר מהאחרות.", "w": ["", "", "", ""], "o": ["פלורסנט.", "לד.", "להט.", "הלוגן."], "s": ["אורך חיים: להט ~1,000 שעות, הלוגן ~2,000, פלואורסצנט ~10,000, לד 25,000–50,000.", "לכן: לד."], "tp": "לד = הכי חסכוני והכי עמיד."}, {"n": 119, "t": "light", "a": 1, "c": 2, "f": 0, "q": "למה מתייחס המושג \"אור קר\"?", "e": "אור קר הוא אור לבן-כחלחל, בטמפרטורת צבע גבוהה (5000K ומעלה).", "w": ["", "", "", "זה אור חם."], "o": ["אור אולטרה-סגול.", "אור לבן בעל גוון כחלחל.", "אור אינפרה-אדום.", "אור לבן בעל גוון צהבהב."], "s": ["\"קר\" ו\"חם\" מתארים את גוון האור הלבן.", "אור קר = לבן-כחלחל (טמפרטורת צבע גבוהה, 5000K ומעלה).", "אור חם = לבן-צהבהב (בערך 3000K)."], "tp": "טמפרטורת צבע גבוהה = אור \"קר\". זה הפוך ממה שנשמע."}, {"n": 120, "t": "light", "a": 0, "c": 2, "f": 0, "q": "נתונים גופי התאורה: ליבון 100W, 1400 לומן ; הלוגן 300W, 6000 לומן ; נתרן לחץ גבוה 150W, 19500 לומן. איזה מגופי תאורה נצילות גבוהה יותר?", "e": "נתרן: 130 lm/W ; הלוגן: 20 lm/W ; ליבון: 14 lm/W.", "w": ["", "", "", ""], "o": ["נורת נתרן לחץ גבוה.", "נורת הלוגן.", "נורת ליבון.", "לכל הנורות הנתונות אותה נצילות אורית."], "s": ["מחשבים לומן לוואט לכל נורה: ליבון 1400/100 = 14. הלוגן 6000/300 = 20. נתרן 19500/150 = 130.", "הגבוהה ביותר: נתרן."], "tp": "מחלקים לומן בוואט לכל אחת ומשווים."}, {"n": 121, "t" ": "light", "a": 2, "c": 2, "f": 0, "q": "מהי נצילות אורית?", "e": "נצילות אורית = שטף אור (לומן) חלקי ההספק החשמלי המושקע (ואט).", "w": ["הספק \"מופק\" – שגוי.", "זו נצילות כללית.", "", "הפוך."], "o": ["היחס בין כמות האור הנפלטת מהנורה בשנייה אחת להספק החשמלי המופק ממנה.", "היחס בין ההספק המופק בנורה לעוצמת ההספק המושקע בה.", "היחס בין כמות האור הנפלטת מהנורה בשנייה אחת להספק החשמלי המושקע בה.", "היחס בין ההספק החשמלי המושקע בנורה לכמות האור הנפלטת ממנה."], "s": ["נצילות אורית = שטף אור (לומן, כלומר אור בשנייה) חלקי ההספק החשמלי המושקע.", "המילה החשובה כאן: \"מושקע\" ולא \"מופק\"."], "tp": "יחס אור/הספק, ולא הפוך."}, {"n": 123, "t": "light", "a": 1, "c": 2, "f": 0, "q": "מהו אפקט הסטרובוסקופ?", "e": "הבהוב של 100Hz בנורות פריקה עלול להסתנכרן עם סיבוב של מכונה, והחלק המסתובב נראה עומד – סכנה בעבודה.", "w": ["", "", "", ""], "o": ["השפעת החימום על אורך החיים של נורה בתאורת ליבון.", "תופעה בהארת פלואורסנט הגורמת לגופים מסתובבים להיראות כאילו אינם זזים.", "אפקט הגורם לנורות לד להבהב לאחר כיבוי המתג.", "תהליך יוניזציה היוצר אפקט תאורה בנורות פריקה בגז."], "s": ["נורות פריקה מהבהבות 100 פעם בשנייה.", "כשזה מסתנכרן עם סיבוב של מכונה, החלק המסתובב נראה עומד או זז לאט.", "זו סכנה בעבודה עם מכונות."], "tp": "פתרון בפועל: לחלק את הנורות בין 3 פאזות."}, {"n": 124, "t": "light", "a": 0, "c": 2, "f": 0, "q": "מהו התשלום החודשי שנשלם עבור הארת ספרייה שמידותיה (9X8) מ\"ר בעוצמה של 500 לוקס? נתונים: נצילות המתקן היא 68% ומקדם הפחתה 0.704. התאורה תיעשה באמצעות נורות פלורסנט שכל אחת מהן היא בעלת הספק של 105 וואט ושטף אורי של 9400 לומן. הספרייה פעילה 150 שעות חודשיות ותעריף החשמל 0.65 ₪/kWh.", "e": "N = 500×72/(0.68×0.704×9400) = 8 נורות. אנרגיה: 8×105×150 = 126kWh. עלות: 126×0.65 = 81.90 ₪.", "w": ["", "", "", ""], "o": ["81.90 ₪", "250 ₪", "132 ₪", "524 ₪"], "s": ["N = 500 × 72/(0.68 × 0.704 × 9400) = 8 נורות.", "הספק כולל: 8 × 105 = 840W.", "אנרגיה בחודש: 0.84 × 150 = 126 kWh.", "עלות: 126 × 0.65 = 81.90 ₪."], "tp": "שרשרת: נורות ← הספק ← קוט\"ש ← כסף."}, {"n": 125, "t": "light", "a": 2, "c": 1, "f": 1, "q": "כמה נורות יש להתקין לשם הארת בית מלאכה ששטחו 120 מ\"ר? רמת ההארה הנדרשת היא 500lx, נצילות המתקן היא 71% ומקדם ההפחתה הוא 0.8. הנורות המוצעות הן פלורסנט 13W או נורות לד 11W (לפי הטבלה: פלורסנט 13W = 710 לומן, לד 11W = 1340 לומן).", "e": "Φ נדרש = 500×120/(0.71×0.8) ≈ 105,600 לומן. פלורסנט: 105600/710 ≈ 149. לד: 105600/1340 ≈ 79.", "w": ["", "", "", ""], "o": ["כ-50 נורות פלורסנט או 20 נורות לד.", "כ-100 נורות פלורסנט או 60 נורות לד.", "כ-150 נורות פלורסנט או 80 נורות לד.", "200 נורות פלורסנט או 120 נורות לד."], "s": ["שטף נדרש: Φ = (E × A)/(η × K) = 500 × 120/(0.71 × 0.8) ≈ 105,600 לומן.", "מהטבלה: פלורסנט 13W = 710 לומן → 105600/710 ≈ 149.", "לד 11W = 1340 לומן → 105600/1340 ≈ 79.", "לכן: כ-150 פלורסנט או כ-80 לד."], "tp": "מוצאים בטבלה את השורה לפי ההספק של הנורה שנתון בשאלה.", "img": "data:image/webp;base64,UklGRso+AABXRUJQVlA4IL4+AABQJgGdASq8AtsBPt1orVIopaSio5Ja+RAbiWlu/Hh5FgAHZ13/pp/XfyQ8zH6N/dP7l+13979Ifxn5x+//3T9uv718U/w//Vf1zxQ+X/wP/K/w3qb/HPsr+M/tf+N/8n+G9nv9H9qPoj8Q/7f/Gfkn8hH5T/Nf8z/c/yJ9Qf/E7VfV/9T/v/UF9cfo//Q/vf71f6D3A/dP9z/XfUf8z/tv+i/tn5AfYB/KP6n/vf8B7Gf6vwWvu3+8/cD4BP6D/iP/H/mvdR/qv/T/pv9d6j/z3/V/+7/XfAX/Pv7r/4Oy2Szv0cf8JMfWwW+iaJhJrD61NAxzZv7bDZ2P0PPlkci6KEoxYZzAaqpEPpIW0KscWs8Exou+ALBYDx6BdHz9xJ8qplzhIMRN8fudXHocz3ffUE4oTxH2RtoIFH4bif821zBMK0OpziEL5V1dduo4wAsCUVtLO92Krjkg/o9AeGDNZIReBOyiRLLlv0lxocEj3XyrqP06BH16iaWNw2ZU0fw94ktFcmfQku5LkgQUGaxTZ3+kaUfET7eVlOSOP+ETuEMoDLHOJEwzwiim3UmGUuey3SzBTmYugMi5uGohJRe+diieVYnyr4rhGVwMSHX831joIV+xD34KHJhnU8Jca+qFJZ8Muvqck28wJnCPrUJbwcBndlye0Pi6z7osr86Ol18k/tD+BsqfQkd5uji+Gng7cT6E2RaHQc4i4Ke9ShsqEdHrpiKXkFwYFdaosaiaacV7fe6Zc9Y49gJ7WO/rn0ZPlcrazKZGAoW1vPjQAb7kMjM17Q1bptx//062MXDv++jqIKZqQUD0oSlwKNoTqDf6Popj/AcIy4XYAX4GZQYrtHetxA3JcrccsCrN5o67er0uDe6+38az12/26l0SU/gNRjt6S6BqJPNMctD1x9QbTrR+kdF7n8tpvbUNCQ3j33OmOOASByelVICylBDhQGQ/HMjKsiVbJNSBsbTTTTTTTTTTQen9ZxGaNttd33gG7UzRs7nZKHRDDDDDDDDDDDDDGtv5lOSOP+EmW/mU3vE2xRkCFeB9tnV+8KCaz0BVkpxo3b47K9sKjBN9FYZTiBjptDDhmSCD6JP5CSSjxr0/QJG1LEF2TtynOi ארקה, והשוואת פוטנציאלים.", "במבנה ישן בלי הארקת יסוד אפשר לבצע זאת כשמחליפים את התשתית ומבצעים השוואת פוטנציאלים מלאה.", "התשובה מוצעת – לבדוק מול התקנות."], "tp": "גודל החיבור או השנאי לא קובעים את שיטת ההגנה."}, {"n": 133, "t": "earth", "a": 2, "c": 1, "f": 0, "q": "כאשר לא ידועה התנגדות בין מוליך ההגנה למסה כללית של אדמה (בשיטת זינה צפה), אל איזה גודל הבידוד יש לכוונן את הפעלת התרעה של משגוח?", "e": "המשגוח מתריע כשהבידוד יורד. הערך נמדד ב\"אום לכל וולט\" של מתח הרשת – 85Ω/V.", "w": ["היחידה שגויה (ואט).", "התרעה כשהבידוד יורד, לא עולה.", "", "התרעה כשהבידוד יורד."], "o": ["כאשר התנגדות הבידוד יורדת מתחת ל-85 אום לואט.", "כאשר התנגדות הבידוד עולה מעל 85 אום לואט.", "כאשר התנגדות הבידוד יורדת מתחת ל-85 אום לוולט.", "כאשר התנגדות הבידוד עולה מעל 85 אום לוולט."], "s": ["בזינה צפה המשגוח מודד את התנגדות הבידוד של הרשת לאדמה.", "התרעה כשהבידוד יורד מתחת לסף.", "הסף נמדד באום לכל וולט של מתח הרשת: 85Ω/V."], "tp": "\"יורדת\" + \"לוולט\". שתי מילים קטנות שמבדילות בין התשובות."}, {"n": 134, "t": "earth", "a": 2, "c": 1, "f": 0, "q": "ידוע שבשיטת הפרד מגן (שנאי מבדל) יש הגבלה בהפעלת צרכן אחד בלבד. האם יש גם הגבלה במתח היציאה של השנאי?", "e": "בהפרד מגן מתח המשני מוגבל ל-500V לכל היותר.", "w": ["יש הגבלה.", "הגבלה רחבה מדי.", "", "זה מתח נמוך מאוד – שיטה אחרת."], "o": ["אין הגבלה במתח היציאה בתנאי ששנאי בעל בידוד כפול.", "בשיטה זאת ניתן להזין את הצרכנים רק במתח נמוך (עד 1,000 וולט).", "מתח היציאה של שנאי מבדל מוגבל עד 500 וולט.", "מתח היציאה של שנאי מבדל מוגבל עד 50 וולט."], "s": ["הפרד מגן = שנאי מבדל שמזין צרכן אחד.", "מתח המשני מוגבל: עד 500V."], "tp": "50V זה מתח נמוך מאוד – שיטה אחרת לגמרי."}, {"n": 135, "t": "earth", "a": 1, "c": 0, "f": 0, "q": "במתקן המוזן משנאי ומוגן בעזרת \"הפרד מגן\", האם קיימת הגבלה למתח שבין מוליכי המתקן?", "e": "שאלה בניסוח לא ברור. התשובה המקובלת היא שהשנאי מוזן ממתח נמוך (עד 1,000V). כדאי לבדוק עם המורה.", "w": ["", "", "", ""], "o": ["אין הגבלה במתח הראשוני, חשוב שמתח המשני יהיה בטווח הנדרש.", "מתח הראשוני חייב להיות עד 1,000 וולט.", "מתח הראשוני חייב להיות עד 500 וולט.", "מתח הראשוני חייב להיות עד 250 וולט."], "s": ["שאלה בניסוח לא ברור.", "התשובה המקובלת: השנאי מוזן ממתח נמוך – עד 1,000V.", "לבדוק עם המורה."], "tp": "מתח נמוך = עד 1,000V. זה הגבול הכללי של כל הקורס."}, {"n": 136, "t": "wet", "a": 0, "c": 1, "f": 0, "q": "כדי לאפשר ניידות גבוהה באתר בנייה צבאי המוזן במתח נמוך מאוד, התקין חשמלאי תקעים ובתי-תקע רגילים (230V, 16A). לחשמלאי בודק הסביר זה כך שאביזרים אלה עומדים עד מתח 230 וולט, לכן בוודאי יעמדו במתח נמוך מאוד (24V בצבא). כמו כן, הם עומדים בהספק של 16X230 = 3680 ואט, לכן אין שום בעיה להפעיל מכשירים של 24 וולט בהספק קטן יותר. הבודק לא אישר. למה?", "e": "התקנות מחייבות שתקעים ובתי תקע של מתח נמוך מאוד לא יתאימו לבתי תקע של מתח רגיל, כדי למנוע חיבור בטעות של ציוד 24V ל-230V או להפך.", "w": ["", "לא הסיבה.", "נכון חשבונית, אבל הסיבה העקרונית היא אי-התאמת התקעים.", "שגוי."], "o": ["כי במתח נמוך מאוד חייבים להתקין תקעים ובתי-תקעים מיוחדים (כדי לא לחבר בטעות למתח גבוהה).", "כי מתח בדיקה של ציוד העובד במתח נמוך מאוד חייב להיות 250V לפחות.", "כי במתח 24V מכשיר נייד של 600 ואט צורך זרם של 25 אמפר, ובית-תקע רגיל מיועד לזרם עד 16 אמפר.", "חשמלאי בודק לא רצה לחשוב בהיגיון ומנע את ניידות באתר."], "s": ["הסיבה העקרונית בתקנות: תקעים ובתי תקע של מתח נמוך מאוד חייבים להיות שונים מאלה של 230V.", "ככה אי אפשר לחבר בטעות ציוד של 24V לשקע של 230V או להפך.", "גם החשבון של הזרם נכון (600W/24V = 25A), אבל זו לא הסיבה המרכזית."], "tp": "מתח נמוך מאוד = שקעים מיוחדים שלא מתאימים לשקע רגיל."}, {"n": 137, "t": "earth", "a": 3, "c": 0, "f": 0, "q": "מהן המידות המזעריות של אלקטרודת הארקה עשויה פלדה מגולוונת בצורת לוח?", "e": "לפי התקנות לאלקטרודות הארקה, ללוח פלדה מגולוונת יש שטח ועובי מזעריים. התשובה המקובלת: 1 מ\"ר ו-3 מ\"מ. כדאי לוודא מול התקנות.", "w": ["", "", "", ""], "o": ["שטח 0.5 מ\"ר לפחות בעובי 1.5 מ\"מ לפחות.", "שטח 0.5 מ\"ר לפחות בעובי 3 מ\"מ לפחות.", "שטח 1 מ\"ר לפחות בעובי 1.5 מ\"מ לפחות.", "שטח 1 מ\"ר לפחות בעובי 3 מ\"מ לפחות."], "s": ["לאלקטרודת לוח יש מידות מזעריות בתקנות.", "התשובה המקובלת: שטח 1 מ\"ר ועובי 3 מ\"מ. לוודא מול התקנות."], "tp": "לזכור את הזוג 1 מ\"ר / 3 מ\"מ."}, {"n": 138, "t": "earth", "a": 0, "c": 2, "f": 0, "q": "מהי מטרתה של הארקת שיטה?", "e": "הארקת השיטה (נקודת הכוכב של השנאי) מייצבת את מתח הפאזות ביחס לאדמה ומאפשרת להגנות לפעול בתקלה.", "w": ["", "זה תפקיד הארקת ההגנה.", "לא המטרה.", "שגוי."], "o": ["לייצב מתח השיטה לאדמה ולהפעיל את הגנת השיטה בזמן התקלה.", "להגן אל האדם מפני חישמול.", "להאריק את השנאי של חברת החשמל (כי כל גוף המתכתי חייב להיות מאורק).", "גורם מיותר שמביא לחישמול האדם ע\"י סגירת המעגל דרך האדמה."], "s": ["הארקת שיטה = חיבור נקודת הכוכב של השנאי לאדמה.", "היא מייצבת את מתח הפאזות ביחס לאדמה.", "היא מאפשרת זרם תקלה, וכך ההגנות פועלות."], "tp": "הארקת שיטה = שנאי. הארקת הגנה = גופי הצרכנים."}, {"n": 139, "t": "earth", "a": 1, "c": 0, "f": 0, "q": "התנגדות החשמלית בין האלקטרודה המקומית המיועדת להארקה הגנה לבין המסה הכללית של האדמה לא תעלה על (נמדדת באמצעות T.L):", "e": "יש בתקנות ערך מרבי להתנגדות אלקטרודה מקומית. התשובה המקובלת היא 5Ω, אבל יש ספרות שמציינת ערך אחר (ראו גם שאלה 11). כדאי לבדוק עם המורה.", "w": ["", "", "", ""], "o": ["3Ω", "5Ω", "10Ω", "20Ω"], "s": ["יש בתקנות ערך מרבי להתנגדות אלקטרודה מקומית להארקת הגנה.", "התשובה המקובלת: 5Ω. יש ספרות שמציינת ערך אחר (ראו שאלה 11) – לבדוק עם המורה."], "tp": "אותה שאלה מופיעה שוב ב-142 – כדאי לענות אותו דבר בשתיהן."}, {"n": 140, "t": "earth", "a": 1, "c": 2, "f": 0, "q": "הארקת שיטה תפקידה:", "e": "הארקת השיטה מצמידה את נקודת הכוכב של השנאי לפוטנציאל האדמה (אפס).", "w": ["זה תפקיד הארקת ההגנה.", "", "לא התפקיד.", "לא התפקיד."], "o": ["להגן עלינו בפני התחשמלות.", "לאלץ פוטנציאל אפס בנקודת הכוכב.", "לאזן בין הזרמים ברשת.", "להגן מפני שריפה."], "s": ["הארקת שיטה מחברת את נקודת הכוכב של השנאי לאדמה.", "כך הפוטנציאל של נקודת הכוכב נשאר אפס."], "tp": "להגן מפני התחשמלות = הארקת הגנה. לאלץ אפס בכוכב = הארקת שיטה."}, {"n": 141, "t": "earth", "a": 1, "c": 2, "f": 0, "q": "איזה מהשיטות נגד התחשמלות פועלות על עקרון מניעת סגירת לולאת התקלה דרך גוף האדם?", "e": "בזינה צפה ובשנאי מבדל אין חיבור לאדמה, ולכן נגיעה במופע אחד לא סוגרת מעגל דרך הגוף.", "w": ["פחת מנתק אחרי שהלולאה נסגרה.", "", "לא העיקרון.", "שיטות שמנתקות אחרי תקלה."], "o": ["שנאי מבדל, ממסר פחת.", "זינה צפה, שנאי מבדל.", "הארקת יסוד, בידוד כפול.", "הארקת הגנה, הארקת איפוס."], "s": ["כדי שיעבור זרם בגוף צריך מעגל סגור דרך האדמה.", "בזינה צפה ובשנאי מבדל אין חיבור של המקור לאדמה.", "לכן נגיעה במופע אחד לא סוגרת מעגל דרך הגוף."], "tp": "פחת והארקות לא מונעים מעגל – הם מנתקים אחרי שנוצר."}, {"n": 142, "t": "earth", "a": 1, "c": 0, "f": 0, "q": "התנגדות החשמלית בין האלקטרודה המקומית המיועדת להארקה הגנה לבין המסה הכללית של האדמה לא תעלה על ערך של:", "e": "אותה שאלה כמו 139. התשובה המקובלת היא 5Ω. כדאי לבדוק עם המורה.", "w": ["", "", "", ""], "o": ["3Ω", "5Ω", "10Ω", "15Ω"], "s": ["אותה שאלה כמו 139.", "התשובה המקובלת: 5Ω. לבדוק עם המורה."], "tp": "כשאותה שאלה חוזרת עם אפשרויות קצת שונות – הערך הנכון זהה."}, {"n": 143, "t": "shock", "a": 2, "c": 0, "f": 0, "q": "עוצמת הזרם שלא גורמת לשינוי פיזיקלי בגוף האדם (בכלל):", "e": "זרמים קטנים (מתחת לכמה mA) בדרך כלל לא גורמים נזק. סף התחושה ≈ 0.5mA, ומעל ≈ 10mA מתחילה התכווצות שרירים. התשובה המקובלת: מתחת ל-5mA. כדאי לבדוק עם המורה.", "w": ["30mA כבר מסוכן.", "מעל 10mA זה כבר מסוכן.", "", "ייתכן שזו כוונת המאגר – כדאי לבדוק."], "o": ["עד 30mA.", "מעל 10mA.", "מתחת ל-5mA.", "אין עוצמת זרם שלא גורמת לשינוי פיזיקלי בגוף האדם."], "s": ["סף התחושה בערך 0.5mA.", "מעל כ-10mA השרירים מתכווצים וקשה לשחרר.", "30mA זה הגבול של פחת להגנה על אדם.", "התשובה המקובלת: מתחת ל-5mA. לבדוק עם המורה."], "tp": "30mA זה כבר מסוכן – לכן פחת מנתק בו."}, {"n": 144, "t": "earth", "a": 2, "c": 2, "f": 0, "q": "תפקידה של הארקת איפוס:", "e": "באיפוס זרם התקלה חוזר במוליך מתכתי (PEN/PE) ולא דרך האדמה. העכבה נמוכה, ולכן זרם התקלה גדול והמבטח מנתק מהר.", "w": ["", "לא תפקיד האיפוס.", "", "ההפך."], "o": ["להגן על המכשירים בפני שריפה.", "לגרום לממסר פחת לקפוץ בזרם של 30mA.", "להקטין את עכבת לולאת התקלה.", "להגדיל את העכבה של לולאת התקלה."], "s": ["באיפוס זרם התקלה חוזר במוליך מתכתי (PE/PEN) ולא דרך האדמה.", "לכן עכבת הלולאה נמוכה.", "עכבה נמוכה = זרם תקלה גדול = המבטח מנתק מהר."], "tp": "איפוס = עכבה נמוכה = זרם גדול = ניתוק מהיר."}, {"n": 145, "t": "earth", "a": 1, "c": 2, "f": 0, "q": "הארקת איפוס:", "e": "עכבת לולאה נמוכה = זרם קצר חד-פאזי (פאזה-גוף) גדול, ולכן ניתוק מהיר.", "w": ["", "", "", "הזרם חוזר במוליך, לא דרך האדמה."], "o": ["מקטינה את זרם הקצר החד-פאזי במעגל.", "מגדילה את זרם הקצר החד-פאזי במעגל.", "לא גורמת לשינוי בזרם הקצר החד-פאזי במעגל.", "מגדילה את זרם הקצר בין הפאזה הפגועה לאדמה."], "s": ["עכבת לולאה נמוכה (כמו בשאלה 144).", "זרם הקצר החד-פאזי (פאזה-גוף) גדל.", "לכן המבטח מנתק מהר."], "tp": "אותו רעיון כמו 144 בניסוח אחר."}, {"n": 146, "t": "earth", "a": 0, "c": 2, "f": 0, "q": "בשיטת הגנה הפרד מגן משתמשים ב:", "e": "הפרד מגן מבוסס על שנאי מבדל (יחס 1:1 בדרך כלל) עם בידוד מוגבר בין הליפופים.", "w": ["", "", "", ""], "o": ["שנאי מבדל.", "שנאי מעלה מתח.", "שנאי מוריד מתח.", "אין קשר לשנאי."], "s": ["הפרד מגן מבוסס על שנאי מבדל: בדרך כלל יחס 1:1, עם בידוד מוגבר בין הליפופים."], "tp": "מבדל = מפריד, לא מעלה ולא מוריד מתח."}, {"n": 147, "t": "earth", "a": 1, "c": 2, "f": 0, "q": "מה תפקיד המשגוח בשיטת ההגנה \"זינה צפה\"?", "e": "בזינה צפה תקלה ראשונה לא מסוכנת, ולכן המשגוח רק מתריע כדי שיתקנו לפני תקלה שנייה. אין ניתוק – רציפות האספקה היא היתרון של השיטה.", "w": ["לא מנתק.", "", "", ""], "o": ["לנתק את הצרכן במקרה של שהתנגדות הבידוד נפגמת.", "להתריע במקרה שהתנגדות הבידוד נפגמת.", "להפעיל מערכת אלטרנטיבית במקרה של תקלה.", "לחבר את המכשיר התקול להארקה."], "s": ["בזינה צפה תקלה ראשונה לא מסוכנת, כי אין מעגל סגור.", "המשגוח מתריע כדי לתקן לפני שתקרה תקלה שנייה.", "הוא לא מנתק – רציפות האספקה היא היתרון של השיטה."], "tp": "משגוח = התרעה, לא ניתוק."}, {"n": 148, "t": "earth", "a": 1, "c": 1, "f": 0, "q": "מה משמעות האותיות IT בשיטת ההגנה המסומנת בהן?", "e": "I = המקור מבודד מהאדמה (אין הארקת שיטה). T = גופי הצרכנים מוארקים, ומחוברים יחד (השוואת פוטנציאלים).", "w": ["I = אין הארקת שיטה.", "", "הגופים כן מחוברים ומוארקים.", "I = אין הארקת   $('#chg').onclick=e=>{e.preventDefault();delete S.cls;save();clsView()}}
 const tm=setTimeout(()=>{if($('#lb').textContent==='טוען…')$('#lb').textContent='הנתונים עוד לא זמינים – נסה שוב בעוד רגע.'},10000);
 try{const d=await classData();clearTimeout(tm);const w=wk();
  const rows=d.rows.filter(r=>r.wk===w&&r.wt>0).sort((a,b)=>b.wt-a.wt);
  $('#lb').innerHTML=rows.length?`<table><tbody>${rows.map((r,i)=>`<tr${r.me?' style="font-weight:700"':''}><td>${i+1}.</td><td>${esc(r.name||'חבר לכיתה')}${r.me?' (אתה)':''}</td><td style="text-align:left;white-space:nowrap">${r.wt} שאלות · ${Math.round(r.wr/r.wt*100)}%</td></tr>`).join('')}</tbody></table>`:'עוד אין תוצאות השבוע. סיים תרגול כדי להופיע כאן.';
  const agg={};d.rows.forEach(r=>Object.entries(r.topics||{}).forEach(([t,a])=>{const x=agg[t]||[0,0];x[0]+=+a[0];x[1]+=+a[1];agg[t]=x}));
  const tl=Object.entries(agg).filter(([t,a])=>a[0]>=5&&TN[t]).map(([t,a])=>[t,a[1]/a[0]]).sort((a,b)=>a[1]-b[1]).slice(0,5);
  $('#wk2').innerHTML=tl.length?tl.map(([t,m])=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${TN[t]}</span><span style="color:${col(m)}">${Math.round(m*100)}%</span></div><div class="meter"><i style="width:${m*100}%;background:${col(m)}"></i></div></div>`).join(''):'צריך עוד קצת תרגול של הכיתה כדי לחשב.';
  const byCode={};d.ch.forEach(x=>(byCode[x.code]=byCode[x.code]||[]).push(x));
  const mine=Object.keys(byCode).filter(k=>byCode[k].some(x=>x.me)).slice(0,5);
  if(mine.length){const box=$('#chb');box.innerHTML='<h3>האתגרים שלך</h3>';mine.forEach(k=>{const p=document.createElement('p');p.textContent=k+': '+byCode[k].sort((a,b)=>b.r-a.r).map(x=>(x.name||'חבר')+' '+x.r+'/'+x.tot).join(' · ');box.appendChild(p)})}
 }catch(e){clearTimeout(tm);$('#lb').textContent='לא הצלחתי לטעון את נתוני הכיתה. בדוק חיבור לאינטרנט.';$('#wk2').textContent=''}
}
function report(){const tl=SUBJ.flatMap(s=>s.t.map(([id])=>id)).filter(t=>topicQs(t).length);const seen=Object.keys(S.p).length;
 const h=S.hist.slice(-10);return `דוח התקדמות${S.name?' – '+S.name:''} (${new Date().toLocaleDateString('he-IL')})\nשאלות שתרגלתי: ${seen} מתוך ${Q.length}\nמוכנות במתקני חשמל: ${Math.round(mastery(Q.map(q=>q.n))*100)}%\n`+
 tl.map(t=>`• ${TN[t]}: ${Math.round(mastery(topicQs(t))*100)}%`).join('\n')+(h.length?`\nתרגולים אחרונים: ${h.map(x=>Math.round(x.r/x.tot*100)+'%').join(', ')}`:'')}
if(S.sess&&!location.hash)location.hash='#quiz';
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('qimg'))e.target.classList.toggle('z')});
route();
}
