<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>תרגול חשמלאי מוסמך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: מעשי, ברור, כמו מדריך בשטח – בלי קישוטים
   IDEA: לוח חשמל – כל נושא הוא "מאמ"ת" בשורת DIN, הידית מראה כמה אתה שולט בו
   PICTURE: לוח הנושאים עם ידיות צבעוניות; מסך שאלה נקי בעמודה אחת
   COLOUR and TYPE: לוח בהיר, מכסה כהה, צבעי מוליכים (חום/כחול/ירוק-צהוב) כמבטא; Rubik לכותרות, Assistant לטקסט
   LAYOUT: עמודה אחת עד 900px, ניווט תחתון במובייל, כרטיסים מלאי רוחב */
:root{color-scheme:light dark;
--bg:light-dark(#eef0ee,#121516);--panel:light-dark(#ffffff,#1b2022);--ink:light-dark(#151a1c,#e9edee);--mute:light-dark(#5c676b,#9aa6aa);
--line:light-dark(#d5dad8,#2c3437);--cover:light-dark(#1f2a2e,#0b0f10);--brown:#8a5a2b;--blue:light-dark(#1f5fbf,#6ea2ff);
--ok:light-dark(#2e7d32,#6fcf75);--warn:light-dark(#b26a00,#f0b45a);--bad:light-dark(#c62828,#ff7b72);--accent:light-dark(#1f5fbf,#6ea2ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Assistant,"Segoe UI",Arial,sans-serif;overflow-x:clip;padding-bottom:84px}
a{color:inherit}
h1,h2,h3{font-family:Rubik,Assistant,"Segoe UI",Arial,sans-serif;font-weight:700;line-height:1.15;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(26px,5vw,36px)}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:8px 16px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pri{background:var(--cover);color:#fff;border-color:var(--cover)}
:root[data-theme=dark] .pri{background:#e9edee;color:#121516}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pri{background:#e9edee;color:#121516}}
input,select,textarea{font-size:16px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
.top{background:var(--cover);color:#fff;padding:14px max(4vw,16px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-family:Rubik;font-size:19px}.top .sp{flex:1}
.wire{height:6px;background:linear-gradient(90deg,var(--brown) 0 33%,#222 33% 66%,#888 66%)}
main{max-width:900px;margin:0 auto;padding:18px max(4vw,14px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:600px){.grid3{grid-template-columns:minmax(0,1fr)}}
.mut{color:var(--mute);font-size:15px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.big{font-family:Rubik,Assistant,Arial,sans-serif;font-size:34px;font-weight:700;line-height:1}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav a{flex:1;text-align:center;color:var(--mute);text-decoration:none;font-size:13px;padding:4px;border-radius:8px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.nav a.on{color:var(--ink);font-weight:700}.nav a span{font-size:20px;line-height:1}
/* לוח מאמ"תים */
.board{background:light-dark(#dfe3e1,#0f1314);border-radius:14px;padding:10px;border:1px solid var(--line)}
.subj{margin:10px 4px 6px;font-family:Rubik;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:8px;background:repeating-linear-gradient(90deg,#9aa3a6 0 2px,transparent 2px 10px) 0 50%/100% 6px no-repeat}
.mcb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.mcb .lev{width:22px;height:34px;border-radius:5px;border:2px solid var(--line);position:relative;background:var(--bg)}
.mcb .lev i{position:absolute;inset-inline:2px;height:14px;border-radius:3px}
.mcb .nm{font-weight:700;font-size:15px;line-height:1.25}.mcb.off{opacity:.55}
.mcb.sel{outline:3px solid var(--accent)}
/* שאלה */
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:400;line-height:1.45}
.opt b{font-family:Rubik;margin-inline-end:8px}
.opt.pick{border-color:var(--accent);background:light-dark(#e8f0fd,#1a2840)}
.opt.ok{border-color:var(--ok);background:light-dark(#e9f6ea,#16301a)}.opt.no{border-color:var(--bad);background:light-dark(#fdecea,#3a1a19)}
.qimg{width:100%;max-width:820px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.conf0{color:var(--warn)}.conf1{color:var(--mute)}
.res{border-inline-start:4px solid var(--line);padding-inline-start:12px;margin:14px 0}
.res.ok{border-color:var(--ok)}.res.no{border-color:var(--bad)}
.sol{margin-top:10px;border-radius:10px;padding:10px 12px;background:var(--bg)}
.why{background:light-dark(#fdecea,#3a1a19);color:var(--bad);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.steps{margin:8px 0;padding-inline-start:22px;line-height:1.7}.steps li{margin:4px 0}
.tip{background:light-dark(#fff4e0,#33270f);border-radius:8px;padding:8px 10px;margin-top:6px}
.fb{font-family:Rubik,Assistant,Arial,sans-serif;font-size:20px;font-weight:700;margin:8px 0 0}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:600px){.calc{grid-template-columns:minmax(0,1fr)}}
.out{background:var(--bg);border-radius:10px;padding:14px;text-align:center}
label{display:block;font-size:14px;color:var(--mute);margin:6px 0 2px}
.timer{font-family:Rubik;font-variant-numeric:tabular-nums;white-space:nowrap}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:start;font-size:15px}
.hide{display:none!important}
.toast{position:fixed;bottom:90px;inset-inline:16px;max-width:420px;margin:auto;background:var(--cover);color:#fff;padding:10px 14px;border-radius:10px;z-index:9}
@media (prefers-reduced-motion:no-preference){.mcb .lev i{transition:top .4s}}
</style>
</head>

], "tp": "לעכבת לולאה יש רק ערך מרבי: מחשבים U0/(k·In) ובודקים שהנמדד קטן ממנו."}, {"n": 3, "t": "ocp", "a": 3, "c": 1, "f": 0, "q": "עומס כולל של 10 קילוואט הופעל בדירת מגורים סטנדרטית (מתח הזנה חד-מופעי 230V, מפסק ראשי C40A). איך יגיב המאמ\"ת הראשי?", "e": "I = 10000/230 ≈ 43.5A, כלומר 1.09×In. זרם אי-הפעלה מוסכם של מאמ\"ת הוא 1.13×In (לא ינתק שעה), וזרם הפעלה מוסכם 1.45×In. 1.09 קטן מ-1.13 ולכן לא ינתק.", "w": ["ניתוק מיידי הוא בתחום המגנטי (5–10×In).", "5 שניות זו דרישה לזרם תקלה, לא לעומס יתר קל.", "ניתוק תוך פחות משעה מובטח רק מ-1.45×In.", ""], "o": ["המאמ\"ת הראשי ינתק את הדירה באופן מיידי.", "המאמ\"ת הראשי ינתק את הדירה תוך 5 שניות ולא יותר (לפי דרישת החוק במקרה תקלה).", "המאמ\"ת הראשי ינתק את הדירה תוך פחות משעה (זמן התגובה של החלק התרמי).", "המאמ\"ת הראשי לא ינתק את הדירה כלל (הזרם שיזרום דרכו קטן מזרם ההפעלה)."], "s": ["מחשבים את הזרם: I = P/U = 10000/230 ≈ 43.5A.", "מחשבים פי כמה זה מהזרם הנקוב: 43.5/40 ≈ 1.09×In.", "נזכרים בזרמים המוסכמים: עד 1.13×In המאמ\"ת לא ינתק (לפחות שעה), ומ-1.45×In ינתק תוך פחות משעה.", "1.09 קטן מ-1.13, ולכן המאמ\"ת לא ינתק."], "tp": "1.13 = לא מנתק, 1.45 = מנתק תוך שעה. מגנטי מנתק רק מ-5×In (B) או 10×In (C)."}, {"n": 4, "t": "law", "a": 0, "c": 2, "f": 0, "q": "לביצוע עבודות חשמל, כולל עריכת תוכניות, במתקן בעל עוצמת זרם עד 3×80A הנמצא במבנה המשמש לדירת מגורים, משרדים או בתי מלאכה, דרוש חשמלאי בעל רישיון מינימלי של:", "e": "חשמלאי מוסמך רשאי לבצע ולתכנן עד 3×80A במבנה מגורים, משרדים או בתי מלאכה (ועד 3×40A במתקן אחר).", "w": ["", "ראשי מתאים, אבל השאלה שואלת על הרישיון המינימלי.", "מעשי מוגבל ל-3×40A.", "עוזר לא רשאי לעבוד באופן עצמאי."], "o": ["חשמלאי מוסמך.", "חשמלאי ראשי.", "חשמלאי מעשי.", "חשמלאי עוזר."], "s": ["מזהים את נתוני המתקן: עד 3×80A, במבנה מגורים / משרדים / בתי מלאכה, כולל תכנון.", "נזכרים בתחומי הרישיונות: מעשי עד 3×40A, מוסמך עד 3×80A במבנים האלה, ראשי עד 3×250A.", "השאלה מבקשת את הרישיון המינימלי – חשמלאי מוסמך."], "tp": "כשכתוב \"מינימלי\", בוחרים את הרישיון הנמוך ביותר שמכסה את המקרה, לא את הגבוה."}, {"n": 5, "t": "law", "a": 3, "c": 1, "f": 0, "q": "חשמלאי בעל רישיון בודק מסוג 1 רשאי לבצע בדיקות במתקנים בעלי עוצמת זרם עד:", "e": "בודק סוג 1 רשאי לבדוק מתקנים עד 3×100A במתח נמוך, למעט מתקן שהוא עצמו גם תכנן וגם ביצע.", "w": ["3×350A מעל תחום בודק סוג 1.", "3×80A הוא תחום אחר.", "3×250A מעל תחום בודק סוג 1.", ""], "o": ["3×350A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו.", "3×80A במתח נמוך, למעט עבודות חשמל אשר תוכננו ובוצעו על ידו.", "3×250A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו.", "3×100A במתח נמוך, למעט עבודות חשמל אשר תוכננו וגם בוצעו על ידו."], "s": ["נזכרים בסוגי רישיון בודק: בודק סוג 1 – מתקנים עד 3×100A במתח נמוך.", "שמים לב לניסוח: הוא לא בודק מתקן שהוא עצמו גם תכנן וגם ביצע.", "בוחרים את האפשרות עם 3×100A והניסוח \"תוכננו וגם בוצעו\"."], "tp": "בשאלות רישוי שמים לב גם למספר וגם לניסוח המדויק – \"וגם\" לעומת \"ו\"."}, {"n": 6, "t": "test", "a": 0, "c": 0, "f": 0, "q": "מהו שיעור ההתנגדות התקין בין מוליך מופע למוליך האפס בלוח במתקן חשמלי בבדיקה תקופתית?", "e": "בבדיקה תקופתית של מתקן קיים הדרישה מקלה יותר מאשר במתקן חדש. הערך הנפוץ בתקנות לבדיקה תקופתית הוא 0.25MΩ לפחות. כדאי לוודא מול התקנות העדכניות.", "w": ["", "ערך גבוה מהנדרש.", "ערך גבוה מהנדרש.", "ערך גבוה מהנדרש."], "o": ["0.25 מגה-אום.", "1.5 מגה-אום.", "1.25 מגה-אום.", "1.75 מגה-אום."], "s": ["מזהים שזו בדיקה תקופתית של מתקן קיים, לא מתקן חדש.", "במתקן קיים הדרישה מקלה יותר.", "התשובה המקובלת: לפחות 0.25MΩ."], "tp": "מתקן חדש לפני חיבור – 0.5MΩ. בדיקה תקופתית – 0.25MΩ. לבדוק מול התקנות שלכם."}, {"n": 7, "t": "earth", "a": 2, "c": 1, "f": 0, "q": "מה המספר המינימלי של בורגי חיבור שיותקנו בפס השוואת פוטנציאלים אם יחוברו אליו שני מוליכי חיבור, מוליך מפס הארקות ומוליך הארקת יסוד?", "e": "4 מוליכים צריכים 4 ברגים, ובנוסף התקנות דורשות 2 ברגים שמורים לחיבורים עתידיים: 4 + 2 = 6.", "w": ["אלה רק המוליכים הקיימים, בלי ברגים שמורים.", "חסר בורג שמור אחד.", "", "יותר מהמינימום."], "o": ["4", "5", "6", "7"], "s": ["סופרים את המוליכים שמתחברים: 2 מוליכי חיבור + 1 מפס הארקות + 1 מהארקת יסוד = 4.", "כל מוליך מקבל בורג נפרד.", "מוסיפים 2 ברגים שמורים לחיבורים עתידיים: 4 + 2 = 6."], "tp": "בפס השוואת פוטנציאלים: בורג לכל מוליך + 2 שמורים."}, {"n": 8, "t": "cable", "a": 1, "c": 2, "f": 0, "q": "כיצד יש לנהוג בהוספת מעגל חדש ללוח שבו כל צבעי המוליכים הם לפי התקן הישן?", "e": "עבודה חדשה מבוצעת לפי התקן החדש (חום/שחור/אפור לפאזות, כחול לאפס, צהוב-ירוק להארקה), ומסמנים שלט אזהרה שיש בלוח שני סוגי צבעים.", "w": ["אין חובה להחליף מוליכים קיימים.", "", "אסור להתקין היום לפי צבעים ישנים.", "המתקין החדש אחראי על עבודתו."], "o": ["יש להחליף את כל מוליכי הלוח למניעת טעויות בעתיד.", "יש לחבר לפי התקן החדש ולשים שלט המתריע על כך.", "יש לחבר לפי התקן הישן למניעת טעויות בעתיד.", "לא לנקוט שום פעולה, הלוח באחריות המבצע המקורי."], "s": ["עבודה חדשה מבוצעת תמיד לפי התקן הנוכחי.", "לא חייבים להחליף את כל המוליכים הישנים.", "מתקינים שלט אזהרה שבלוח יש צבעים לפי שני תקנים, כדי שהחשמלאי הבא לא יטעה."], "tp": "צבעים חדשים: חום/שחור/אפור = פאזות, כחול = אפס, צהוב-ירוק = הארקה."}, {"n": 9, "t": "cable", "a": 0, "c": 2, "f": 0, "q": "האם מותר להסתעף ממעגל שחתך מוליכיו 2.5 ממ\"ר להזנת מעגל שחתך מוליכיו 1.5 ממ\"ר?", "e": "כל ירידה בחתך מחייבת מבטח מתאים לחתך הקטן, אחרת המבטח של 2.5 ממ\"ר לא יגן על 1.5 ממ\"ר.", "w": ["", "אי אפשר לסמוך על העומס, צריך הגנה.", "הכלל זהה בבית ובתעשייה.", "אין היתר כזה."], "o": ["אסור לחלוטין. ירידה בחתך המוליך חייבת להיעשות דרך מבטח.", "מותר בתנאי שהעומס הכולל לא יגרום להעמסת יתר.", "אסור בחשמל ביתי, מותר בתעשייה כי בה העוסקים בכך הם חשמלאים.", "מותר בחשמל ביתי למעגלי תאורה בלבד, בתנאי שהזרם בהסתעפות לא יהיה מעל 10 אמפר."], "s": ["מוליך 2.5 ממ\"ר מוגן בדרך כלל ב-16A.", "מוליך 1.5 ממ\"ר מותר לכל היותר 10A.", "אם מסתעפים בלי מבטח, ה-16A לא יגן על המוליך הדק והוא עלול להתחמם.", "לכן כל ירידה בחתך חייבת מבטח מתאים לחתך הקטן."], "tp": "הכלל: ירידה בחתך = מבטח חדש בנקודת הירידה."}, {"n": 10, "t": "law", "a": 3, "c": 0, "f": 0, "q": "האם מותר לבצע עבודות חשמל במתקן חי לצורך החלפת מערכת תאורת חירום?", "e": "עבודה במתקן חי מותרת רק במקרים חריגים שבהם ניתוק אינו אפשרי או מסוכן. החלפת תאורת חירום אפשרית במעגל מנותק, ולכן אין הצדקה לעבודה במתח.", "w": ["מספר החשמלאים לא מתיר עבודה במתח.", "התנאים האלה לא חלים על המקרה הזה.", "אישור לא הופך עבודה מיותרת במתח למותרת.", ""], "o": ["מותר בתנאי שבצוות ישנם לפחות 2 חשמלאים בעלי רישיון מתאים.", "מותר בתנאי שלצוות יש ציוד מתאים ועבודה מאושרת ע\"י בעל רישיון חשמלאי-הנדסאי לפחות.", "מותר בתנאי שיש אישור מחשמלאי אחראי על המתקן ובנוכחותו.", "אסור לעבוד במתקן חי לצורך החלפת מערכת תאורת חירום."], "s": ["הכלל הבסיסי: עובדים במתקן מנותק.", "עבודה במתח מותרת רק במקרים חריגים שבהם אי אפשר לנתק או שהניתוק עצמו מסוכן.", "החלפת תאורת חירום אפשר לבצע במעגל מנותק, ולכן אין הצדקה לעבוד במתח."], "tp": "מספר חשמלאים, אישור או נוכחות לא הופכים עבודה מיותרת במתח למותרת."}, {"n": 11, "t": "earth", "a": 0, "c": 0, "f": 1, "q": "מהי עכבת מסת האדמה המרבית המותרת בשיטת ההגנה המתוארת באיור?", "e": "באיור, אפס השנאי מוארק בנפרד מהארקת המתקן – זו הארקת הגנה (TT). ברוב חומרי ההכנה הערך שמופיע הוא 20Ω. כדאי לבדוק מול התקנות ומול המורה.", "w": ["", "5Ω מתאים יותר להארקת שיטה.", "ערך לא תקני.", "ערך לא תקני לשיטה זו."], "o": ["20 אום.", "5 אום.", "2.7 אום.", "10 אום."], "s": ["מזהים את השיטה באיור: אפס השנאי מוארק בנפרד, והגופים מחוברים לאלקטרודה אחרת – הארקת הגנה (TT).", "בשיטה הזו יש ערך מרבי להתנגדות האלקטרודה.", "התשובה המקובלת בחומרי ההכנה: 20Ω. לבדוק עם המורה."], "tp": "קודם מזהים את השיטה (TT, TN, IT) ורק אחר כך את הערך שלה."}, {"n": 12, "t": "grid", "a": 1, "c": 2, "f": 1, "q": "לפניך איור סכמתי של תהליך ייצור והובלה של אנרגיה חשמלית (טורבינה ← מחולל ← ? ← רשת ארצית). מה חסר בסכמה?", "e": "אחרי המחולל מעלים את המתח (למשל ל-161kV או 400kV) כדי להקטין זרם והפסדים בהולכה ברשת הארצית.", "w": ["מורידים מתח רק קרוב לצרכנים.", "", "קבלים אינם חוליה הכרחית בשרשרת.", "ספק כוח אינו חלק מהשרשרת."], "o": ["שנאי מוריד מתח.", "שנאי מעלה מתח.", "מערכת קבלים לשיפור מקדם ההספק.", "ספק כוח."], "s": ["עוברים על השרשרת: טורבינה מסובבת מחולל, והמחולל מייצר מתח בינוני.", "כדי להוביל למרחקים מעלים מתח, וכך הזרם וההפסדים (I²R) קטנים.", "לכן אחרי המחולל ולפני הרשת הארצית בא שנאי מעלה מתח."], "tp": "ליד תחנת כוח – מעלים מתח. ליד הצרכן – מורידים."}, {"n": 13, "t": "grid", "a": 1, "c": 2, "f": 0, "q": "מהו הערך של המתח העל-עליון בישראל?", "e": "מתח על-עליון בישראל הוא 400kV. 161kV הוא מתח עליון, ו-22/33kV הם מתח גבוה (רשת חלוקה).", "w": ["זה מתח עליון.", "", "זה מתח גבוה.", "אין רשת כזו בישראל."], "o": ["161kV", "400kV", "33kV", "300kV"], "s": ["נזכרים בדרגות המתח בישראל: גבוה 22/33kV, עליון 161kV, על-עליון 400kV.", "השאלה על \"על-עליון\" – 400kV."], "tp": "161 = עליון, 400 = על-עליון. אל תתבלבל ביניהם."}, {"n": 14, "t": "wet", "a": 1, "c": 2, "f": 0, "q": "מתח נמוך מאוד הוא:", "e": "מתח נמוך מאוד (ELV) הוא עד 50V בזרם חילופין (ועד 120V בזרם ישר).", "w": ["נמוך מהגבול.", "", "זה מתח נמוך רגיל.", "זה מתח נמוך רגיל."], "o": ["10V ומטה.", "50V ומטה.", "231V ומטה.", "400V ומטה."], "s": ["מתח נמוך מאוד (ELV) מוגדר עד 50V בזרם חילופין.", "בזרם ישר – עד 120V.", "לכן \"50V ומטה\"."], "tp": "50V AC / 120V DC. בבריכה הגבול מחמיר: 12V AC / 30V DC."}, {"n": 15, "t": "grid", "a": 3, "c": 2, "f": 0, "q": "אילו תחנות כוח אינן מייצרות חשמל לשימוש משק החשמל בארץ?", "e": "בישראל אין תחנת כוח גרעינית לייצור חשמל.", "w": ["קיימות (פחם/גז).", "קיימים בהיקף גדול.", "מחזור משולב נפוץ מאוד.", ""], "o": ["תחנת כוח המבוססת על טורבינת קיטור.", "תאים סולאריים.", "תחנת כוח משולבת קיטור-גז.", "תחנת כוח גרעינית."], "s": ["עוברים על כל סוג תחנה: קיטור (פחם/גז) – קיים. סולארי – קיים. מחזור משולב – קיים.", "בישראל אין תחנת כוח גרעינית לייצור חשמל.", "לכן התשובה: גרעינית."], "tp": "שאלת ידע כללי – זוכרים שאין חשמל גרעיני בישראל."}, {"n": 16, "t": "grid", "a": 0, "c": 2, "f": 0, "q": "מהו תפקיד תחנת המשנה?", "e": "תחנת משנה מורידה מתח עליון (161kV) למתח גבוה (22/33kV) של רשת החלוקה.", "w": ["", "זה תפקיד תחנת המיתוג שליד תחנת הכוח.", "תחנת משנה לא מייצרת חשמל.", "מדידה היא לא התפקיד."], "o": ["להוריד מתח עליון ל\"מערכת החלוקה\".", "להעלות את המתח המיוצר בתחנה למתח עליון.", "לייצר חשמל לישובים קרובים.", "למדוד מתח המגיע למתקני החשמל."], "s": ["תחנת משנה נמצאת בין הרשת הארצית לרשת החלוקה.", "היא מורידה מתח עליון (161kV) למתח גבוה (22/33kV) של רשת החלוקה."], "tp": "תחנת משנה = הורדת מתח עליון לחלוקה."}, {"n": 17, "t": "grid", "a": 2, "c": 2, "f": 0, "q": "מהו היתרון של חמרן (אלומיניום) בהשוואה לנחושת בבניית קווי הלכה עיליים?", "e": "אלומיניום קל בערך פי 3 מנחושת, ולכן מתאים לקווים עיליים (עמודים קלים יותר).", "w": ["זה חיסרון.", "זה חיסרון.", "", "זה לא היתרון העיקרי."], "o": ["מוליכות נמוכה.", "חוזק מכני נמוך.", "משקל נמוך.", "גמישות גבוהה."], "s": ["משווים בין אלומיניום לנחושת: אלומיניום מוליך פחות וחלש יותר מכנית, אבל קל בהרבה.", "בקו עילי המשקל קריטי לעמודים ולמתיחה.", "לכן היתרון הוא משקל נמוך."], "tp": "אלומיניום: קל וזול. נחושת: מוליכה יותר."}, {"n": 18, "t": "grid", "a": 0, "c": 2, "f": 0, "q": "מהי המתכת בעלת המוליכות החשמלית הטובה ביותר?", "e": "הסדר: כסף > נחושת > זהב > אלומיניום.", "w": ["", "זהב פחות מוליך מנחושת.", "שנייה אחרי כסף.", "פחות מוליך מנחושת."], "o": ["כסף.", "זהב.", "נחושת.", "אלומיניום."], "s": ["סדר המוליכות מהטוב לפחות טוב: כסף, נחושת, זהב, אלומיניום.", "לכן התשובה: כסף."], "tp": "כסף הכי טוב, אבל יקר מדי לשימוש רגיל – לכן משתמשים בנחושת."}, {"n": 19, "t": "grid", "a": 3, "c": 2, "f": 0, "q": "מה אינו מיתרונות האלומיניום על הנחושת?", "e": "המוליכות של אלומיניום כ-60% מזו של נחושת. זה חיסרון ולא יתרון.", "w": ["יתרון.", "יתרון.", "שכבת התחמוצת מגינה עליו – נחשב יתרון.", ""], "o": ["משקל נמוך.", "עלות נמוכה.", "אינו מחליד.", "מוליכות חשמלית."], "s": ["מחפשים את מה שאינו יתרון.", "משקל נמוך ועלות נמוכה הם יתרונות, ושכבת התחמוצת מגינה מפני קורוזיה.", "המוליכות של אלומיניום נמוכה מזו של נחושת (כ-60%) – זה חיסרון."], "tp": "בשאלות \"מה אינו\" מסמנים כל אפשרות נכון/לא נכון, ובוחרים את היוצאת דופן."}, {"n": 20, "t": "ctrl", "a": 1, "c": 1, "f": 1, "q": "לפניך סכמת הפעלה של אוטומט חדר מדרגות באמצעות לחצנים A, B, C. בנוסף מורכב מפסק מחליף SW1 בצורה מיוחדת. מה יהיה אם נחליף את מצבו של SW1?", "e": "SW1 מחליף את הזנת נורה 1 בין יציאת האוטומט (הדק 3) לבין הפאזה L ישירות. במצב השני נורה 1 מוזנת קבוע ושאר הנורות נשארות על האוטומט.", "w": ["רק נורה 1 מושפעת מ-SW1.", "", "ההפך.", "אין קצר – המחליף בוחר מקור הזנה."], "o": ["כל הנורות ידלקו באופן קבוע.", "נורה 1 תדלק קבוע ושאר הנורות ידלקו באמצעות אוטומט חדר המדרגות.", "נורה 1 תדלק באמצעות אוטומט חדר מדרגות ושאר הנורות ידלקו קבוע.", "אסור לחבר מפסק מחליף בצורה כזאת כי כך הוא יקצר את המעגל."], "s": ["עוקבים בשרטוט: הדק 3 של האוטומט מזין את נורות 2 ו-3, ואת אחד המגעים של SW1.", "המגע השני של SW1 מחובר ישר לפאזה L, והמגע המרכזי מזין את נורה 1.", "כשמחליפים את מצב SW1, נורה 1 עוברת לקבל פאזה ישירה ודולקת קבוע.", "נורות 2 ו-3 נשארות מחוברות לאוטומט."], "tp": "במפסק מחליף בודקים מה מחובר למגע המשותף ומה לכל אחד מהמגעים."}, {"n": 21, "t": "ctrl", "a": 1, "c": 2, "f": 1, "q": "נתון מעגל פיקוד ומעגל כוח (מגענים C1, C2, מפסקי גבול LS1, LS2). מה הפעולה שמבצעת המערכת הנתונה?", "e": "במעגל הכוח C2 מחליף שתי פאזות, ולכן המנוע מסתובב לכיוון ההפוך. בפיקוד יש נעילה הדדית (C1/C2) ומפסקי גבול LS1/LS2 שעוצרים בסוף מהלך.", "w": ["יש שני לחצני START לשני כיוונים, לא ממספר מקומות.", "", "אין ממסר זמן.", "אין ממסר זמן."], "o": ["הפעלת מנוע תלת-מופעי ממספר מקומות.", "הפעלת מנוע תלת-מופעי בשני כיווני סיבוב בעזרת מפסיק גבול.", "הפעלת מנוע תלת-מופעי לזמן קצוב.", "הפעלת מנוע תלת-מופעי עם השהייה בהפעלה."], "s": ["מסתכלים על מעגל הכוח: C1 מחבר את הפאזות כרגיל, ו-C2 מחליף בין שתיים מהן – זה היפוך כיוון סיבוב.", "מעגל הפיקוד: שני לחצני START, נעילה הדדית (מגע C2 בשרשרת של C1 ולהפך).", "מפסקי גבול LS1 ו-LS2 עוצרים כל כיוון בסוף המהלך.", "לכן: מנוע בשני כיווני סיבוב עם מפסקי גבול."], "tp": "שני מגענים שאחד מהם מחליף פאזות = היפוך כיוון. ממסר זמן לא מופיע = לא קשור לזמן."}, {"n": 22, "t": "ctrl", "a": 3, "c": 1, "f": 1, "q": "כמה מוליכים יש בין הנקודות A-B בשרטוט?", "e": "בין A ל-B עוברים: 2 מוליכי \"נוסע\" בין המצלב (ב.2) למחליף (ב.3), חוזר מ-ב.3 לנורה ב', ופאזה, אפס והארקה להמשך (נורה ג' ומפסק ג.1). סה\"כ 6. אם המורה לא סופר הארקה התשובה תהיה 5.", "w": ["חסרים מוליכי הנוסע.", "חסרים מוליכים.", "נכון רק אם לא סופרים הארקה.", ""], "o": ["3", "4", "5", "6"], "s": ["מזהים את הרכיבים: נורה ב' נשלטת משלושה מקומות – ב.1 וב.3 הם מחליפים, ב.2 הוא מצלב.", "בין המצלב (ב.2) למחליף (ב.3) עוברים 2 מוליכי \"נוסע\", ומ-ב.3 חוזר מוליך מבוקר לנורה ב'.", "להמשך הקו לנורה ג' ולמפסק ג.1 צריך: פאזה, אפס והארקה.", "סה\"כ: 2 + 1 + 3 = 6."], "tp": "בספירת מוליכים עוברים רכיב-רכיב ושואלים מה כל אחד צריך שיעבור בקטע."}, {"n": 23, "t": "ocp", "a": 0, "c": 1, "f": 1, "q": "מהו סימונו של המאזי\"ר (מפסק אוטומטי זעיר) שבאיור במצב הלא-פעיל (OFF)?", "e": "סמל א מציג מפסק עם הגנה תרמית והגנה מגנטית (I>) ומגע פתוח – זה מאזי\"ר במצב OFF.", "w": ["", "זה סמל של בית תקע/מפסק.", "זה מגע של ממסר תרמי.", "זה סמל של מפסק אחר."], "o": ["סמל א (מגע עם הגנה תרמית ומגנטית I>).", "סמל ב.", "סמל ג.", "סמל ד."], "s": ["מחפשים סמל של מפסק עם הגנה תרמית והגנה מגנטית (I>).", "מגע פתוח בשרטוט = מצב OFF.", "סמל א' מתאים לזה."], "tp": "מאזי\"ר = מגע + הגנה תרמית + הגנה מגנטית (I>)."}, {"n": 24, "t": "dwell", "a": 3, "c": 1, "f": 1, "q": "לפניך מכשיר ביתי בעל נתונים נקובים: Pn = 2kW, Un = 230V. מהו החיבור הנכון להזנת המכשיר?", "e": "I = 2000/230 ≈ 8.7A. מכשיר קבוע בהספק כזה מזינים במעגל נפרד, בכבל 2.5 ממ\"ר ובמאמ\"ת 16A.", "w": ["אין לחבר מכשיר כזה עם מעגל תאורה.", "10A קרוב מדי לזרם העבודה.", "אין לחבר עם תאורה.", ""], "o": ["3×1.5 ממ\"ר, יחד עם מעגל תאורה, מאמ\"ת 10A.", "3×1.5 ממ\"ר, מעגל נפרד, מאמ\"ת 10A.", "3×2.5 ממ\"ר, יחד עם מעגל תאורה, מאמ\"ת 16A.", "3×2.5 ממ\"ר, מעגל נפרד, מאמ\"ת 16A."], "s": ["מחשבים זרם: I = 2000/230 ≈ 8.7A.", "מכשיר קבוע בהספק כזה מקבל מעגל נפרד, ולא מחברים אותו עם תאורה.", "8.7A קרוב מדי ל-10A, ולכן בוחרים 16A.", "ל-16A צריך מוליך 2.5 ממ\"ר."], "tp": "מכשיר כבד = מעגל נפרד. 16A תמיד הולך עם 2.5 ממ\"ר."}, {"n": 25, "t": "dwell", "a": 0, "c": 0, "f": 0, "q": "מהו המספר המזערי של מעגלים להזנת נקודות ובתי תקע בדירת מגורים בת 4 חדרים ומטבח?", "e": "התקנות קובעות מספר מזערי של מעגלים סופיים לתאורה ולבתי תקע לפי שטח הדירה. לדירה בת 4 חדרים ומטבח מקובל 3 מעגלים לפחות. כדאי לוודא מול טבלת התקנות.", "w": ["", "כנראה מעט מדי.", "מעט מדי.", "יש דרישה בתקנות."], "o": ["3", "2", "1", "אין הגבלה."], "s": ["התקנות קובעות מספר מזערי של מעגלים לתאורה ולבתי תקע לפי שטח הדירה.", "לדירה בת 4 חדרים ומטבח התשובה המקובלת היא 3 מעגלים.", "לוודא מול טבלת התקנות."], "tp": "בשאלות \"מספר מעגלים\" מחפשים בטבלה את הקשר בין שטח הדירה למספר המעגלים."}, {"n": 26, "t": "calc", "a": 3, "c": 2, "f": 0, "q": "ההספק הכללי שמותקן בדירת מגורים הוא 31 קילוואט. מקדם הביקוש K הוא 60%. איזה גודל חיבור יש להזמין מחברת החשמל עבור דירה זו? מקדם ההספק 1. מתח רשת חד-פאזית 230V, ותלת-פאזית 400V.", "e": "Pמחושב = 31×0.6 = 18.6kW. בחד-פאזי: 18600/230 ≈ 81A (גבוה מדי). בתלת-פאזי: 18600/(√3×400) ≈ 26.8A. זה יותר מ-25A, ולכן 3×40A.", "w": ["קטן מדי.", "81A בחד-פאזי – קטן מדי.", "26.8A גבוה מ-25A.", ""], "o": ["1×25A", "1×40A", "3×25A", "3×40A"], "s": ["מחשבים הספק מחושב: P × K = 31 × 0.6 = 18.6kW.", "בודקים חד-מופעי: I = 18600/230 ≈ 81A – גדול מ-40A, לא מתאים.", "בודקים תלת-מופעי: I = 18600/(√3×400) ≈ 26.8A.", "26.8 גדול מ-25, ולכן בוחרים 3×40A."], "tp": "קודם מכפילים במקדם הביקוש, אחר כך מחשבים זרם, ובוחרים את החיבור הסטנדרטי שמעליו."}, {"n": 27, "t": "test", "a": 1, "c": 1, "f": 0, "q": "מהי ההתנגדות המזערית של בידוד בדירת מגורים חדשה לפני החיבור של חברת החשמל?", "e": "במתקן חדש במתח נמוך התנגדות הבידוד המזערית הנדרשת היא 0.5MΩ (בבדיקה ב-500V DC).", "w": ["ערך גבוה מהדרישה.", "", "זה ערך לבדיקה תקופתית.", "נמוך מדי."], "o": ["1.5MΩ", "0.5MΩ", "0.25MΩ", "0.15MΩ"], "s": ["מזהים: דירה חדשה, לפני חיבור לחברת החשמל.", "במתקן חדש התנגדות הבידוד המזערית היא 0.5MΩ."], "tp": "חדש = 0.5MΩ, תקופתי = 0.25MΩ."}, {"n": 28, "t": "cable", "a": 2, "c": 2, "f": 0, "q": "המעגל במתקן הביתי מוגן באמצעות מבטח בעל זרם נקוב של 16 אמפר. האם מותר להסתעף ממוליך בחתך של 2.5 ממ\"ר על ידי מוליך בחתך של 1.5 ממ\"ר מבלי להתקין מבטח נוסף בעל זרם נקוב של 10 אמפר?", "e": "מבטח של 16A לא מגן על מוליך 1.5 ממ\"ר. כל ירידה בחתך מחייבת מבטח שמתאים לחתך הקטן.", "w": ["16A גבוה מדי עבור 1.5 ממ\"ר.", "העומס לא מחליף הגנה.", "", "עם מבטח מתאים זה מותר."], "o": ["אין שום בעיה להסתעפות, כי מבטח של 16A מגן על כל המוליכים בחתך עד 2.5 ממ\"ר.", "מותר, רק אם מוליך של 1.5 ממ\"ר מזין את מעגל התאורה בלבד בעומס הכולל פחות מ-10A.", "אסור לרדת בחתך המוליך ללא התקנה של מבטח מתאים בכל מקרה.", "הסתעפות של 2 מוליכים בעלי חתך שונה אסורה אפילו עם התקנת מבטחים מתאימים."], "s": ["מבטח 16A מגן על מוליך 2.5 ממ\"ר.", "מוליך 1.5 ממ\"ר מותר רק עד 10A.", "בלי מבטח 10A בנקודת ההסתעפות, המוליך הדק לא מוגן.", "לכן אסור לרדת בחתך בלי מבטח מתאים."], "tp": "אותו כלל כמו שאלה 9: כל ירידה בחתך = מבטח חדש."}, {"n": 29, "t": "earth", "a": 0, "c": 0, "f": 0, "q": "באיזה תנאי מותר להאריק את הדוד לחימום מים (בוילר) באמצעות חיבור לקונסטרוקציה של הארקת היסוד של הבניין?", "e": "מוליך הארקה מגיע מהלוח, ובנוסף מחברים את הדוד להשוואת פוטנציאלים. חיבור לברזל הבניין מותר כשיש מוט זיון בקוטר מספיק (10 מ\"מ). כדאי לוודא מול התקנות.", "w": ["", "גלוון אינו הדרישה.", "ריתוך אינו הדרישה היחידה כאן.", "ייתכן לפי פרשנות מסוימת – כדאי לבדוק עם המורה."], "o": ["בתנאי שקוטר המוט יהיה לפחות 10 מ\"מ.", "בתנאי שחלק זה של הקונסטרוקציה עשוי מברזל מגולוון (למניעת שיתוך בחיבור).", "בתנאי שכל החיבורים נעשו באמצעות ריתוך בלבד, כפי שנדרש בבניית הארקת יסוד.", "אסור בכל מקרה. מוליך הארקה לדוד חייב להגיע רק מלוח ההזנה שלו."], "s": ["מוליך הארקה לדוד מגיע מהלוח.", "בנוסף מחברים את הדוד להשוואת פוטנציאלים.", "חיבור לברזל הבניין מותר כשהמוט בקוטר מספיק (10 מ\"מ לפחות).", "התשובה מוצעת – לבדוק מול התקנות."], "tp": "שאלה עם תנאי טכני – מחפשים מספר שמופיע בתקנה (קוטר או חתך)."}, {"n": 30, "t": "dwell", "a": 2, "c": 0, "f": 0, "q": "מהו המספר המזערי של נקודות המאור ושל בתי התקע בחדר מגורים בעל שטח רצפה של 52 מ\"ר?", "e": "בחדר גדול התקנות מחייבות יותר נקודות לפי השטח. לחדר של 52 מ\"ר מקובל: 2 נקודות מאור ו-4 בתי תקע לפחות. כדאי לוודא מול טבלת התקנות.", "w": ["מעט מדי לחדר גדול.", "מעט בתי תקע.", "", "יש תלות בשטח."], "o": ["נקודת מאור 1 ו-2 בתי תקע לפחות.", "2 נקודות מאור ו-2 בתי תקע לפחות.", "2 נקודות מאור ו-4 בתי תקע לפחות.", "אין תלות בין שטח רצפה למספר נקודות החשמל."], "s": ["התקנות קובעות מספר מזערי של נקודות מאור ובתי תקע לפי סוג החדר והשטח.", "בחדר גדול (52 מ\"ר) הדרישה עולה.", "התשובה המקובלת: 2 נקודות מאור ו-4 בתי תקע."], "tp": "ככל שהשטח גדל – יותר נקודות. \"אין תלות בשטח\" זו כמעט תמיד מלכודת."}, {"n": 31, "t": "ocp", "a": 1, "c": 1, "f": 1, "q": "נתון איור – אופיינים של שני מבטחים (63A ו-80A). באיור ניתן לראות מקרה של:", "e": "העקומות נפרדות עד זרם מסוים (Is) ואחריו נפגשות – יש סלקטיביות רק עד זרם הגבול, כלומר סלקטיביות זרם חלקית.", "w": ["מעל Is העקומות נפגשות.", "", "אין השהיית זמן מכוונת.", "עד Is יש סלקטיביות."], "o": ["סלקטיביות מלאה – גם זמן, גם זרם.", "סלקטיביות חלקית – רק סלקטיביות זרם מתקיימת.", "סלקטיביות חלקית – רק סלקטיביות זמן מתקיימת.", "עקרון הסלקטיביות אינו מתקיים כלל לפי האיור הנתון."], "s": ["מסתכלים על שתי עקומות הזמן-זרם.", "בזרמים נמוכים העקומות נפרדות – המבטח הקטן (63A) מנתק לפני הגדול.", "מעל זרם מסוים (Is) העקומות נפגשות ושניהם עלולים לנתק יחד.", "לכן יש סלקטיביות רק עד Is – סלקטיביות זרם חלקית."], "tp": "עקומות שלא נוגעות = סלקטיביות מלאה. נפגשות בזרם גבוה = חלקית."}, {"n": 32, "t": "ocp", "a": 3, "c": 2, "f": 0, "q": "התקן דו-מתכת פועל על פי עקרון:", "e": "שתי מתכות עם מקדם התפשטות שונה מחוברות יחד. כשהן מתחממות הפס מתכופף ומפעיל את המנגנון.", "w": ["לא העיקרון.", "זה עקרון של צמד תרמי.", "לא העיקרון.", ""], "o": ["שינוי עוצמת הזרם כתוצאה משינוי טמפרטורה.", "יצירת הפרש פוטנציאלים בין שתי מתכות בעליית טמפרטורה.", "שינוי התנגדות של המתכות כתוצאה משינוי טמפרטורה.", "התפשטות קווית הגורמת להתארכות שונה של המתכות כתוצאה מעליית הטמפרטורה."], "s": ["דו-מתכת = שתי רצועות מתכת עם מקדם התפשטות שונה, צמודות זו לזו.", "כשמתחממות, אחת מתארכת יותר מהשנייה.", "הרצועה מתכופפת ומפעילה את המנגנון."], "tp": "הפרש פוטנציאלים בחימום זה צמד תרמי (תרמוקפל), לא דו-מתכת."}, {"n": 33, "t": "shock", "a": 0, "c": 2, "f": 0, "q": "עקרון פעולה של ממסר פחת הוא:", "e": "ממסר פחת משווה בין זרם הפאזה לזרם האפס. הפרש (זרם זליגה) מעל IΔn גורם לניתוק.", "w": ["", "זה חלק מהמנגנון, לא העיקרון.", "זו הגנה תרמית.", "זה נתיך."], "o": ["השוואה בין הזרם שמגיע לממסר לבין הז יין נמצא בתחום התרמי, ברצועה שבין כ-10 ל-40 שניות. התשובה המתאימה היא 20 שניות, תחום תרמי.", "w": ["2×In זה תחום תרמי.", "", "8 שניות מחוץ לרצועה ב-2×In.", "2×In זה תחום תרמי."], "o": ["המבטח יופעל תוך 40 שניות – תחום הגנה מגנטי.", "המבטח יופעל תוך 20 שניות – תחום הגנה תרמי.", "המבטח יופעל תוך 8 שניות – תחום הגנה תרמי.", "המבטח יופעל תוך 30 שניות – תחום הגנה מגנטי."], "s": ["מחשבים פי כמה: 40/20 = 2×In.", "מאתרים בגרף את 2 על ציר הזרם.", "ב-2×In הרצועה נמצאת בין כ-10 ל-40 שניות.", "זה בתחום המשופע – תרמי. התשובה המתאימה: 20 שניות, תרמי."], "tp": "באופיין B התחום המגנטי מתחיל רק מ-3–5×In, אז 2×In תמיד תרמי."}, {"n": 37, "t": "cable", "a": 2, "c": 1, "f": 0, "q": "שטח החתך המזערי של המוליכים במעגל סופי למכשירים הוא:", "e": "החתך המזערי למוליכי נחושת במעגל סופי במתקן קבוע הוא 1.5 ממ\"ר.", "w": ["מתאים לכבלי מכשיר גמישים, לא למעגל.", "קטן מהמינימום.", "", "חתך לא תקני."], "o": ["0.75 ממ\"ר.", "1 ממ\"ר.", "1.5 ממ\"ר.", "2 ממ\"ר."], "s": ["נזכרים בחתכים המזעריים למוליכי נחושת במעגל סופי קבוע.", "החתך המזערי הוא 1.5 ממ\"ר.", "0.75 ממ\"ר מתאים רק לכבל גמיש של מכשיר."], "tp": "1.5 ממ\"ר = מינימום למעגל קבוע."}, {"n": 38, "t": "dwell", "a": 2, "c": 0, "f": 1, "q": "מהו המספר המינימלי של מעגלים סופיים, עבור תאורה ובתי תקע, לדירה המוצגת בשרטוט (12×11 מטר)?", "e": "שטח הדירה ≈ 132 מ\"ר. לפי הכלל המקובל (2 מעגלים עד 50 מ\"ר, ועוד מעגל לכל 50 מ\"ר נוספים) יוצא 4 מעגלים. כדאי לוודא מול טבלת התקנות.", "w": ["מעט מדי.", "מעט מדי לשטח הזה.", "", "יותר מהמינימום."], "o": ["2", "3", "4", "5"], "s": ["מחשבים את שטח הדירה: 12 × 11 = 132 מ\"ר.", "לפי הכלל המקובל: 2 מעגלים עד 50 מ\"ר, ועוד מעגל לכל 50 מ\"ר נוספים.", "132 מ\"ר = 50 + 50 + 32, כלומר 2 + 1 + 1 = 4 מעגלים.", "לוודא מול טבלת התקנות."], "tp": "קודם מחשבים שטח משרטוט, ואז ממפים לפי הטבלה."}, {"n": 39, "t": "dwell", "a": 3, "c": 0, "f": 0, "q": "חשב את מספר המעגלים הסופיים המזערי שיש להתקין בדירת מגורים בת 4 חדרים ששטחה 130 מ\"ר. בדירה מותקנים: מקרר, מיקרוגל, תנור אפייה, תנור חימום 2,000 ואט, מדיח כלים ודוד חשמל.", "e": "מעגלים לתא ים מחוברים בטור ומזינים שני פסי אפסים, כאשר כל מעגל מקבל אפס מאותו מפסק שממנו קיבל פאזה."], "s": ["פחת מודד הפרש בין פאזה לאפס של המעגלים שלו.", "אם האפסים של שני הפחתים מחוברים לאותו פס, זרם יחזור דרך הפחת הלא נכון ויגרום לנפילות שווא.", "לכן: הפחתים במקביל (כל אחד מזין חצי מהמעגלים), ולכל פחת פס אפסים משלו."], "tp": "לכל פחת – פס אפס משלו. אף פעם לא לערבב אפסים בין פחתים."}, {"n": 42, "t": "cable", "a": 0, "c": 1, "f": 0, "q": "מהו קו ההזנה המינימלי שיש להתקין למעגל ביתי (על סמך פתרון חישובי) המזין תנור אפייה חד-מופעי שהספקו הנקוב 1.5kW ומחובר למתח 220V?", "e": "I = 1500/220 ≈ 6.8A. מאמ\"ת 10A מתאים, ומוליך 1.5 ממ\"ר מוגן ב-10A. זה הפתרון המינימלי לפי חישוב.", "w": ["", "2.5 ממ\"ר גדול מהנדרש בחישוב.", "16A לא מגן על 1.5 ממ\"ר.", "גדול מהמינימום."], "o": ["In = 10A, A = 1.5mm²", "In = 10A, A = 2.5mm²", "In = 16A, A = 1.5mm²", "In = 16A, A = 2.5mm²"], "s": ["מחשבים זרם: I = 1500/220 ≈ 6.8A.", "בוחרים את המבטח הסטנדרטי שמעל: 10A.", "ל-10A מספיק מוליך 1.5 ממ\"ר.", "זה הפתרון המינימלי לפי חישוב."], "tp": "הסדר: זרם ← מבטח מעליו ← חתך שמתאים למבטח."}, {"n": 43, "t": "dwell", "a": 0, "c": 0, "f": 0, "q": "מהו מספר נקודות המאור ובתי התקע בדירה בת 3 חדרי שינה, סלון 42 מ\"ר, מטבח, שירותים ומרפסת 10 מ\"ר?", "e": "סופרים לפי הדרישה המזערית לכל חדר: נקודת מאור לכל חדר (ויותר בסלון גדול) ובתי תקע לפי סוג החדר והשטח. התשובה המקובלת היא 8 ו-14. מומלץ לעבור על החישוב עם המורה.", "w": ["", "כנראה מעט שקעים.", "יותר מהמינימום.", "מעט מדי."], "o": ["8 נקודות מאור ו-14 שקעים.", "8 נקודות מאור ו-11 שקעים.", "10 נקודות מאור ו-20 שקעים.", "4 נקודות מאור ו-8 שקעים."], "s": ["עוברים חדר-חדר לפי דרישות התקנות: כמה נקודות מאור ובתי תקע לכל חדר.", "סלון גדול מקבל יותר מנקודה אחת, ומטבח מקבל הרבה בתי תקע.", "התשובה המקובלת: 8 ו-14. לעבור על החישוב עם המורה."], "tp": "עושים טבלה קטנה: חדר | מאור | שקעים, ומחברים בסוף."}, {"n": 44, "t": "shock", "a": 0, "c": 0, "f": 1, "q": "מהו הערך המרבי של לולאת התקלה המותר בדירה? נתוני הלוח מופיעים באיור (נתיך ח\"ח 63A, מאמ\"ת ראשי 1×C40, מפסק מגן 40A/30mA). הלוח מסוג II פלסטי.", "e": "במעגל הראשי המגן הוא מאמ\"ת C40, שנופל מגנטית בכ-10×In = 400A. Zמרבי ≈ 230/400 ≈ 0.57Ω, הקרוב ל-0.55Ω. כדאי לבדוק עם המורה איך מתייחסים למפסק המגן.", "w": ["", "מתאים למבטח קטן יותר.", "מתאים למבטח קטן יותר.", "מתאים למבטח קטן בהרבה."], "o": ["0.55Ω", "0.87Ω", "1.74Ω", "3.48Ω"], "s": ["במעגל הראשי המבטח הוא מאמ\"ת C40.", "זרם ניתוק מגנטי: 10 × 40 = 400A.", "Zmax = 230/400 ≈ 0.575Ω, הקרוב ל-0.55Ω."], "tp": "אותה נוסחה כמו בשאלה 2: Zmax = U0/(k·In)."}, {"n": 45, "t": "cable", "a": 2, "c": 1, "f": 1, "q": "מהו קו ההזנה שתתקין (חתך מוליך ומבטח) בלוח דירתי עבור מזגן 1.5 כ\"ס, הניזון ממתח חד-מופעי 230 וולט? למזגן מקדם הספק 0.92.", "e": "P ≈ 1.5×746 = 1119W. I = 1119/(230×0.92) ≈ 5.3A. למנוע (מדחס) עם זרם התנעה בוחרים אופיין C: מאמ\"ת C10 עם 1.5 ממ\"ר.", "w": ["אופיין B עלול ליפול בהתנעה.", "16A לא מגן על 1.5 ממ\"ר.", "", "גדול מהנדרש."], "o": ["In = B10A, A = 1.5mm²", "In = B16A, A = 1.5mm²", "In = C10A, A = 1.5mm²", "In = C16A, A = 2.5mm²"], "s": ["ממירים כ\"ס לוואט: 1.5 × 746 ≈ 1119W.", "מחשבים זרם: I = P/(U·cosφ) = 1119/(230×0.92) ≈ 5.3A.", "מזגן הוא מנוע עם זרם התנעה, ולכן אופיין C.", "המבטח הסטנדרטי שמעל: C10, עם מוליך 1.5 ממ\"ר."], "tp": "מנוע/מדחס = אופיין C. B עלול ליפול בהתנעה."}, {"n": 46, "t": "wet", "a": 3, "c": 1, "f": 0, "q": "מהי דרגת ההגנה הנדרשת לציוד חשמלי המותקן באזור 3 בחדר האמבטיה?", "e": "ככל שמתרחקים מהאמבטיה הדרישה יורדת. באזור 3 (הרחוק ביותר) מספיקה הגנה מפני טפטוף אנכי – IPX1.", "w": ["נדרש באזורים עם סילוני מים.", "נדרש באזורים 1–2.", "לא הדרגה שבתקנות לאזור זה.", ""], "o": ["הגנה מפני סילון מים IPX5X.", "הגנה מפני התזה IPX4X.", "הגנה מפני גשם IPX3X.", "הגנה מפני טפטוף אנכי IPX1X."], "s": ["באמבטיה האזורים מסודרים לפי המרחק מהמים.", "ככל שמתרחקים, דרגת ההגנה הנדרשת יורדת.", "אזור 3 הוא הרחוק ביותר, ומספיק בו IPX1 – הגנה מפני טפטוף אנכי."], "tp": "קרוב למים – IPX4/5. רחוק (אזור 3) – IPX1."}, {"n": 47, "t": "pf", "a": 1, "c": 1, "f": 0, "q": "כדי לשפר את גורם ההספק של משאבה גדולה, עשו חישוב עבור גודלה של סוללת הקבלים בכוכב וקיבלו הספק של 60 KVAR. מהו ההספק של סוללת הקבלים בחיבור משולש?", "e": "ההספק ההיגבי הנדרש תלוי בצרכן, לא בצורת החיבור: 60 KVAR בשני המקרים. מה שמשתנה הוא הקיבול של כל קבל – במשולש הוא קטן פי 3.", "w": ["זה הקיבול שקטן פי 3, לא ההספק.", "", "שגוי.", "ההספק לא משתנה."], "o": ["בחיבור הקבלים במשולש נצטרך הספק פי 3 קטן, כלומר 20 KVAR.", "בחיבור הקבלים במשולש נצטרך אותו ההספק בדיוק כמו בכוכב, כלומר 60 KVAR.", "בחיבור הקבלים במשולש נצטרך הספק פי 3 גדול, כלומר 180 KVAR.", "עבור חיבור הקבלים במשולש יש לבצע חישוב מחדש."], "s": ["מבינים שההספק ההיגבי שהצרכן צריך לא תלוי בצורת החיבור.", "לכן גם במשולש צריך 60 KVAR.", "מה שמשתנה: במשולש כל קבל מקבל מתח גבוה פי √3, ולכן הקיבול שלו קטן פי 3."], "tp": "כוכב/משולש משנה את הקיבול (µF), לא את ההספק (KVAR)."}, {"n": 48, "t": "pf", "a": -1, "c": 0, "f": 0, "q": "לגודל 0.95. מה הספקה של סוללת הקבלים שיש להזמין לצורך זה?", "e": "בשאלה הזו במאגר חסרים נתונים (חסרה תחילת השאלה), ולכן אי אפשר לפתור אותה. היא לא נספרת בציון.", "w": ["", "", "", ""], "o": ["81 KVAR", "38 KVAR", "2.409 KVAR", "-2.409 KVAR"], "s": ["בשאלה הזו חסרים נתונים במאגר, ואי אפשר לפתור אותה."], "tp": "אם יש לכם את הנוסח המלא – תשלחו ואוסיף."}, {"n": 49, "t": "motor", "a": 3, "c": 2, "f": 1, "q": "יש להזמין מפסק מנוע (PKZM 0) לצורך מיתוג ידני של מנוע בעל הספק נקוב של 10 קילוואט, מקדם הספק 0.72 ונצילות 85%. מתח הזנה תלת-מופעי 400 וולט. איזה מפסק תבחר?", "e": "I = P/(η·√3·U·cosφ) = 10000/(0.85×1.732×400×0.72) ≈ 23.6A. זה בתוך תחום 20–25A.", "w": ["קטן מדי.", "קטן מדי.", "קטן מדי.", ""], "o": ["PKZM0-12 כיוונון תרמי 8...12 אמפר.", "PKZM0-16 כיוונון תרמי 10...16 אמפר.", "PKZM0-20 כיוונון תרמי 16...20 אמפר.", "PKZM0-25 כיוונון תרמי 20...25 אמפר."], "s": ["נתונים: P = 10kW, η = 0.85, cosφ = 0.72, U = 400V.", "נוסחה: I = P/(η·√3·U·cosφ).", "הצבה: 10000/(0.85 × 1.732 × 400 × 0.72) ≈ 23.6A.", "בוחרים מפסק שתחום הכיוון שלו כולל 23.6A: PKZM0-25 (20–25A)."], "tp": "זה הספק מכני – תמיד לחלק בנצילות כדי לקבל את ההספק החשמלי."}, {"n": 50, "t": "motor", "a": 0, "c": 2, "f": 0, "q": "על לוחית זיהוי של מנוע כתוב Δ400V/Y690V. מה המשמעות?", "e": "הסליל בנוי ל-400V. ברשת 400V עובדים במשולש, ובהתנעה אפשר לחבר בכוכב (כל סליל מקבל 230V). לכן המנוע מתאים להתנעת כוכב-משולש.", "w": ["", "זה לא \"לפחות\" – אלה מתחי עבודה.", "לא קשור לרוטור.", "שגוי."], "o": ["מנוע אשר במתח שלוב 400 וולט אפשר להתניע כוכב-משולש.", "מנוע אשר חייב לקבל מתח לפחות 690 וולט כדי לעבוד בכוכב, או לפחות 400 וולט למשולש.", "מנוע רוטור מלופף (סטטור משולש, רוטור כוכב), בעל יחס השנאה √3 במנוחה.", "צריך להיות הפוך: Δ690V/Y400V, כי בחיבור משולש מנוע יותר חזק."], "s": ["Δ400V אומר שכל סליל בנוי ל-400V.", "ברשת 400V עובדים במשולש – כל סליל מקבל 400V.", "בהתנעה מחברים בכוכב – כל סליל מקבל 400/√3 = 230V, והזרם קטן פי 3.", "לכן המנוע מתאים להתנעת כוכב-משולש ברשת 400V."], "tp": "המתח שליד Δ הוא מתח הרשת לעבודה רגילה. אם הוא שווה למתח הרשת – אפשר כוכב-משולש."}, {"n": 51, "t": "ocp", "a": 2, "c": 2, "f": 0, "q": "מהי עוצמתו של זרם בדיקה גבוהה I2 של מאמ\"ת הניתן לכוונון?", "e": "זרם ההפעלה המוסכם I2 של מאמ\"ת הוא 1.45×In: ניתוק מובטח תוך פחות משעה. וזרם אי-ההפעלה I1 הוא 1.13×In.", "w": ["", "", "", ""], "o": ["I2 = 1.75 × In", "I2 = 1.60 × In", "I2 = 1.45 × In", "I2 = 1.30 × In"], "s": ["למאמ\"ת יש שני זרמי בדיקה מוסכמים.", "I1 = 1.13×In: לא מנתק במשך שעה.", "I2 = 1.45×In: מנתק תוך פחות משעה.", "לכן I2 = 1.45×In."], "tp": "לשנן את הזוג: 1.13 ו-1.45."}, {"n": 52, "t": "cable", "a": 1, "c": 1, "f": 0, "q": "מהו עומק הטמנה המזערי של כבל כוח בקרקע חול?", "e": "עומק הטמנה מזערי מקובל לכבל מתח נמוך הוא 80 ס\"מ, ומעליו מניחים סרט סימון.", "w": ["רדוד מדי.", "", "נדרש במקרים מיוחדים (למשל מתחת לכביש).", "סרט אזהרה לא מחליף עומק."], "o": ["60 ס\"מ.", "80 ס\"מ.", "100 ס\"מ.", "אין חשיבות בעומק בתנאי שמעל כבל בעומק 25 ס\"מ מונח סרט אזהרה תקני עם רקע צהוב."], "s": ["כבל מתח נמוך שמונח באדמה צריך עומק מזערי.", "המקובל: 80 ס\"מ, ומעליו סרט סימון.", "מתחת לכביש או במקרים מיוחדים – עמוק יותר."], "tp": "סרט אזהרה הוא תוספת, לא תחליף לעומק."}, {"n": 53, "t": "cable", "a": 2, "c": 2, "f": 0, "q": "מהי טמפרטורת העבודה המרבית של מוליכי הזנה (כבלים) עד 1,000 וולט בעלי בידוד עשוי פוליאתילן מוצלב (XLPE)?", "e": "בידוד XLPE עמיד בטמפרטורת עבודה רציפה של 90°C (PVC עמיד ב-70°C).", "w": ["שגוי.", "אלה טמפרטורות סביבה ייחוס.", "", "יש הגבלה."], "o": ["כמו טמפרטורת האוויר או האדמה (תלוי בסוג ההתקנה).", "35 מעלות (התקנה באוויר) ו-30 מעלות (התקנה באדמה), כמו שמוגדר בטבלאות מקדמי תיקון.", "90 מעלות צלזיוס.", "אין הגבלה, בתנאי שמותקנים אמצעי הגנה בפני שריפה לפי תקן אירופאי IEC 332-3."], "s": ["מזהים את סוג הבידוד: XLPE (פוליאתילן מוצלב).", "טמפרטורת עבודה רציפה מרבית ל-XLPE: 90°C."], "tp": "XLPE = 90°C, PVC = 70°C."}, {"n": 54, "t": "dwell", "a": 1, "c": 0, "f": 0, "q": "מהו מספר המכשירים התלת-מופעיים שמותר לחבר למעגל סופי?", "e": "אפשר לחבר כמה מכשירים תלת-מופעיים למעגל אחד, בתנאי שלכל אחד יש הגנת זרם יתר משלו. כדאי לבדוק עם המורה מול נוסח התקנות.", "w": ["", "", "אין קשר בין מספר המכשירים למספר המופעים.", "מותר."], "o": ["מכשיר אחד בלבד, ללא שום תנאי.", "יותר ממכשיר אחד, בתנאי שכל מכשיר יהיה מוגן ע\"י מבטח בפני זרם יתר המיועד רק עבורו.", "שלושה מכשירים בלבד, לפי מספר המופעים בכבל ההזנה.", "למעגל סופי מותר לחבר רק מכשירים חד-מופעיים. התקנת מכשיר תלת-מופעי במעגל סופי אסורה לחלוטין, לפי פרק \"מעגלים סופיים\" של חוק החשמל."], "s": ["מעגל סופי יכול להזין יותר ממכשיר תלת-מופעי אחד.", "התנאי: לכל מכשיר הגנת זרם יתר משלו.", "התשובה מוצעת – לבדוק מול נוסח התקנות."], "tp": "בתשובות \"אסור לחלוטין\" שווה לבדוק – הרבה פעמים יש תנאי שמתיר."}, {"n": 55, "t": "pf", "a": 2, "c": 2, "f": 0, "q": "נתון צרכן: נורת נתרן לחץ גבוה בעלת הספק של 500W ומקדם הספק 0.43, מתח הרשת 230V/50Hz. קבע את ערך הקבל הנדרש לשיפור מקדם ההספק של הנורה ל-0.92 לפי דרישת חוק החשמל:", "e": "Qc = P(tanφ1 − tanφ2) = 500×(2.098 − 0.426) ≈ 837 VAr. C = Qc/(U²·ω) = 837/(230²×314) ≈ 50.36 µF.", "w": ["", "", "", ""], "o": ["37.5 µF", "40.47 µF", "50.36 µF", "52.26 µF"], "s": ["נתונים: P = 500W, cosφ1 = 0.43, cosφ2 = 0.92, U = 230V.", "tanφ1 = tan(acos 0.43) = 2.098, tanφ2 = 0.426.", "Qc = 500 × (2.098 − 0.426) ≈ 837 VAr.", "C = Qc/(U²·2πf) = 837/(230² × 314) ≈ 50.36 µF."], "tp": "4 שלבים קבועים: tanφ1, tanφ2, Qc, C."}, {"n": 56, "t": "pf", "a": 0, "c": 2, "f": 0, "q": "במתקן חשמלי מחוברים במקביל 2 מנועים: P1 = 8kW, cosφ = 0.75 ; P2 = 8kW, cosφ = 0.75. חשב את ההספק בקבל שיש לחבר במקביל ל-2 המנועים על מנת לשפר את מקדם ההספק לערך הדרוש לפי דרישת חברת החשמל:", "e": "P = 16kW. Qc = 16×(tan(acos0.75) − tan(acos0.92)) = 16×(0.882 − 0.426) ≈ 7.29 KVAr (דרישת חברת החשמל: 0.92).", "w": ["", "", "", ""], "o": ["7.29 KVAr", "10.16 KVAr", "13.37 KVAr", "14.20 KVAr"], "s": ["מחברים הספקים: P = 8 + 8 = 16kW (אותו cosφ).", "tanφ1 = tan(acos 0.75) = 0.882, ודרישת חברת החשמל cosφ = 0.92 → tanφ2 = 0.426.", "Qc = 16 × (0.882 − 0.426) ≈ 7.29 KVAr."], "tp": "\"דרישת חברת החשמל\" = 0.92. כדאי לזכור את tan של 0.92: 0.426."}, {"n": 57, "t": "pf", "a": 2, "c": 2, "f": 0, "q": "נתון הספק פעיל והספק היגבי של הצרכן: P = 20 kW ; Q = 8.6 kVAr. חשב את מקדם ההספק:", "e": "S = √(20² + 8.6²) ≈ 21.77 kVA. cosφ = P/S = 20/21.77 ≈ 0.92.", "w": ["", "", "", ""], "o": ["cosφ = 0.63", "cosφ = 0.75", "cosφ = 0.92", "cosφ = 1"], "s": ["S = √(P² + Q²) = √(20² + 8.6²) = √(400 + 73.96) ≈ 21.77 kVA.", "cosφ = P/S = 20/21.77 ≈ 0.92."], "tp": "משולש ההספקים: P ניצב, Q ניצב, S יתר. cosφ = P/S."}, {"n": 58, "t": "pf", "a": 3, "c": 2, "f": 0, "q": "נתון צרכן חד-מופעי בהספק 2kW, מקדם הספק 0.7. המתח הנקוב הוא 220V/50Hz. מה גודל הקבל שיש להתקין כדי לשפר את מקדם ההספק ל-0.92?", "e": "Qc = 2000×(1.020 − 0.426) ≈ 1188 VAr. C = 1188/(220²×314) ≈ 78.15 µF.", "w": ["", "", "", ""], "o": ["47.4 µF", "68.6 µF", "73.8 µF", "78.15 µF"], "s": ["tanφ1 = tan(acos 0.7) = 1.020, tanφ2 = 0.426.", "Qc = 2000 × (1.020 − 0.426) ≈ 1188 VAr.", "C = 1188/(220² × 314) ≈ 78.15 µF."], "tp": "לשים לב שהמתח כאן 220V ולא 230V – זה משנה את התוצאה."}, {"n": 59, "t": "pf", "a": 3, "c": 1, "f": 0, "q": "נתון מדחס המחובר לרשת תלת-מופעית של 400V/50Hz, בהספק 20kW ו-cosφ = 0.85. מה הערך של סוללת קבלים המשפרת את מקדם ההספק ל-0.92, בהנחה שהסוללה מחוברת בכוכב?", "e": "Qc = 20000×(0.620 − 0.426) ≈ 3875 VAr, כלומר 1292 VAr לכל קבל. בכוכב כל קבל מקבל 230V: C = 1292/(230²×314) ≈ 77.1 µF.", "w": ["", "", "", ""], "o": ["3 × 44.76 µF", "3 × 55.56 µF", "3 × 66.19 µF", "3 × 77.19 µF"], "s": ["tanφ1 = tan(acos 0.85) = 0.620, tanφ2 = 0.426.", "Qc = 20000 × (0.620 − 0.426) ≈ 3875 VAr, כלומר 1292 VAr לכל אחד מ-3 הקבלים.", "בכוכב כל קבל מקבל מתח מופע: 400/√3 = 230V.", "C = 1292/(230² × 314) ≈ 77.1 µF לכל קבל."], "tp": "כוכב → 230V לקבל. משולש → 400V לקבל. מחלקים את Qc ב-3."}, {"n": 60, "t": "pf", "a": 2, "c": 1, "f": 0, "q": "בבית מלאכה המוזן מרשת תלת-מופעית בעלת מתח קווי של 400V/50Hz קיים מנוע בהספק 8kW ומקדם הספק 0.75. חשב את ההספק ההיגבי של סוללת הקבלים לשיפור גורם ההספק ל-0.92:", "e": "Qc = 8×(0.882 − 0.426) ≈ 3.65 kVAr. בוחרים את הגודל הסטנדרטי שמעליו: 4 kVAr.", "w": ["", "קטן מהנדרש (3.65).", "", "גדול מהנדרש."], "o": ["2 kVAr", "3 kVAr", "4 kVAr", "5 kVAr"], "s": ["tanφ1 = tan(acos 0.75) = 0.882, tanφ2 = 0.426.", "Qc = 8 × (0.882 − 0.426) ≈ 3.65 kVAr.", "בוחרים את הגודל הסטנדרטי שמעל: 4 kVAr."], "tp": "כשהתוצאה בין שני ערכים – בוחרים את הגדול, כדי להגיע ל-0.92."}, {"n": 61, "t": "pf", "a": 0, "c": 2, "f": 0, "q": "חשב את ערך הקבל המשפר את מקדם ההספק של נורת פלואורסצנט בעלת הספק של 50W מ-0.45 ל-0.92. מתח הרשת הוא 230V/50Hz:", "e": "Qc = 50×(1.985 − 0.426) ≈ 77.9 VAr. C = 77.9/(230²×314) ≈ 4.69 µF.", "w": ["", "", "", ""], "o": ["4.67 µF", "4.78 µF", "5.67 µF", "7.76 µF"], "s": ["tanφ1 = tan(acos 0.45) = 1.985, tanφ2 = 0.426.", "Qc = 50 × (1.985 − 0.426) ≈ 78 VAr.", "C = 78/(230² × 314) ≈ 4.69 µF, הקרוב ל-4.67 µF."], "tp": "גם לנורה בודדת – אותם 4 שלבים."}, {"n": 62, "t": "pf", "a": 0, "c": 2, "f": 1, "q": "נתונה רשת המוזנת 230V/50Hz עם שני צרכנים: SM1 = 5+3j kVA, SM2 = 5+3j kVA. מצא את גודל הקבל שצריך להתקין על מנת לשפר את מקדם ההספק כדרישת חברת החשמל:", "e": "P = 10kW, Q = 6kVAr. Qc = 6000 − 10000×0.426 ≈ 1740 VAr. C = 1740/(230²×314) ≈ 104.7 µF.", "w": ["", "", "", ""], "o": ["104.81 µF", "66.1 µF", "56.1 µF", "46.1 µF"], "s": ["מחברים את שני הצרכנים: S = (5+3j) + (5+3j) = 10 + 6j kVA, כלומר P = 10kW ו-Q = 6kVAr.", "Q רצוי ב-0.92: P × 0.426 = 4.26 kVAr.", "Qc = 6 − 4.26 = 1.74 kVAr.", "C = 1740/(230² × 314) ≈ 104.7 µF."], "tp": "כשנתון S מרוכב: החלק הממשי = P, החלק המדומה = Q."}, {"n": 63, "t": "motor", "a": 0, "c": 1, "f": 0, "q": "מעל איזה הספק יש להתקין למנוע מבטח הגנה בפני עומס יתר, המיועד לו בלבד?", "e": "לפי התקנות, מנוע שהספקו עולה על 0.5 כ\"ס צריך הגנה בפני עומס יתר משלו.", "w": ["", "היחידה והערך לא תואמים לתקנה.", "", ""], "o": ["0.5HP", "0.5kW", "1kW", "1.5kW"], "s": ["התקנות קובעות הגנה בפני עומס יתר למנוע לפי ההספק שלו.", "מנוע שהספקו עולה על 0.5 כ\"ס צריך הגנה משלו."], "tp": "הסף נקוב בכ\"ס (HP) ולא ב-kW."}, {"n": 64, "t": "pf", "a": 1, "c": 2, "f": 1, "q": "להדקי הצרכן (20kW, cosφ = 0.6, 400V) חוברה סוללת קבלים לשיפור מקדם ההספק לערך הנדרש ע\"י חברת החשמל. מצא את ההספק של סוללת הקבלים:", "e": "Qc = 20×(tan(acos0.6) − tan(acos0.92)) = 20×(1.333 − 0.426) ≈ 18.14 kVAr.", "w": ["", "", "", ""], "o": ["17.07 kVAr", "18.14 kVAr", "19.09 kVAr", "20.02 kVAr"], "s": ["tanφ1 = tan(acos 0.6) = 1.333, tanφ2 = 0.426.", "Qc = 20 × (1.333 − 0.426) ≈ 18.14 kVAr."], "tp": "שווה לזכור: tan של 0.6 = 1.333, של 0.8 = 0.75."}, {"n": 65, "t": "mat", "a": 0, "c": 2, "f": 0, "q": "תכונות המאפיינות בדד:", "e": "לבדד יש התנגדות גבוהה מאוד, ולכן זרם הזליגה דרכו קטן.", "w": ["", "סתירה.", "התנגדות נמוכה מאפיינת מוליך.", "זה מוליך גרוע."], "o": ["התנגדות גבוהה, זרם זליגה נמוך.", "התנגדות גבוהה, זרם זליגה גבוה.", "התנגדות נמוכה, זרם זליגה נמוך.", "התנגדות נמוכה, זרם זליגה גבוה."], "s": ["לבדד יש התנגדות גבוהה מאוד.", "לכן זרם הזליגה דרכו קטן.", "שתי התכונות האלה מגדירות בדד טוב."], "tp": "התנגדות גבוהה תמיד הולכת עם זליגה נמוכה – אפשרות שמשלבת אחרת סותרת את עצמה."}, {"n": 66, "t": "pf", "a": 3, "c": 1, "f": 1, "q": "נתונה כרסומת (5HP, cosφ = 0.82, 400V/50Hz). חשב את גודל ההספק של סוללת קבלים שיש לחבר לצרכן על מנת לשפר את מקדם ההספק שלו לערך הרצוי כדרישת חברת החשמל:", "e": "P = 5×736 = 3680W. Qc = 3680×(0.698 − 0.426) ≈ 1001 VAr. אם מחשבים כ\"ס כ-746W יוצא 1015 VAr, וזו עדיין התשובה הקרובה.", "w": ["", "", "", ""], "o": ["641.52 VAr", "761.42 VAr", "871.32 VAr", "1001 VAr"], "s": ["ממירים: 5 כ\"ס × 736W ≈ 3680W.", "tanφ1 = tan(acos 0.82) = 0.698, tanφ2 = 0.426.", "Qc = 3680 × (0.698 − 0.426) ≈ 1001 VAr."], "tp": "כ\"ס מטרי = 736W, כ\"ס אנגלי = 746W. אם אף תשובה לא יוצאת מדויק – לנסות את השני."}, {"n": 67, "t": "pf", "a": 0, "c": 1, "f": 1, "q": "נתונה משחזת (7kW, cosφ = 0.85, 400V/50Hz). חשב את גודל סוללת קבלים במשולש שיש לחבר לצרכן על מנת לשפר את מקדם ההספק שלו לערך הרצוי כדרישת חברת החשמל:", "e": "Qc = 7000×(0.620 − 0.426) ≈ 1356 VAr, כלומר 452 VAr לכל קבל. התשובה במאגר (27 µF) מתקבלת אם מציבים 230V לכל קבל. בחיבור משולש אמיתי (400V) יוצא כ-9 µF לקבל. כדאי לשאול את המורה.", "w": ["", "", "", ""], "o": ["3 × 27.02 µF", "3 × 36.02 µF", "3 × 40.06 µF", "3 × 42.02 µF"], "s": ["tanφ1 = 0.620, tanφ2 = 0.426. Qc = 7000 × 0.194 ≈ 1356 VAr, כלומר 452 VAr לכל קבל.", "המפתח של המאגר מציב 230V לקבל: C = 452/(230² × 314) ≈ 27.2 µF.", "במשולש אמיתי (400V לקבל) יוצא כ-9 µF – לשאול את המורה מה מצופה במבחן."], "tp": "בשאלות \"3× µF\" במאגר הזה – התשובות מחושבות עם 230V לקבל."}, {"n": 68, "t": "pf", "a": 3, "c": 1, "f": 1, "q": "נתונה מקדחה (3kW, cosφ = 0.8, 400V/50Hz). חשב את גודל סוללת קבלים במשולש שיש לחבר לצרכן על מנת לשפר את מקדם ההספק שלו לערך הרצוי כדרישת חברת החשמל:", "e": "Qc = 3000×(0.75 − 0.426) ≈ 972 VAr, כלומר 324 VAr לכל קבל. בהצבת 230V לקבל (כמו במפתח המאגר) יוצא ≈ 19.3 µF.", "w": ["", "", "", ""], "o": ["3 × 10.33 µF", "3 × 12.43 µF", "3 × 15.66 µF", "3 × 19.33 µF"], "s": ["tanφ1 = tan(acos 0.8) = 0.75, tanφ2 = 0.426.", "Qc = 3000 × 0.324 ≈ 972 VAr, כלומר 324 VAr לכל קבל.", "C = 324/(230² × 314) ≈ 19.3 µF."], "tp": "אותה שיטה כמו בשאלה 67."}, {"n": 69, "t": "pf", "a": 0, "c": 1, "f": 1, "q": "נתונה רתכת (8kW, cosφ = 0.6, 400V/50Hz). חשב את גודל סוללת קבלים במשולש שיש לחבר לצרכן על מנת לשפר את מקדם ההספק שלו לערך הרצוי כדרישת חברת החשמל:", "e": "Qc = 8000×(1.333 − 0.426) ≈ 7257 VAr, כלומר 2419 VAr לכל קבל. בהצבת 230V לקבל יוצא ≈ 144 µF, הכי קרוב ל-143.84.", "w": ["", "", "", ""], "o": ["143.84 µF", "152.84 µF", "160.74 µF", "170.96 µF"], "s": ["tanφ1 = 1.333, tanφ2 = 0.426. Qc = 8000 × 0.907 ≈ 7257 VAr, כלומר 2419 VAr לכל קבל.", "C = 2419/(230² × 314) ≈ 145.6 µF.", "הכי קרוב מבין התשובות: 143.84 µF."], "tp": "אם יוצא קרוב לתשובה אחת – זה הפרש עיגול. בוחרים את הקרובה."}, {"n": 70, "t": "cable", "a": 3, "c": 0, "f": 0, "q": "מהו המספר המרבי של מוליכים בעלי קוטר חיצוני (כולל בידוד) של 2.7 מ\"מ שאפשר להשחיל במתקן חדש בצינור שקוטרו הפנימי 16 מ\"מ?", "e": "שטח הצינור ≈ π×8² ≈ 201 ממ\"ר. שטח מוליך ≈ 5.7 ממ\"ר. לפי כלל \"שטח הצינור לפחות פי 3 מסך שטחי המוליכים\": 201/3/5.7 ≈ 11.7, ולכן המרבי מבין התשובות הוא 10. כדאי לוודא מול התקנות.", "w": ["", "", "", ""], "o": ["4", "6", "8", "10"], "s": ["שטח הצינור: π × r² = 3.14 × 8² ≈ 201 ממ\"ר.", "שטח מוליך (כולל בידוד): π × 1.35² ≈ 5.7 ממ\"ר.", "לפי הכלל ששטח הצינור לפחות פי 3 מסך שטחי המוליכים: 201/3 = 67, ו-67/5.7 ≈ 11.7.", "המרבי מבין התשובות שקטן מ-11.7: 10. לוודא מול התקנות."], "tp": "עובדים עם רדיוס ולא קוטר: 16 מ\"מ → r = 8."}, {"n": 71, "t": "pf", "a": 2, "c": 1, "f": 1, "q": "נתון צרכן (40kW, cosφ = 0.6, 400V/50Hz). חשב את גודל סוללת קבלים במשולש שיש לחבר לצרכן על מנת לשפר את מקדם ההספק שלו לערך הרצוי כדרישת חברת החשמל:", "e": "Qc = 40000×(1.333 − 0.426) ≈ 36.3 kVAr, כלומר 12.1 kVAr לכל קבל. בהצבת 230V לקבל יוצא ≈ 722 µF.", "w": ["", "", "", ""], "o": ["3 × 837.64 µF", "3 × 819.20 µF", "3 × 722.4 µF", "3 × 576.40 µF"], "s": ["tanφ1 = 1.333, tanφ2 = 0.426. Qc = 40000 × 0.907 ≈ 36.3 kVAr, כלומר 12.1 kVAr לכל קבל.", "C = 12100/(230² × 314) ≈ 728 µF, הקרוב ל-722.4."], "tp": "אותה שיטה כמו 67–69 בהספק גדול יותר."}, {"n": 72, "t": "pf", "a": 1, "c": 1, "f": 0, "q": "חשב את גודלה המסחרי של סוללת קבלים לשיפור מקדם הספק של משאבה תלת-מופעית שהספקה 20KW ונצילותה 80%, מ-0.78 ל-0.97:", "e": "הספק כניסה: 20/0.8 = 25kW. Qc = 25×(0.802 − 0.251) ≈ 13.8 KVAr. הגודל המסחרי שמעליו הוא 15 KVAr.", "w": ["קטן מהנדרש.", "", "גדול מדי.", "גדול מדי."], "o": ["12.5 KVAr", "15 KVAr", "25 KVAr", "40 KVAr"], "s": ["זה הספק מכני, אז מחשבים הספק כניסה: 20/0.8 = 25kW.", "tanφ1 = tan(acos 0.78) = 0.802, tanφ2 = tan(acos 0.97) = 0.251.", "Qc = 25 × (0.802 − 0.251) ≈ 13.8 KVAr.", "בוחרים את הגודל המסחרי שמעל: 15 KVAr."], "tp": "משאבה/מנוע עם נצילות – תמיד לחלק בנצילות לפני החישוב."}, {"n": 73, "t": "ocp", "a": 3, "c": 1, "f": 1, "q": "בחר הגנה ושטח חתך לסוללת הקבלים המתוארת באיור, Qc = 10KVAr. ההזנה באמצעות כבל רב-גידי בתוך תעלה על גבי הקיר. הבידוד מיועד ל-900.", "e": "Ic = 10000/(√3×400) ≈ 14.4A. לקבלים מגדילים את ההגנה בערך פי 1.43 (זרמי מיתוג והרמוניות) – ≈ 20.6A, ולכן 25A. מבטח 25A מחייב מוליך 4 ממ\"ר.", "w": ["ההגנה קטנה מדי לקבלים.", "ההגנה קטנה מדי לקבלים.", "2.5 ממ\"ר לא מוגן ב-25A.", ""], "o": ["In = 16A, A = 2.5", "In = 16A, A = 4", "In = 25A, A = 2.5", "In = 25A, A = 4"], "s": ["זרם הקבלים: Ic = 10000/(√3 × 400) ≈ 14.4A.", "לקבלים מגדילים את ההגנה בערך פי 1.43 (זרמי מיתוג והרמוניות): 14.4 × 1.43 ≈ 20.6A.", "המבטח הסטנדרטי שמעל: 25A.", "מבטח 25A מחייב מוליך 4 ממ\"ר."], "tp": "קבלים: מבטח ≈ פי 1.43 מהזרם הנקוב."}, {"n": 74, "t": "motor", "a": 3, "c": 2, "f": 0, "q": "כיצד תכייל ממסר לעומס יתר למנוע כרסומת? נתוני המכונה: הספק 15KW, מתח תלת-מופעי 400 וולט, מקדם הספק 0.87, נצילות 0.8.", "e": "I = 15000/(0.8×√3×400×0.87) ≈ 31.1A. מכיילים את הממסר לזרם הנקוב של המנוע.", "w": ["", "", "", ""], "o": ["53.87A", "54.95A", "31.73A", "31.11A"], "s": ["I = P/(η·√3·U·cosφ).", "הצבה: 15000/(0.8 × 1.732 × 400 × 0.87) ≈ 31.1A.", "מכיילים את הממסר התרמי לזרם הנקוב: 31.11A."], "tp": "ממסר עומס יתר מכיילים לזרם הנקוב של המנוע, לא לזרם ההתנעה."}, {"n": 75, "t": "motor", "a": 0, "c": 1, "f": 1, "q": "מה גודל הנתיכים והמוליכים שיש להתקין למגרסה המתוארת באיור (7.5HP, cosΦ = 0.82, η = 87%, 380V)? למגרסה מקדם התנעה של 5.", "e": "In ≈ 7.5×746/(√3×380×0.82×0.87) ≈ 11.9A. זרם ההתנעה ≈ 60A. נתיך איטי בגודל ≈ Iהתנעה/2.5 ≈ 25A, עם מוליך 2.5 ממ\"ר.", "w": ["", "ייפול בהתנעה.", "גדול מהנדרש.", "גדול מאוד מהנדרש."], "o": ["In = 25A, A = 2.5mm²", "In = 16A, A = 2.5mm²", "In = 50A, A = 4mm²", "In = 50A, A = 16mm²"], "s": ["ממירים: 7.5 × 746 ≈ 5595W.", "In = 5595/(√3 × 380 × 0.82 × 0.87) ≈ 11.9A.", "זרם התנעה = 5 × 11.9 ≈ 60A.", "נתיך איטי ≈ זרם התנעה / 2.5 ≈ 24A → 25A, עם מוליך 2.5 ממ\"ר."], "tp": "נתיך למנוע בוחרים לפי זרם ההתנעה, כדי שלא יישרף בכל הפעלה."}, {"n": 76, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "בחר מפסק ראשי ללוח הסדנה המתואר באיור (כרסומת 3.5kW cos0.85, מכונת חיתוך 3HP cos0.82, מקדחה 7HP cos0.82). המכשירים מחוברים למתח 400 וולט ~3 ומקדם ההספק בלוח שופר ל-0.93. יש להניח Pn = Pin. כל המכשירים עובדים ללא הפסקה.", "e": "P = 3500 + 3×746 + 7×746 ≈ 10,960W. I = 10960/(√3×400×0.93) ≈ 17A. המפסק הסטנדרטי שמעל מבין התשובות: 3X25A.", "w": ["קטן מדי.", "17A גבוה מ-16A.", "", "גדול מהנדרש."], "o": ["3X10A", "3X16A", "3X25A", "3X32A"], "s": ["מחברים הספקים: 3500 + 3 × 746 + 7 × 746 ≈ 10,960W.", "I = 10960/(√3 × 400 × 0.93) ≈ 17A.", "17 גדול מ-16, ולכן בוחרים את המפסק הסטנדרטי שמעל מבין התשובות: 3X25A."], "tp": "המשפט \"Pn = Pin\" אומר שלא צריך לחלק בנצילות."}, {"n": 77, "t": "pf", "a": 3, "c": 2, "f": 1, "q": "חשב את מקדם ההספק הכולל למתקן המתואר באיור (PA = 15KW, cosΦA = 0.82 ; PB = 12KW, cosΦB = 0.87):", "e": "QA = 15×0.698 = 10.47; QB = 12×0.567 = 6.80. P = 27, Q = 17.27. cosφ = 27/√(27² + 17.27²) ≈ 0.84.", "w": ["", "", "ממוצע פשוט – שגוי.", ""], "o": ["0.83", "0.86", "0.85", "0.84"], "s": ["מחשבים Q לכל צרכן: QA = 15 × tan(acos 0.82) = 15 × 0.698 = 10.47 ; QB = 12 × 0.567 = 6.80.", "מחברים: P = 27kW, Q = 17.27kVAr.", "cosφ = P/√(P² + Q²) = 27/32.05 ≈ 0.84."], "tp": "אסור לעשות ממוצע של מקדמי הספק. מחברים P לחוד ו-Q לחוד."}, {"n": 78, "t": "pf", "a": 3, "c": 2, "f": 1, "q": "חשב את ההספק של תנור היתוך שיש להוסיף במקביל למכונת האריזה (מנוע 30kW, cosΦ = 0.82) כדי לשפר את מקדם ההספק של המערכת ל-0.92:", "e": "תנור הוא עומס אוהמי (Q=0). Q = 30×0.698 = 20.94 kVAr. נדרש P כך ש-Q/P = 0.426, כלומר P ≈ 49.2kW. התנור: 49.2 − 30 ≈ 19kW.", "w": ["", "", "", ""], "o": ["≈13KW", "≈15KW", "≈17KW", "≈19KW"], "s": ["תנור הוא עומס אוהמי – יש לו P בלי Q.", "Q של המנוע: 30 × tan(acos 0.82) = 20.94 kVAr.", "כדי שהמערכת תגיע ל-0.92: Q/Pכולל = 0.426, ולכן Pכולל = 20.94/0.426 ≈ 49.2kW.", "הספק התנור: 49.2 − 30 ≈ 19kW."], "tp": "מוסיפים P בלי Q – וכך היחס Q/P קטן ו-cosφ עולה."}, {"n": 79, "t": "light", "a": 1, "c": 0, "f": 1, "q": "מהו המספר המינימלי של המעגלים הסופיים עבור תאורה בסדנה המתוארת באיור (30×18 מ')?", "e": "באיור יש 12 גופי תאורה באולם. התשובה המקובלת היא 12 מעגלים. כדאי לוודא עם המורה מהו הכלל בתקנות (מספר נקודות או שטח למעגל).", "w": ["", "", "", ""], "o": ["10", "12", "14", "16"], "s": ["סופרים את גופי התאורה באולם: 3 שורות של 4 = 12.", "התשובה המקובלת: 12 מעגלים.", "לוודא עם המורה מה הכלל בתקנות."], "tp": "בשאלה עם שרטוט – קודם סופרים את מה שמופיע בו."}, {"n": 80, "t": "motor", "a": 1, "c": 0, "f": 0, "q": "באילו תנאים מותר להזין באמצעות מעגל סופי אחד מספר מנועים ללא מבטח מיוחד לכל מנוע בנפרד?", "e": "התקנות מתירות להזין כמה מנועים קטנים ממעגל אחד בלי מבטח לכל אחד, כשהספק כל מנוע והמבטח המשותף מוגבלים. התשובה המקובלת: עד 1kW לכל מנוע ומבטח עד 10A. כדאי לוודא מול התקנות.", "w": ["", "", "", ""], "o": ["הספק כל מנוע לא יעלה על 0.5 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 10 אמפר.", "הספק כל מנוע לא יעלה על 1 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 10 אמפר.", "הספק כל מנוע לא יעלה על 0.5 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 16 אמפר.", "הספק כל מנוע לא יעלה על 1 קילוואט והזרם הנומינלי של המבטח בפני זרם יתר לא יעלה על 16 אמפר."], "s": ["התקנות מתירות להזין כמה מנועים קטנים ממעגל אחד בלי מבטח לכל אחד.", "יש הגבלה על הספק כל מנוע ועל המבטח המשותף.", "התשובה המקובלת: עד 1kW לכל מנוע ומבטח עד 10A. לוודא מול התקנות."], "tp": "יש כאן שני תנאים – הספק המנוע וגודל המבטח. צריך את השילוב הנכון."}, {"n": 81, "t": "pf", "a": 2, "c": 2, "f": 1, "q": "חשב את ערך הקבל (במיקרו-פרד) לשיפור מקדם ההספק של מנוע חד-מופעי הצורך 1,400 וואט שמקדם ההספק שלו 0.87. מקדם ההספק הנדרש 0.95. תדירות הרשת 50 הרץ במתח 240 וולט.", "e": "Qc = 1400×(0.567 − 0.329) ≈ 333 VAr. C = 333/(240²×314) ≈ 18.4 µF.", "w": ["", "", "", ""], "o": ["≈ 10.8µF", "≈ 14.5µF", "≈ 18.6µF", "≈ 22.7µF"], "s": ["tanφ1 = tan(acos 0.87) = 0.567, tanφ2 = tan(acos 0.95) = 0.329.", "Qc = 1400 × (0.567 − 0.329) ≈ 333 VAr.", "C = 333/(240² × 314) ≈ 18.4 µF, הקרוב ל-18.6."], "tp": "לשים לב: כאן המתח 240V ו-cosφ רצוי 0.95."}, {"n": 82, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "חשב את שטח החתך האחיד המסחרי של רשת לזרם ישר שבאיור (600V, l1 = 90m עם P1 = 25kW, l2 = 80m עם P2 = 35kW), אם מפל המתח הכללי הוא 4%. מוליכים עשויים נחושת, ρ = 0.0175.", "e": "I1 = 41.7A, I2 = 58.3A. ΔU = 24V. A = 2ρ[(I1+I2)×90 + I2×80]/ΔU ≈ 19.9 ממ\"ר. החתך המסחרי שמעליו הוא 25 ממ\"ר (20 אינו חתך סטנדרטי).", "w": ["קטן מדי.", "קטן מדי.", "", "20 ממ\"ר אינו חתך מסחרי סטנדרטי."], "o": ["10 ממ\"ר", "16 ממ\"ר", "25 ממ\"ר", "20 ממ\"ר"], "s": ["זרמים: I1 = 25000/600 ≈ 41.7A ; I2 = 35000/600 ≈ 58.3A.", "מפל מותר: 4% × 600 = 24V.", "בזרם ישר (שני מוליכים): A = 2ρ × [(I1+I2) × 90 + I2 × 80] / ΔU.", "A = 2 × 0.0175 × (100 × 90 + 58.3 × 80)/24 ≈ 19.9 ממ\"ר, והחתך המסחרי שמעל: 25 ממ\"ר."], "tp": "בקטע הראשון עובר זרם של שני הצרכנים, ובשני רק של האחרון."}, {"n": 83, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "מהו המתח בנקודה C של רשת תלת-מופעית עשויה חמרן (אלומיניום), ρ = 0.028, בעלת שטח חתך אחיד של 10 ממ\"ר? (Un = 400V, קטע AB: 50m עם IL1a = 30A, קטע BC: 80m עם IL2a = 20A)", "e": "ΔU = √3·ρ/A·(30×50 + 20×80) = 1.732×0.0028×3100 ≈ 15V. UC ≈ 400 − 15 = 385V (כשהזרמים הנתונים הם זרמי הקטעים).", "w": ["", "", "", ""], "o": ["374V", "382.7V", "385V", "391.3V"], "s": ["ΔU בתלת-מופעי: √3 × (ρ/A) × Σ(I × l).", "Σ = 30 × 50 + 20 × 80 = 3100.", "ΔU = 1.732 × (0.028/10) × 3100 ≈ 15V.", "UC = 400 − 15 = 385V."], "tp": "אם הזרמים מסומנים על הקטעים – מציבים אותם ישר, בלי לחבר."}, {"n": 84, "t": "calc", "a": 1, "c": 1, "f": 1, "q": "בהתאם לאיור, חשב את הפסדי ההספק ברשת תלת-מופעית עשויה חמרן (אלומיניום), ρ = 0.028, בעלת שטח חתך אחיד של 35 ממ\"ר. (קטע AB: 120m עם IL1 = 30A, קטע BC: 80m עם IL2 = 50A)", "e": "ΔP = 3·ρ/A·Σ(I²·l) = 3×0.0008×(30²×120 + 50²×80) = 739.2W (כשהזרמים הנתונים הם זרמי הקטעים).", "w": ["", "", "", ""], "o": ["985W", "739.2W", "492W", "246W"], "s": ["הפסדים בתלת-מופעי: ΔP = 3 × (ρ/A) × Σ(I² × l).", "Σ = 30² × 120 + 50² × 80 = 108,000 + 200,000 = 308,000.", "ΔP = 3 × (0.028/35) × 308,000 = 739.2W."], "tp": "בהפסדים מעלים את הזרם בריבוע. במפל מתח – לא."}, {"n": 85, "t": "calc", "a": 1, "c": 1, "f": 0, "q": "מהו מפל המתח המרבי המומלץ ברשת עילית תלת-מופעית 400 וולט?", "e": "המקובל ברשת חלוקה עילית הוא מפל מתח של עד 5%.", "w": ["מחמיר מהמקובל.", "", "גבוה מדי.", "אפשר להשפיע דרך החתך."], "o": ["עד 2.5%", "עד 5%", "עד 10%", "אנו לא יכולים להשפיע על מפל המתח. זאת פונקציה של העומס (זרם הנמסר בקו)."], "s": ["ברשת חלוקה עילית מקובל מפל מתח של עד 5%."], "tp": "מפל מתח כן תלוי בנו – דרך החתך והאורך."}, {"n": 86, "t": "calc", "a": 2, "c": 2, "f": 1, "q": "הצרכן שבאיור (20KW, cosφ = 0.7, קו 100m, A = 16mm², g = 35) מחובר לרשת תלת-מופעית של 400 וולט. לצרכן זה שופר מקדם ההספק ל-0.92. חשב את הפסדי ההספק ברשת בשני מקרים: לפני שיפור מקדם ההספק ואחריו. ΔP = 3·I²·l/(g·A), I = P/(√3·U·cosφ).", "e": "לפני: I = 41.2A, ΔP1 = 3×41.2²×100/(35×16) ≈ 911W. אחרי: I = 31.4A, ΔP2 ≈ 527W.", "w": ["", "", "", ""], "o": ["ΔP2 = 300.5W, ΔP1 = 800W", "ΔP2 = 400.56W, ΔP1 = 650W", "ΔP2 = 527W, ΔP1 = 911W", "ΔP2 = 500W, ΔP1 = 850W"], "s": ["לפני השיפור: I1 = 20000/(√3 × 400 × 0.7) ≈ 41.2A ; ΔP1 = 3 × 41.2² × 100/(35 × 16) ≈ 911W.", "אחרי השיפור: I2 = 20000/(√3 × 400 × 0.92) ≈ 31.4A ; ΔP2 ≈ 527W."], "tp": "שיפור כופל הספק מקטין זרם, ולכן ההפסדים יורדים בריבוע."}, {"n": 87, "t": "cable", "a": 2, "c": 0, "f": 0, "q": "חשב את הזרם המרבי שניתן להזרים באחד ממוליכי כבל מנחושת מסוג N2XY, בעל חתך של 4×16mm². הכבל מחובר במעגל תלת-מופעי ומותקן במקובץ בחבילה צמודה של 6 כבלים במישרין באדמה. הטמפרטורה האופפת של האדמה היא 50°C.", "e": "I'z = Iz × מקדם טמפרטורה × מקדם קיבוץ, לפי הטבלאות של \"המדריך לחשמלאי\". את הערכים המדויקים צריך לקחת מהטבלאות שלכם – התשובה כאן לא אומתה.", "w": ["", "", "", ""], "o": ["I'z = 31.85A", "I'z = 32.14A", "I'z = 29.93A", "I'z = 28.93A"], "s": ["לוקחים מהטבלה את Iz של N2XY 4×16 באדמה.", "מכפילים במקדם טמפרטורה (אדמה 50°C) ובמקדם קיבוץ (6 כבלים צמודים).", "I'z = Iz × k1 × k2. את הערכים צריך לקחת מהטבלאות של \"המדריך לחשמלאי\" – התשובה כאן לא אומתה."], "tp": "שאלות טבלה: מוצאים Iz, ומכפילים בכל מקדמי התיקון שנתונים בשאלה."}, {"n": 88, "t": "cable", "a": 2, "c": 2, "f": 0, "q": "כבל מסוג N2XY בבידוד XLPE (ירוק) עמיד בטמפרטורה של עד:", "e": "XLPE עמיד ב-90°C בעבודה רציפה.", "w": ["", "זו הטמפרטורה של PVC (NYY).", "", ""], "o": ["50 מעלות צלזיוס.", "70 מעלות צלזיוס.", "90 מעלות צלזיוס.", "120 מעלות צלזיוס."], "s": ["N2XY = בידוד XLPE.", "XLPE עמיד בטמפרטורת עבודה של 90°C."], "tp": "האות 2X בשם הכבל = XLPE (90°C). האות Y לבד = PVC (70°C)."}, {"n": 89, "t": "calc", "a": 3, "c": 2, "f": 1, "q": "נתונה רשת תלת-מופעית המוזנת ב-400V/50Hz (A ← 50m ← B ← 50m ← C). מוליכי הרשת עשויים נחושת, γ = 57. בנקודה B: 30kW, cosφ = 0.6 השראתי, ובנקודה C: 30kW, cosφ = 0.6 השראתי. חשב את הזרם הכללי ברשת:", "e": "כל צרכן: I = 30000/(√3×400×0.6) ≈ 72.2A. מקדם ההספק זהה, ולכן מחברים חשבונית: 144.3A.", "w": ["", "", "", ""], "o": ["60.2A", "86.6A", "115.5A", "144.3A"], "s": ["כל צרכן: I = 30000/(√3 × 400 × 0.6) ≈ 72.2A.", "לשניהם אותו cosφ, אז הזרמים באותו כיוון ומחברים אותם רגיל.", "הזרם הכללי: 2 × 72.2 = 144.3A."], "tp": "אם ה-cosφ שונה – חייבים לחבר וקטורית (חלק ממשי ומדומה בנפרד)."}, {"n": 90, "t": "calc", "a": 1, "c": 1, "f": 1, "q": "נתונה רשת תלת-מופעית המוזנת 400V/50Hz. מוליכי הרשת עשויים נחושת, γ = 57. קבע את שטח החתך התקני של המוליכים כך שמפל המתח המרבי ברשת יהיה 3%. (A ← 45m ← B ← 45m ← C, בכל נקודה זרם 46.39−40.91j A)", "e": "ΔU = 12V. לפי הזרמים הפעילים: A = √3×46.39×(45 + 90)/(57×12) ≈ 15.9 ממ\"ר. החתך התקני: 16 ממ\"ר.", "w": ["קטן מדי.", "", "אינו חתך תקני.", "גדול מהנדרש."], "o": ["10mm²", "16mm²", "20mm²", "25mm²"], "s": ["מפל מותר: 3% × 400 = 12V.", "מחשבים לפי הזרם הפעיל: √3 × Ia × Σl / (γ × ΔU).", "הקטע הראשון מוביל 2 × 46.39A לאורך 45m, השני 46.39A לאורך 45m. כלומר 46.39 × (45 + 90).", "A = 1.732 × 46.39 × 135/(57 × 12) ≈ 15.9 ממ\"ר, ולכן 16 ממ\"ר."], "tp": "γ = 1/ρ. כש-γ = 57 מחלקים ב-57 במקום להכפיל ב-ρ."}, {"n": 91, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "נתונה רשת תלת-מופעית, U = 400V, מוליכים מנחושת, ρ = 0.0175. חשב את שטח החתך המסחרי כך שאחוז הפסד ההספק המרבי לא יעלה על 1.5%. הזנח את מפלי המתח לאורך הקו. (A ← 80m ← B ← 80m ← C, בכל נקודה 56−42j A)", "e": "P ≈ √3×400×112 ≈ 77.6kW. עם 95 ממ\"ר: ΔP = 3ρ/A×(140²×80 + 70²×80) ≈ 1.08kW, כלומר כ-1.4%, מתחת ל-1.5%. החתך המסחרי המינימלי מבין התשובות: 95 ממ\"ר.", "w": ["אינו חתך מסחרי.", "אינו חתך מסחרי.", "", "גדול מהנדרש."], "o": ["135 mm²", "140 mm²", "95 mm²", "160 mm²"], "s": ["הספק כולל: P ≈ √3 × 400 × 112 ≈ 77.6kW, מותר 1.5% ≈ 1.16kW הפסד.", "זרמים: בקטע AB ≈ 140A, בקטע BC ≈ 70A.", "עם 95 ממ\"ר: ΔP = 3 × (0.0175/95) × (140² × 80 + 70² × 80) ≈ 1.08kW, כלומר כ-1.4%.", "עומד בדרישה, ולכן 95 ממ\"ר."], "tp": "בודקים את החתך הקטן ביותר מבין התשובות – אם הוא עומד, הוא התשובה."}, {"n": 92, "t": "calc", "a": 3, "c": 1, "f": 1, "q": "נתונה רשת תלת-מופעית 400V/50Hz, מוליכים עשויים חמרן (ρ = 1/34). היגב השראתי של המוליכים 0.38Ω/km. חשב את שטח החתך המסחרי של מוליכי הרשת, אם המפל המתח המרבי המותר הוא 5%. (70m, צרכן 55A, cosφ = 0.8 השראתי)", "e": "ΔU = √3·I·l·(R·cosφ + X·sinφ). עם 6 ממ\"ר יוצא כ-6.9%, ועם 10 ממ\"ר כ-4.3% – רק 10 ממ\"ר עומד ב-5%.", "w": ["", "", "מפל של כ-6.9%.", ""], "o": ["2.5 mm²", "4 mm²", "6 mm²", "10 mm²"], "s": ["ΔU = √3 × I × l × (R × cosφ + X × sinφ).", "מותר 5% = 20V.", "מנסים חתכים: 6 ממ\"ר → כ-6.9% (גבוה מדי). 10 ממ\"ר → כ-4.3%.", "לכן 10 ממ\"ר."], "tp": "כשנתון היגב (X) – חייבים להכניס את sinφ לחישוב."}, {"n": 93, "t": "calc", "a": 2, "c": 2, "f": 1, "q": "נתונה רשת תלת-מופעית עם שני צרכנים: SM1 = 10+5j kVA (בנקודה B), SM2 = 20−10j kVA (בנקודה C). מה ההספק בקטע AB?", "e": "בקטע AB עובר ההספק של שני הצרכנים: (10+5j) + (20−10j) = 30−5j kVA.", "w": ["זה רק SM1.", "זה רק SM2.", "", "שגוי."], "o": ["10+5j kVA", "20−10j kVA", "30−5j kVA", "40−5j kVA"], "s": ["בקטע AB עובר ההספק של כל מה שאחריו: SM1 + SM2.", "(10 + 5j) + (20 − 10j) = 30 − 5j kVA."], "tp": "מחברים חלק ממשי עם ממשי, ומדומה עם מדומה."}, {"n": 94, "t": "calc", "a": 0, "c": 1, "f": 1, "q": "נתונה רשת תלת-מופעית 400V/50Hz, מוליכים מנחושת γ = 57, היגב X0 = 0.4×10⁻³ Ω/m. חשב את שטח החתך של מוליכי הרשת, אם ידוע שמפל המתח המרבי המותר הוא 3%. (A ← 35m ← B: 10A cosφ 0.7 השראתי ← 50m ← C: 10A cosφ 1)", "e": "עם 10 ממ\"ר מפל המתח רק כ-0.9%, הרבה מתחת ל-3%. לכן החתך הקטן ביותר מבין התשובות (10 ממ\"ר) מספיק.", "w": ["", "גדול מהנדרש.", "גדול מהנדרש.", "גדול מהנדרש."], "o": ["10mm²", "16mm²", "25mm²", "35mm²"], "s": ["מחשבים מפל מתח בחתך הקטן ביותר (10 ממ\"ר) עם ההיגב.", "יוצא כ-0.9% – הרבה מתחת ל-3%.", "לכן 10 ממ\"ר מספיק."], "tp": "מתחילים מהחתך הקטן. אם הוא עומד – אין צורך לבדוק גדולים יותר."}, {"n": 95, "t": "calc", "a": 1, "c": 2, "f": 1, "q": "נתונה רשת (400V): בנקודה B 10A cosφ = 0.8 קיבולי, ובנקודה C 10A cosφ = 0.8 קיבולי. מצא את הזרם בקטע AB:", "e": "כל צרכן קיבולי: 10×(0.8 + 0.6j) = 8+6j A. בקטע AB עובר זרם שניהם: 16+12j A.", "w": ["", "", "", "זה זרם צרכן אחד."], "o": ["IAB = 18+20j A", "IAB = 16+12j A", "IAB = 13+12j A", "IAB = 8+6j A"], "s": ["קיבולי = הזרם מקדים, ולכן החלק המדומה חיובי.", "כל צרכן: 10 × (0.8 + 0.6j) = 8 + 6j A.", "בקטע AB עוברים שניהם: 16 + 12j A."], "tp": "השראתי = −j, קיבולי = +j."}, {"n": 96, "t": "cable", "a": 1, "c": 2, "f": 0, "q": "כבל מסוג NYY, בידוד PVC (שחור), עמיד בטמפרטורה של עד:", "e": "בידוד PVC עמיד ב-70°C בעבודה רציפה.", "w": ["", "", "זה XLPE.", ""], "o": ["50 מעלות צלזיוס.", "70 מעלות צלזיוס.", "90 מעלות צלזיוס.", "120 מעלות צלזיוס."], "s": ["NYY = בידוד PVC.", "PVC עמיד בטמפרטורת עבודה של 70°C."], "tp": "PVC = 70°C, XLPE = 90°C."}, {"n": 97, "t": "calc", "a": 2, "c": 2, "f": 1, "q": "נתונה רשת (400V): בנקודה B 15A cosφ = 0.8 השראתי, ובנקודה C 15A cosφ = 0.8 השראתי. חשב את הזרם בקטע AB:", "e": "כל צרכן: 15×(0.8 − 0.6j) = 12−9j A. בקטע AB: 24−18j A.", "w": ["", "", "", "זה זרם צרכן אחד."], "o": ["IAB = 40−18j A", "IAB = 30−15j A", "IAB = 24−18j A", "IAB = 12−9j A"], "s": ["השראתי = הזרם מפגר, ולכן החלק המדומה שלילי.", "כל צרכן: 15 × (0.8 − 0.6j) = 12 − 9j A.", "בקטע AB: 24 − 18j A."], "tp": "sinφ כש-cosφ = 0.8 הוא 0.6 – שווה לזכור."}, {"n": 98, "t": "calc", "a": 3, "c": 1, "f": 1, "q": "נתונה רשת תלת-מופעית 400V/50Hz, מוליכים עשויים חמרן, התנגדות סגולית 0.027, היגב השראתי 0.38Ω/km. חשב את שטח החתך המסחרי של מוליכי הרשת, אם המפל המתח המרבי המותר הוא 5%. (A ← 25m ← B: 10A cos0.8 ← 25m ← C: 10A cos0.8)", "e": "עם 1.5 ממ\"ר מפל המתח ≈ 4.75%, עדיין מתחת ל-5%. לכן 1.5 ממ\"ר מספיק.", "w": ["גדול מהנדרש.", "גדול מהנדרש.", "גדול מהנדרש.", ""], "o": ["6 mm²", "4 mm²", "2.5 mm²", "1.5 mm²"], "s": ["מותר 5% = 20V.", "זרמים: AB = 16 − 12j A, BC = 8 − 6j A.", "מנסים את החתך הקטן (1.5 ממ\"ר) עם R ו-X: יוצא כ-4.75%.", "עומד בדרישה, ולכן 1.5 ממ\"ר."], "tp": "קשה להאמין שהקטן מספיק? קטעים קצרים (25m) = מפל קטן."}, {"n": 99, "t": "calc", "a": 0, "c": 2, "f": 1, "q": "מהו מפל המתח הכולל ברשת המוצגת באיור? לרשת חתך אחיד של 10 ממ\"ר ומוליכי הקו עשויים נחושת, ρ = 0.018. (230V DC, שלושה קטעים של 50m: PA = 3KW η = 89%, PB = 2.5KW η = 85%, PC = 3KW η = 89%)", "e": "זרמי כניסה (כולל נצילות): IA ≈ 14.66A, IB ≈ 12.79A, IC ≈ 14.66A. ΔU = 2ρ/A×[(42.1)×50 + (27.4)×50 + 14.66×50] ≈ 15.15V.", "w": ["", "", "", ""], "o": ["15.15V", "12.17V", "10.15V", "4.5V"], "s": ["זרמי כניסה כולל נצילות: IA = 3000/(0.89 × 230) ≈ 14.66A ; IB = 2500/(0.85 × 230) ≈ 12.79A ; IC ≈ 14.66A.", "זרמי הקטעים: 42.1A, 27.4A, 14.66A.", "זרם ישר: ΔU = 2 × (ρ/A) × Σ(I × l) = 2 × 0.0018 × 50 × (42.1 + 27.4 + 14.66) ≈ 15.15V."], "tp": "בכל קטע עובר הזרם של כל הצרכנים שאחריו."}, {"n": 100, "t": "calc", "a": 3, "c": 1, "f": 1, "q": "חשב את שטח החתך המסחרי המתאים לרשת הנתונה באיור (250V DC, ρ = 0.0175; קטעים 30m, 80m, 50m, 60m עם עומסים 37A, 22A, 51A, 30A). איבוד ההספק בכל הרשת הוא 3% מההספק במבוא.", "e": "זרמי הקטעים: 140, 103, 81, 30A. Pin = 250×140 = 35kW, ΔP = 1050W. A = 2ρΣ(I²l)/ΔP ≈ 60.6 ממ\"ר. החתך המסחרי שמעליו: 70 ממ\"ר.", "w": ["קטן מדי.", "קטן מדי.", "אינו חתך מסחרי.", ""], "o": ["35mm²", "50mm²", "65mm²", "70mm²"], "s": ["זרמי הקטעים מהסוף להתחלה: 30, 81, 103, 140A.", "הספק במבוא: 250 × 140 = 35kW, מותר 3% = 1050W.", "A = 2ρ × Σ(I² × l)/ΔP = 2 × 0.0175 × (140² × 30 + 103² × 80 + 81² × 50 + 30² × 60)/1050 ≈ 60.6 ממ\"ר.", "החתך המסחרי שמעל: 70 ממ\"ר."], "tp": "חתך 65 לא קיים במסחר – מלכודת."}, {"n": 101, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "מהו מפל המתח האקטיבי באחוזים בין הנקודות a ו-b באיור? שטח החתך בקטע זה של הקו הוא 25 ממ\"ר, הקו עשוי נחושת, ρ = 0.018. מתח מקור 380V ~3. (L = 120m; PA = 25KW η = 85% cos0.8 ; SB = 15KVA η = 80% cos0.82)", "e": "IA = 25000/(0.85×√3×380×0.8) ≈ 55.9A ; IB = 15000/(0.8×√3×380) ≈ 28.5A. הזרם האקטיבי: 55.9×0.8 + 28.5×0.82 ≈ 68.1A. ΔU = √3×0.018/25×120×68.1 ≈ 10.2V, כלומר ≈ 2.68%.", "w": ["", "", "", ""], "o": ["≈ 7.21%", "≈ 5.73%", "≈ 2.68%", "≈ 1.45%"], "s": ["IA = 25000/(0.85 × √3 × 380 × 0.8) ≈ 55.9A ; IB = 15000/(0.8 × √3 × 380) ≈ 28.5A.", "זרם אקטיבי: 55.9 × 0.8 + 28.5 × 0.82 ≈ 68.1A.", "ΔU = √3 × (ρ/A) × L × Ia = 1.732 × (0.018/25) × 120 × 68.1 ≈ 10.2V.", "באחוזים: 10.2/380 ≈ 2.68%."], "tp": "\"מפל מתח אקטיבי\" = רק החלק הפעיל של הזרם (I × cosφ)."}, {"n": 102, "t": "calc", "a": 0, "c": 2, "f": 1, "q": "חשב איבוד הספק ברשת החד-מופעית המוצגת באיור. התנגדות המוליך לכל אורך הקו r' = 0.52Ω/km. אורך המוליכים עד הצרכנים הינו מוליך הפאזה בלבד, יש להתחשב גם באורך מוליך האפס. (120m עד צרכן 30A cos0.85, ועוד 80m עד צרכן 25A cos0.9)", "e": "בקטע הראשון עובר ≈ 54.9A (חיבור וקטורי), ובשני 25A. ΔP = 2r'×(54.9²×120 + 25²×80) ≈ 428W. מכפילים ב-2 בגלל מוליך האפס.", "w": ["", "", "", ""], "o": ["428.42W", "127.52W", "520.32W", "274.65W"], "s": ["בקטע הראשון (120m) עוברים שני הזרמים – מחברים וקטורית ≈ 54.9A. בקטע השני (80m) רק 25A.", "r' = 0.52Ω/km = 0.00052Ω/m.", "חד-מופעי = פאזה + אפס, ולכן מכפילים ב-2.", "ΔP = 2 × 0.00052 × (54.9² × 120 + 25² × 80) ≈ 428W."], "tp": "בחד-מופעי לא לשכוח את מוליך האפס – פי 2."}, {"n": 103, "t": "calc", "a": 2, "c": 1, "f": 1, "q": "בחר חתך מסחרי המבטיח שאיבודי המתח הכוללים ברשת החד-מופעית המתוארת באיור יהיו 3% לכל היותר ממתח המקור. מוליכי הרשת עשויים נחושת, ρ = 0.018. (230V; L1 = 20m עם IA = 15A cos0.87 ; L2 = 20m עם IB = 12A cos0.87)", "e": "ΔU = 2ρ/A×cosφ×(27×20 + 12×20). עם 4 ממ\"ר: ≈ 6.1V, כלומר 2.66%, מתחת ל-3%. עם 2.5 ממ\"ר יוצא 4.25% – גבוה מדי.", "w": ["", "מפל של 4.25%.", "", "גדול מהנדרש."], "o": ["1.5mm²", "2.5mm²", "4mm²", "6mm²"], "s": ["חד-מופעי: ΔU = 2 × (ρ/A) × cosφ × Σ(I × l).", "Σ = 27 × 20 + 12 × 20 = 780.", "עם 2.5 ממ\"ר: ≈ 4.25% (גבוה מדי). עם 4 ממ\"ר: ≈ 6.1V, כלומר 2.66%.", "לכן 4 ממ\"ר."], "tp": "בקטע הראשון הזרם הוא 15 + 12 = 27A."}, {"n": 104, "t": "pf", "a": 3, "c": 2, "f": 1, "q": "מהו מקדם ההספק של הרשת באיור, כלפי מקור המתח? כל הצרכנים ברשת השראתיים. (22A cos0.88, 15A cos0.8)", "e": "I1 = 19.36 − 10.45j ; I2 = 12 − 9j. סה\"כ 31.36 − 19.45j. cosφ = 31.36/36.9 ≈ 0.85.", "w": ["", "", "", ""], "o": ["0.88", "0.8", "0.9", "0.85"], "s": ["מפרקים כל זרם: I1 = 22 × (0.88 − 0.475j) = 19.36 − 10.45j ; I2 = 15 × (0.8 − 0.6j) = 12 − 9j.", "מחברים: 31.36 − 19.45j.", "cosφ = 31.36/√(31.36² + 19.45²) ≈ 0.85."], "tp": "מקדם הספק כולל = חיבור וקטורי, לא ממוצע."}, {"n": 105, "t": "cable", "a": 1, "c": 0, "f": 0, "q": "מהו הזרם המרבי שאפשר להעביר דרך כבל NAYY 5X10? הכבל מותקן בתוך תעלה משוקעת ברצפה והמכסה ללא פתחי אוורור. הטמפרטורה האופפת של האוויר היא 50°, הכבל מיועד להזנת צרכן תלת-מופעי.", "e": "Iz מהטבלה לכבל אלומיניום 10 ממ\"ר, כפול מקדם תיקון ל-50°C ולשיטת ההתקנה. את הערכים צריך לקחת מהטבלאות שלכם – התשובה לא אומתה.", "w": ["", "", "", ""], "o": ["25A", "34A", "46A", "30A"], "s": ["לוקחים מהטבלה את Iz של NAYY (אלומיניום) 10 ממ\"ר.", "מכפילים במקדם טמפרטורה (50°C) ובמקדם לשיטת ההתקנה (תעלה סגורה ברצפה).", "התשובה לא אומתה – לקחת את הערכים מהטבלאות שלכם."], "tp": "N-A-YY: האות A = אלומיניום, ולכן הזרם נמוך מנחושת באותו חתך."}, {"n": 106, "t": "cable", "a": 1, "c": 2, "f": 0, "q": "מה משמעות הסימון NAYY 1X10 0.6/1KV על גבי כבל?", "e": "N = תקן גרמני, A = אלומיניום, Y = בידוד PVC, Y = מעטה PVC. 1X10 = גיד אחד של 10 ממ\"ר. 0.6/1KV = 600V מופע-אדמה ו-1KV בין מופעים.", "w": ["A מסמן אלומיניום.", "", "1X = חד-גידי, ו-A = אלומיניום.", "1X = חד-גידי."], "o": ["כבל נחושת חד-גידי בחתך 10 ממ\"ר, בעל בידוד חיצוני P.V.C, המיועד למתח קווי 1KV ומתח 600 וולט בין מופע לאדמה.", "כבל אלומיניום חד-גידי בחתך 10 ממ\"ר, בעל בידוד חיצוני P.V.C, המיועד למתח קווי 1KV ומתח 600 וולט בין מופע לאדמה.", "כבל נחושת רב-גידי בחתך 10 ממ\"ר, בעל בידוד חיצוני P.V.C, המיועד למתח קווי 1KV ומתח 600 וולט בין מופע לאדמה.", "כבל נחושת רב-גידי בחתך 10 ממ\"ר, בעל בידוד חיצוני P.V.C (מנוסח פעמיים במאגר)."], "s": ["מפענחים: N = תקן גרמני (VDE), A = אלומיניום, Y = בידוד PVC, Y = מעטה PVC.", "1X10 = גיד אחד של 10 ממ\"ר.", "0.6/1KV = 600V בין מופע לאדמה ו-1KV בין מופעים."], "tp": "אין A בשם הכבל = נחושת. 2X = XLPE."}, {"n": 107, "t": "cable", "a": 1, "c": 0, "f": 0, "q": "מהו הזרם המתמיד שאפשר להעביר דרך כבל XLPE 3X25 המזין מעגל תלת-מופעי? הכבל מותקן במישרין באדמה עם כיסוי יחד עם עוד שני כבלים צמודים (סה\"כ שלושה כבלים צמודים). הטמפרטורה הסביבתית היא 45°C.", "e": "Iz מהטבלה (XLPE נחושת 25 ממ\"ר באדמה), כפול מקדם קיבוץ לשלושה כבלים וכפול מקדם טמפרטורה ל-45°C. צריך לבדוק בטבלאות שלכם – התשובה לא אומתה.", "w": ["", "", "", ""], "o": ["49A", "94A", "59A", "31A"], "s": ["לוקחים מהטבלה את Iz של XLPE 3×25 נחושת באדמה.", "מכפילים במקדם קיבוץ ל-3 כבלים ובמקדם טמפרטורה ל-45°C.", "התשובה לא אומתה – לבדוק בטבלאות שלכם."], "tp": "כל מקדם תיקון מקטין את הזרם – התשובה תמיד קטנה מערך הטבלה."}, {"n": 108, "t": "light", "a": 3, "c": 2, "f": 1, "q": "מהי עוצמת ההארה בנקודה P הנמצאת במרחק של 5.3 מטרים מעמוד שגובהו 15 מטרים? עוצמת האור לכיוון הנקודה היא 5,000 קנדלות.", "e": "E = I·cosα/r². r² = 15² + 5.3² = 253.1, cosα = 15/15.91 = 0.943. E = 5000×0.943/253.1 ≈ 18.62 לוקס.", "w": ["", "זה I/h² בלי זווית.", "", ""], "o": ["314 לוקס", "22.2 לוקס", "20.9 לוקס", "18.62 לוקס"], "s": ["מרחק מהנורה לנקודה: r² = h² + d² = 15² + 5.3² = 253.1, ולכן r ≈ 15.91.", "cosα = h/r = 15/15.91 = 0.943.", "E = I × cosα / r² = 5000 × 0.943 / 253.1 ≈ 18.62 לוקס."], "tp": "אפשר גם E = I × cos³α / h², ויוצא אותו דבר."}, {"n": 109, "t": "light", "a": 2, "c": 1, "f": 0, "q": "איזו נורה המציאו במיוחד לתאורת הכבישים?", "e": "נורת נתרן לחץ נמוך (האור הצהוב-כתום) פותחה לתאורת כבישים בזכות נצילות גבוהה מאוד.", "w": ["", "LED נכנסה לשימוש מאוחר הרבה יותר.", "", ""], "o": ["נורת הלוגן.", "נורת LED.", "נורת נתרן לחץ נמוך.", "נורה כספית שקופה."], "s": ["נורת נתרן לחץ נמוך פותחה לתאורת כבישים.", "היא בעלת נצילות גבוהה מאוד, עם אור צהוב-כתום."], "tp": "אור כתום בכבישים = נתרן."}, {"n": 110, "t": "light", "a": 2, "c": 0, "f": 0, "q": "מהו מקדם הנצילות (CU%) של תאורה כספית ישירה (מחזיר אור מתכתי) באולם צבוע לבן (גם קירות וגם תיקרה), בעל מידות: אורך 14 מ', רוחב 8 מ', מרחק ממקור האור עד לשטח עבודה 2.5 מ'?", "e": "מחשבים מקדם חדר: k = L·W/(h·(L+W)) = 112/(2.5×22) ≈ 2.0, ואז קוראים CU מהטבלה לפי מקדמי ההחזרה. צריך לבדוק בטבלה שלכם – התשובה לא אומתה.", "w": ["", "", "", ""], "o": ["56%", "59%", "61%", "66%"], "s": ["מחשבים מקדם חדר: k = (L × W)/(h × (L + W)) = 112/(2.5 × 22) ≈ 2.0.", "מקדמי החזרה לפי הצבע (לבן = גבוה).", "קוראים את CU מהטבלה של גוף התאורה. התשובה לא אומתה – לבדוק בטבלה שלכם."], "tp": "הנוסחה של מקדם החדר שימושית בכל שאלות התכנון."}, {"n": 111, "t": "light", "a": 1, "c": 1, "f": 0, "q": "מה גודלו של מקדם ההפחתה K עבור תאורה כספית ישירה, כמות אבק בינונית?", "e": "מקדמי הפחתה מקובלים: סביבה נקייה 0.8, אבק בינוני 0.7, מלוכלכת 0.6.", "w": ["סביבה נקייה.", "", "סביבה מלוכלכת.", ""], "o": ["0.8", "0.7", "0.6", "0.55"], "s": ["מקדמי הפחתה מקובלים לפי ניקיון הסביבה: נקי 0.8, אבק בינוני 0.7, מלוכלך 0.6."], "tp": "לזכור את הסולם: 0.8 / 0.7 / 0.6."}, {"n": 112, "t": "light", "a": 0, "c": 2, "f": 0, "q": "נתוני התאורה: מידות האולם 8X10 מטרים, מקדם הפחתה (K) 0.8, נצילות מתקן התאורה 58%, רמת ההארה הנדרשת 500 לוקס, שטף האור של נורה אחת 4,350 לומן. כמה נורות יש להזמין?", "e": "N = E·A/(K·η·Φ) = 500×80/(0.8×0.58×4350) ≈ 19.8, ולכן 20 נורות.", "w": ["", "", "", ""], "o": ["20 נורות.", "24 נורות.", "36 נורות.", "40 נורות."], "s": ["נוסחה: N = (E × A)/(K × η × Φ).", "A = 8 × 10 = 80 מ\"ר.", "N = 500 × 80/(0.8 × 0.58 × 4350) ≈ 19.8.", "מעגלים למעלה: 20 נורות."], "tp": "מספר נורות תמיד מעגלים כלפי מעלה."}, {"n": 113, "t": "light", "a": 1, "c": 2, "f": 0, "q": "בחישוב רמת ההארה בנקודה שנמצאת בין 2 עמודי התאורה יש לעשות:", "e": "הארה ממקורות שונים מצטברת, ולכן מחברים את ההארה מכל פנס.", "w": ["ממוצע מקטין את התוצאה.", "", "שגוי.", "שגוי."], "o": ["לחשב את רמת ההארה מכל פנס בנפרד ולחשב ערך ממוצע.", "לחשב את רמת ההארה מכל פנס בנפרד ולחבר ביניהם.", "לחשב את רמת ההארה מכל פנס בנפרד לחלק הכפלה בסכום (כמו נגדים במקביל).", "לחשב את רמת ההארה מכל פנס בנפרד ולהכפיל זה בזה."], "s": ["הארה ממקורות שונים מצטברת.", "מחשבים את ההארה מכל פנס בנפרד (E = I × cosα/r²).", "מחברים את התוצאות."], "tp": "ממוצע זו טעות נפוצה – התאורה מתחברת."}, {"n": 114, "t": "light", "a": 1, "c": 2, "f": 0, "q": "אפקט סטרובוסקופי מתחרש בנורות מהסוג הבא:", "e": "נורת פריקה (פלואורסצנט) מהבהבת 100 פעם בשנייה, ולכן חלקים מסתובבים עלולים להיראות עומדים.", "w": ["", "", "בליבון החוט לא מספיק להתקרר, ולכן אין הבהוב משמעותי.", "כמו ליבון."], "o": ["לד.", "פלואורסצנט.", "ליבון.", "הלוגן."], "s": ["נורת פלואורסצנט (פריקה) נכבית ונדלקת 100 פעם בשנייה (פעמיים בכל מחזור של 50Hz).", "מכונה שמסתובבת באותו קצב נראית עומדת – אפקט סטרובוסקופי."], "tp": "ליבון והלוגן: החוט נשאר חם, ולכן אין הבהוב."}, {"n": 115, "t": "dwell", "a": 0, "c": 0, "f": 0, "q": "מספר בתי תקע מינימלי שיש להתקין בכל חדר במתקן ביתי הוא:", "e": "התקנות מחייבות מספר מזערי של בתי תקע בחדר. התשובה המקובלת היא שניים לפחות. כדאי לוודא מול התקנות.", "w": ["", "", "", ""], "o": ["שני בתי תקע לפחות.", "בית תקע אחד לפחות.", "שלושה בתי תקע לפחות.", "אין תקנה המחייבת במספר מינימלי של בתי תקע במתקן ביתי."], "s": ["התקנות קובעות מספר מזערי של בתי תקע בחדר.", "התשובה המקובלת: שניים לפחות. לוודא מול התקנות."], "tp": "\"אין תקנה\" כמעט תמיד מלכודת."}, {"n": 116, "t": "light", "a": 1, "c": 2, "f": 0, "q": "נצילות אורית היא:", "e": "נצילות אורית = לומן לוואט (lm/W).", "w"
